[project]
name = "aicam-platform"
version = "0.1.0"
description = "Shared edge-AI + cloud platform for the AI Camera Systems monorepo"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
]
[project.optional-dependencies]
detect = ["ultralytics>=8.3", "supervision>=0.20"]
face = ["insightface>=0.7", "onnxruntime>=1.17"]
alerts = ["httpx>=0.27", "twilio>=9.0"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
