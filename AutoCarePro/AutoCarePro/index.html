<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AutoCare Pro — Smart Vehicle Maintenance System</title>
  <meta name="description" content="AutoCare Pro (SVMS) — a smart vehicle maintenance system: multi-vehicle management, service intelligence, vehicle health scoring, expense analytics and an environmental wash advisor." />
  <meta name="theme-color" content="#070809" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AutoCare Pro" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <!-- Web fonts are a progressive enhancement: solid system fallbacks are
       declared in variables.css, so the app looks correct offline too. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/vehicles.css" />
  <link rel="stylesheet" href="css/maintenance.css" />
  <link rel="stylesheet" href="css/wash-advisor.css" />
  <link rel="stylesheet" href="css/analytics.css" />
  <link rel="stylesheet" href="css/expenses.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
  <a class="skip-link" href="#view">Skip to main content</a>

  <!-- ===================================================== splash screen == -->
  <div class="splash" id="splash" role="status" aria-label="AutoCare Pro is starting">
    <div class="splash__grid" aria-hidden="true"></div>
    <div class="splash__glow" aria-hidden="true"></div>
    <div class="splash__inner">
      <div class="splash__logo" aria-hidden="true">
        <svg width="72" height="72" viewBox="0 0 48 48" fill="none">
          <defs>
            <linearGradient id="splashShield" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff2b24" />
              <stop offset="100%" stop-color="#8c0300" />
            </linearGradient>
          </defs>
          <path d="M24 3.5 8 9.4v12.4c0 9.7 6.8 18.4 16 21.2 9.2-2.8 16-11.5 16-21.2V9.4z"
                fill="#0d0f12" stroke="url(#splashShield)" stroke-width="2.4" />
          <path d="M17 17.6 24 14l7 3.6" stroke="#ff2b24" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="17" cy="17.6" r="2" fill="#ff2b24" />
          <circle cx="31" cy="17.6" r="2" fill="#ff2b24" />
          <circle cx="24" cy="14" r="2" fill="#ff5b55" />
          <path d="m17.6 25.8 4.6 4.8 9-9.4" stroke="#39ff88" stroke-width="3.2"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <h1 class="splash__wordmark">AutoCare<span>// PRO</span></h1>
      <div class="splash__line" aria-hidden="true"></div>
      <p class="splash__title">Smart Vehicle Maintenance System</p>
      <div class="splash__loader" aria-hidden="true"></div>
      <p class="splash__status"><span class="dot" aria-hidden="true"></span> System initializing…</p>
    </div>
  </div>

  <!-- ====================================================== app shell ===== -->
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar"><!-- rendered by app.js --></aside>
    <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar" id="topbar"><!-- rendered by app.js --></header>
      <header class="mobile-topbar" id="mobileTopbar"><!-- rendered by app.js --></header>

      <main class="content" id="view" tabindex="-1">
        <!-- Skeleton shown for the split second before the first route renders -->
        <div class="page">
          <div class="skeleton skeleton--title"></div>
          <div class="grid grid--metrics">
            <div class="skeleton skeleton--card"></div>
            <div class="skeleton skeleton--card"></div>
            <div class="skeleton skeleton--card"></div>
            <div class="skeleton skeleton--card"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" id="mobileNav" aria-label="Primary mobile"></nav>

  <!-- ====================================================== overlays ====== -->
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="palette" id="palette" hidden></div>
  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

  <!-- Chart.js is vendored locally so the app works offline and needs no CDN -->
  <script src="vendor/chart.umd.js"></script>

  <!-- Foundation -->
  <script src="js/utils.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/validation.js"></script>

  <!-- Business logic -->
  <script src="js/maintenance.js"></script>
  <script src="js/health.js"></script>
  <script src="js/environment.js"></script>
  <script src="js/journeys.js"></script>
  <script src="js/washAdvisor.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/notifications.js"></script>

  <!-- Presentation -->
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/router.js"></script>

  <!-- Pages -->
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/vehicles.js"></script>
  <script src="js/pages/maintenance.js"></script>
  <script src="js/pages/wash.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/settings.js"></script>

  <!-- Bootstrap -->
  <script src="js/app.js"></script>
</body>
</html>
