  <script>
/* ===== js/maintenance.js ===== */
/* ==========================================================================
   AutoCare Pro — maintenance.js
   Maintenance records + the "when is this due?" intelligence.

   ALGORITHM — Service due calculation
   ----------------------------------
   For every serviceable type we take the most recent record for the vehicle
   and derive two independent deadlines:

     dueOdometer = record.nextServiceOdometer  ?? record.odometer + interval.km
     dueDate     = record.nextServiceDate      ?? record.date + interval.months

   Remaining distance and remaining days are then compared against the
   thresholds in constants.js:

     remainingKm < 0   OR remainingDays < 0   -> OVERDUE
     remainingKm <= 500 OR remainingDays <= 15 -> DUE SOON
     otherwise                                 -> UPCOMING

   Whichever deadline is closer decides the status, so a car that is driven
   rarely is still flagged on time, and a car driven hard is flagged early.
   ========================================================================== */

window.AC = window.AC || {};

AC.maintenance = (function () {
  "use strict";

  const U = AC.utils;
  const C = AC.constants;
  const S = AC.storage;

  const STATUS = {
    OVERDUE: "overdue",
    DUE_SOON: "due-soon",
    UPCOMING: "upcoming",
    UNKNOWN: "unknown",
  };

  const STATUS_META = {
    [STATUS.OVERDUE]: { label: "OVERDUE", tone: "critical", rank: 0 },
    [STATUS.DUE_SOON]: { label: "DUE SOON", tone: "warning", rank: 1 },
    [STATUS.UPCOMING]: { label: "UPCOMING", tone: "success", rank: 2 },
    [STATUS.UNKNOWN]: { label: "NOT RECORDED", tone: "muted", rank: 3 },
  };

  /* ------------------------------------------------------------ queries -- */

  const all = () => S.list("maintenanceRecords");

  const forVehicle = (vehicleId) =>
    U.sortBy(all().filter((r) => r.vehicleId === vehicleId), (r) => r.date, "desc");

  /** Most recent record per service type for one vehicle. */
  function latestByType(vehicleId) {
    const map = {};
    forVehicle(vehicleId).forEach((rec) => {
      const prev = map[rec.type];
      if (!prev || U.toDate(rec.date) > U.toDate(prev.date)) map[rec.type] = rec;
    });
    return map;
  }

  /* ---------------------------------------------------------- algorithm -- */

  /**
   * Compute the due-state of one service type for one vehicle.
   * Returns null when the type has no interval (repairs, "other").
   */
  function statusFor(vehicle, typeDef, record) {
    if (!typeDef || (!typeDef.km && !typeDef.months)) return null;

    if (!record) {
      return {
        type: typeDef.key,
        label: typeDef.label,
        system: typeDef.system,
        status: STATUS.UNKNOWN,
        remainingKm: null,
        remainingDays: null,
        dueOdometer: null,
        dueDate: null,
        consumed: 0,
        interval: { km: typeDef.km, months: typeDef.months },
        record: null,
      };
    }

    const odo = Number(vehicle.odometer) || 0;

    const dueOdometer = U.isNum(record.nextServiceOdometer)
      ? Number(record.nextServiceOdometer)
      : typeDef.km
      ? (Number(record.odometer) || 0) + typeDef.km
      : null;

    const dueDate = record.nextServiceDate
      ? U.toDate(record.nextServiceDate)
      : typeDef.months
      ? U.addMonths(record.date, typeDef.months)
      : null;

    const remainingKm = dueOdometer === null ? null : dueOdometer - odo;
    const remainingDays = dueDate === null ? null : -U.daysBetween(dueDate);

    // Fraction of the interval already consumed — drives the progress bar.
    const kmConsumed =
      dueOdometer !== null && typeDef.km
        ? U.clamp((odo - (Number(record.odometer) || 0)) / typeDef.km, 0, 2)
        : 0;
    const dayConsumed =
      dueDate !== null && typeDef.months
        ? U.clamp(U.daysBetween(record.date) / (typeDef.months * 30.44), 0, 2)
        : 0;
    const consumed = Math.max(kmConsumed, dayConsumed);

    let status = STATUS.UPCOMING;
    const overdue =
      (remainingKm !== null && remainingKm < 0) || (remainingDays !== null && remainingDays < 0);
    const dueSoon =
      (remainingKm !== null && remainingKm <= C.SERVICE_THRESHOLDS.dueSoonKm) ||
      (remainingDays !== null && remainingDays <= C.SERVICE_THRESHOLDS.dueSoonDays);

    if (overdue) status = STATUS.OVERDUE;
    else if (dueSoon) status = STATUS.DUE_SOON;

    return {
      type: typeDef.key,
      label: typeDef.label,
      system: typeDef.system,
      status,
      remainingKm,
      remainingDays,
      dueOdometer,
      dueDate: dueDate ? U.isoDate(dueDate) : null,
      consumed,
      interval: { km: typeDef.km, months: typeDef.months },
      record,
    };
  }

  /**
   * Full service schedule for a vehicle, most urgent first.
   * `includeUnrecorded` adds types the owner has never logged so the UI can
   * invite them to record a baseline.
   */
  function scheduleFor(vehicle, { includeUnrecorded = false } = {}) {
    if (!vehicle) return [];
    const latest = latestByType(vehicle.id);
    const rows = [];

    C.MAINTENANCE_TYPES.forEach((typeDef) => {
      const rec = latest[typeDef.key];
      if (!rec && !includeUnrecorded) return;
      const st = statusFor(vehicle, typeDef, rec || null);
      if (st) rows.push(st);
    });

    return rows.sort((a, b) => {
      const rank = STATUS_META[a.status].rank - STATUS_META[b.status].rank;
      if (rank !== 0) return rank;
      const ak = a.remainingKm === null ? Infinity : a.remainingKm;
      const bk = b.remainingKm === null ? Infinity : b.remainingKm;
      return ak - bk;
    });
  }

  /** The single most urgent service for a vehicle (used on the hero card). */
  function nextService(vehicle) {
    const rows = scheduleFor(vehicle).filter((r) => r.status !== STATUS.UNKNOWN);
    return rows.length ? rows[0] : null;
  }

  /** Aggregate due/overdue counts across a fleet — powers dashboard metrics. */
  function fleetSummary(vehicles) {
    let dueSoon = 0;
    let overdue = 0;
    const items = [];
    vehicles.forEach((v) => {
      scheduleFor(v).forEach((row) => {
        if (row.status === STATUS.OVERDUE) {
          overdue += 1;
          items.push({ vehicle: v, row });
        } else if (row.status === STATUS.DUE_SOON) {
          dueSoon += 1;
          items.push({ vehicle: v, row });
        }
      });
    });
    return { dueSoon, overdue, items };
  }

  /* -------------------------------------------------------------- writes -- */

  /**
   * Persist a maintenance record. Side effects, all intentional:
   *   - the vehicle's odometer moves forward if the record is newer
   *   - lastServiceDate / lastServiceOdometer are refreshed
   *   - an optional linked expense is created in the same transaction
   */
  function addRecord(value) {
    const record = S.insert("maintenanceRecords", {
      vehicleId: value.vehicleId,
      type: value.type,
      date: value.date,
      odometer: Number(value.odometer),
      cost: Number(value.cost) || 0,
      notes: value.notes || "",
      nextServiceDate: value.nextServiceDate || null,
      nextServiceOdometer: U.isNum(value.nextServiceOdometer)
        ? Number(value.nextServiceOdometer)
        : null,
      source: "user",
    });

    S.update((db) => {
      const v = db.vehicles.find((x) => x.id === value.vehicleId);
      if (!v) return;
      if (Number(value.odometer) > (Number(v.odometer) || 0)) v.odometer = Number(value.odometer);
      const prevDate = U.toDate(v.lastServiceDate);
      const thisDate = U.toDate(value.date);
      if (!prevDate || (thisDate && thisDate >= prevDate)) {
        v.lastServiceDate = value.date;
        v.lastServiceOdometer = Number(value.odometer);
      }
    });

    if (value.logExpense && Number(value.cost) > 0) {
      S.insert("expenses", {
        vehicleId: value.vehicleId,
        category: value.type === "repair" ? "repair" : "maintenance",
        amount: Number(value.cost),
        date: value.date,
        description: `${C.maintenanceLabel(value.type)} — logged with service record`,
        linkedRecordId: record.id,
        source: "user",
      });
    }

    return record;
  }

  function updateRecord(id, value) {
    return S.patch("maintenanceRecords", id, {
      type: value.type,
      date: value.date,
      odometer: Number(value.odometer),
      cost: Number(value.cost) || 0,
      notes: value.notes || "",
      nextServiceDate: value.nextServiceDate || null,
      nextServiceOdometer: U.isNum(value.nextServiceOdometer)
        ? Number(value.nextServiceOdometer)
        : null,
    });
  }

  /** Deleting a record also removes the expense it created, if any. */
  function deleteRecord(id) {
    S.update((db) => {
      db.maintenanceRecords = db.maintenanceRecords.filter((r) => r.id !== id);
      db.expenses = db.expenses.filter((e) => e.linkedRecordId !== id);
    });
  }

  /** Total spent on maintenance + repair records (optionally per vehicle). */
  function totalCost(vehicleId = null) {
    return U.sum(
      all().filter((r) => !vehicleId || r.vehicleId === vehicleId),
      (r) => r.cost
    );
  }

  return {
    STATUS,
    STATUS_META,
    all,
    forVehicle,
    latestByType,
    statusFor,
    scheduleFor,
    nextService,
    fleetSummary,
    addRecord,
    updateRecord,
    deleteRecord,
    totalCost,
  };
})();

  </script>
  <script>
/* ===== js/health.js ===== */
/* ==========================================================================
   AutoCare Pro — health.js
   Vehicle Health Score (0–100) per subsystem and overall.

   ALGORITHM
   ---------
   Each subsystem (engine / brakes / tyres / battery) starts at 100 and loses
   points for three transparent reasons:

   1. SERVICE WEAR — for every maintenance type that belongs to the subsystem
      we know how much of its recommended interval has been consumed
      (`consumed`, from maintenance.js — 1.0 means exactly due, 1.4 means 40%
      past due). The worst type in the subsystem drives the penalty:

         consumed <= 1 :  penalty = consumed² * 15          (0 … 15)
         consumed  > 1 :  penalty = 15 + (consumed-1) * 50  (capped at 60)

      The curve is quadratic on purpose: being halfway through an oil-change
      interval is not "half unhealthy", but the last stretch before a service
      matters, and going past due degrades quickly.

      A subsystem with no service history at all is penalised a flat 25 —
      an unknown history is not the same as a healthy one.

   2. AGE — 0.8 points per year since the model year, capped at 10.

   3. ODOMETER — 6 points per 100,000 km travelled, capped at 10.

   The overall score is the weighted mean of the four subsystems
   (engine 35%, brakes 25%, tyres 20%, battery 20%) with an extra deduction
   for every currently OVERDUE service, because an overdue item is a present
   risk rather than gradual wear.

   Every value is clamped to 0–100 and the reasons are returned alongside the
   numbers so the UI can explain the score instead of just showing it.
   ========================================================================== */

window.AC = window.AC || {};

AC.health = (function () {
  "use strict";

  const U = AC.utils;
  const C = AC.constants;
  const M = AC.maintenance;

  const SYSTEMS = ["engine", "tyres", "battery", "brakes"];

  const NO_HISTORY_PENALTY = 25;
  const AGE_PER_YEAR = 0.8;
  const AGE_CAP = 10;
  const ODO_PER_100K = 6;
  const ODO_CAP = 10;
  const OVERDUE_PENALTY = 4;

  function wearPenalty(consumed) {
    if (consumed <= 1) return consumed * consumed * 15;
    return Math.min(60, 15 + (consumed - 1) * 50);
  }

  /**
   * @param {object} vehicle
   * @returns {{overall:number, engine:number, tyres:number, battery:number,
   *            brakes:number, band:object, factors:object[]}}
   */
  function calculateVehicleHealth(vehicle) {
    if (!vehicle) {
      return { overall: 0, engine: 0, tyres: 0, battery: 0, brakes: 0, band: C.healthBand(0), factors: [] };
    }

    const schedule = M.scheduleFor(vehicle);
    const byType = schedule.reduce((acc, row) => {
      acc[row.type] = row;
      return acc;
    }, {});

    const currentYear = new Date().getFullYear();
    const ageYears = Math.max(0, currentYear - (Number(vehicle.year) || currentYear));
    const agePenalty = Math.min(AGE_CAP, ageYears * AGE_PER_YEAR);
    const odoPenalty = Math.min(ODO_CAP, ((Number(vehicle.odometer) || 0) / 100000) * ODO_PER_100K);

    const scores = {};
    const factors = [];

    SYSTEMS.forEach((system) => {
      const types = C.MAINTENANCE_TYPES.filter((t) => t.system === system);
      let worst = null;

      types.forEach((t) => {
        const row = byType[t.key];
        if (!row || row.status === M.STATUS.UNKNOWN) return;
        if (!worst || row.consumed > worst.consumed) worst = row;
      });

      let penalty;
      let reason;
      if (!worst) {
        penalty = NO_HISTORY_PENALTY;
        reason = "No service history recorded";
      } else {
        penalty = wearPenalty(worst.consumed);
        const pct = Math.round(worst.consumed * 100);
        reason = `${worst.label}: ${pct}% of interval used`;
      }

      const score = U.clamp(Math.round(100 - penalty - agePenalty - odoPenalty), 0, 100);
      scores[system] = score;
      factors.push({
        system,
        label: system.toUpperCase(),
        score,
        reason,
        wear: Math.round(penalty),
        age: Math.round(agePenalty),
        usage: Math.round(odoPenalty),
      });
    });

    const overdueCount = schedule.filter((r) => r.status === M.STATUS.OVERDUE).length;

    const weighted =
      scores.engine * C.HEALTH_WEIGHTS.engine +
      scores.brakes * C.HEALTH_WEIGHTS.brakes +
      scores.tyres * C.HEALTH_WEIGHTS.tyres +
      scores.battery * C.HEALTH_WEIGHTS.battery;

    const overall = U.clamp(Math.round(weighted - overdueCount * OVERDUE_PENALTY), 0, 100);

    return {
      overall,
      engine: scores.engine,
      tyres: scores.tyres,
      battery: scores.battery,
      brakes: scores.brakes,
      band: C.healthBand(overall),
      overdueCount,
      ageYears,
      factors,
    };
  }

  /** Fleet average — the dashboard headline when several vehicles exist. */
  function fleetHealth(vehicles) {
    if (!vehicles.length) return 0;
    return Math.round(
      U.sum(vehicles, (v) => calculateVehicleHealth(v).overall) / vehicles.length
    );
  }

  /**
   * Reconstruct a health trend by replaying the odometer/service history
   * backwards month by month. This is an approximation used for the trend
   * chart only — the headline number always comes from live data.
   */
  function healthTrend(vehicle, months = 6) {
    if (!vehicle) return [];
    const points = [];
    const records = M.forVehicle(vehicle.id);
    const perDayKm = estimateDailyKm(vehicle, records);

    for (let i = months - 1; i >= 0; i -= 1) {
      const when = U.addMonths(U.today(), -i);
      const daysBack = U.daysBetween(when) * -1; // negative offset from today
      const snapshotOdo = Math.max(0, (Number(vehicle.odometer) || 0) + daysBack * perDayKm);
      const snapshot = {
        ...vehicle,
        odometer: Math.round(snapshotOdo),
      };
      // Only records that existed at that time count towards the snapshot.
      const asOf = U.isoDate(when);
      const historical = records.filter((r) => r.date <= asOf);
      points.push({
        label: U.monthLabel(U.formatMonthKey(when)),
        value: scoreWithRecords(snapshot, historical, asOf),
      });
    }
    return points;
  }

  /** Health score computed against an explicit record set and "as of" date. */
  function scoreWithRecords(vehicle, records, asOfIso) {
    const asOf = U.toDate(asOfIso) || U.today();
    const byType = {};
    records.forEach((r) => {
      const prev = byType[r.type];
      if (!prev || U.toDate(r.date) > U.toDate(prev.date)) byType[r.type] = r;
    });

    const ageYears = Math.max(0, asOf.getFullYear() - (Number(vehicle.year) || asOf.getFullYear()));
    const agePenalty = Math.min(AGE_CAP, ageYears * AGE_PER_YEAR);
    const odoPenalty = Math.min(ODO_CAP, ((Number(vehicle.odometer) || 0) / 100000) * ODO_PER_100K);

    const scores = {};
    SYSTEMS.forEach((system) => {
      const types = C.MAINTENANCE_TYPES.filter((t) => t.system === system);
      let worstConsumed = null;
      types.forEach((t) => {
        const rec = byType[t.key];
        if (!rec) return;
        const kmC = t.km ? U.clamp(((vehicle.odometer || 0) - (rec.odometer || 0)) / t.km, 0, 2) : 0;
        const dayC = t.months
          ? U.clamp(U.daysBetween(rec.date, asOf) / (t.months * 30.44), 0, 2)
          : 0;
        const c = Math.max(kmC, dayC);
        if (worstConsumed === null || c > worstConsumed) worstConsumed = c;
      });
      const penalty = worstConsumed === null ? NO_HISTORY_PENALTY : wearPenalty(worstConsumed);
      scores[system] = U.clamp(Math.round(100 - penalty - agePenalty - odoPenalty), 0, 100);
    });

    return U.clamp(
      Math.round(
        scores.engine * C.HEALTH_WEIGHTS.engine +
          scores.brakes * C.HEALTH_WEIGHTS.brakes +
          scores.tyres * C.HEALTH_WEIGHTS.tyres +
          scores.battery * C.HEALTH_WEIGHTS.battery
      ),
      0,
      100
    );
  }

  /**
   * Average daily distance for a vehicle. Preference order:
   *   1. journeys logged in the last 90 days
   *   2. odometer spread across the maintenance history
   *   3. odometer spread across the vehicle's age
   *   4. a conservative 25 km/day fallback
   */
  function estimateDailyKm(vehicle, records = null) {
    const journeys = AC.storage.list("journeys").filter((j) => j.vehicleId === vehicle.id);
    const recent = journeys.filter((j) => (U.daysBetween(j.date) ?? 999) <= 90);
    if (recent.length >= 2) {
      const span = Math.max(1, U.daysBetween(U.sortBy(recent, (j) => j.date, "asc")[0].date));
      return U.clamp(U.sum(recent, (j) => j.distanceKm) / span, 3, 400);
    }

    const recs = records || AC.maintenance.forVehicle(vehicle.id);
    if (recs.length >= 2) {
      const asc = U.sortBy(recs, (r) => r.date, "asc");
      const first = asc[0];
      const days = Math.max(1, U.daysBetween(first.date));
      const km = Math.max(0, (Number(vehicle.odometer) || 0) - (Number(first.odometer) || 0));
      if (km > 0) return U.clamp(km / days, 3, 400);
    }

    const ageDays = Math.max(365, (new Date().getFullYear() - (Number(vehicle.year) || new Date().getFullYear())) * 365);
    const byAge = (Number(vehicle.odometer) || 0) / ageDays;
    return U.clamp(byAge || 25, 3, 400);
  }

  return {
    SYSTEMS,
    calculateVehicleHealth,
    fleetHealth,
    healthTrend,
    estimateDailyKm,
    wearPenalty,
  };
})();

  </script>
  <script>
/* ===== js/environment.js ===== */
/* ==========================================================================
   AutoCare Pro — environment.js
   Environmental Intelligence layer.

       LOCATION → ENVIRONMENT SERVICE → AQI + WEATHER → EXPOSURE → WASH SCORE

   The service is written against a provider interface so the data source can
   be swapped without touching the Wash Advisor:

       MockEnvironmentProvider   deterministic offline data (default)
       LiveEnvironmentProvider   Open-Meteo air-quality + forecast APIs

   Open-Meteo is used for the live provider because it needs NO API KEY, which
   keeps the promise that nothing secret ever ships in frontend source. To move
   to a keyed provider (OpenWeather, IQAir, WAQI) implement the same three
   methods and register it in PROVIDERS — see docs/api-integration.md.
   ========================================================================== */

window.AC = window.AC || {};

AC.environment = (function () {
  "use strict";

  const U = AC.utils;
  const C = AC.constants;
  const S = AC.storage;

  const CACHE_TTL_MIN = 30;

  /* ------------------------------------------------- provider interface --
     A provider must expose:
        id           : string
        label        : string
        needsNetwork : boolean
        fetch(location) -> Promise<EnvironmentReading>
  ---------------------------------------------------------------------- */

  /**
   * Deterministic offline data set. Values are realistic for a North-Indian
   * city and vary slightly by day-of-year so charts are not flat lines, but
   * they are reproducible: the same day always yields the same reading.
   */
  const MockEnvironmentProvider = {
    id: "mock",
    label: "Mock / Offline",
    needsNetwork: false,

    /** Synchronous so the UI always has a reading, even before the first fetch. */
    read(location) {
      const day = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / U.MS_DAY);
      // Cheap deterministic oscillation — no randomness, so results repeat.
      const wave = (offset, amp) => Math.sin((day + offset) / 9) * amp;
      const rainy = day % 11 === 0;

      return {
        location: location || { label: "Patiala, Punjab", lat: 30.3398, lon: 76.3869, source: "default" },
        aqi: Math.round(U.clamp(145 + wave(0, 42), 40, 340)),
        pm25: Math.round(U.clamp(68 + wave(3, 22), 8, 210)),
        pm10: Math.round(U.clamp(112 + wave(6, 34), 15, 320)),
        no2: Math.round(U.clamp(34 + wave(2, 11), 4, 120)),
        o3: Math.round(U.clamp(52 + wave(5, 16), 5, 160)),
        temperature: Math.round(U.clamp(32 + wave(8, 7), 4, 48)),
        humidity: Math.round(U.clamp(58 + wave(11, 20), 12, 96)),
        precipitation: rainy ? 3.4 : 0,
        weather: rainy ? "Rain" : "Clear",
        provider: "mock",
        isDemo: true,
        fetchedAt: new Date().toISOString(),
      };
    },

    fetch(location) {
      return Promise.resolve(MockEnvironmentProvider.read(location));
    },
  };

  /** WMO weather codes → the short labels the UI shows. */
  function describeWeather(code, precipitation) {
    if (precipitation > 0.2) return "Rain";
    if (code === 0) return "Clear";
    if (code <= 3) return "Cloudy";
    if (code >= 45 && code <= 48) return "Fog";
    if (code >= 51 && code <= 67) return "Rain";
    if (code >= 71 && code <= 77) return "Snow";
    if (code >= 80 && code <= 82) return "Showers";
    if (code >= 95) return "Storm";
    return "Clear";
  }

  const LiveEnvironmentProvider = {
    id: "live",
    label: "Open-Meteo (live, key-free)",
    needsNetwork: true,
    async fetch(location) {
      const loc = location || { lat: 30.3398, lon: 76.3869, label: "Patiala, Punjab" };
      const air =
        "https://air-quality-api.open-meteo.com/v1/air-quality" +
        `?latitude=${encodeURIComponent(loc.lat)}&longitude=${encodeURIComponent(loc.lon)}` +
        "&current=pm10,pm2_5,nitrogen_dioxide,ozone,us_aqi&timezone=auto";
      const wx =
        "https://api.open-meteo.com/v1/forecast" +
        `?latitude=${encodeURIComponent(loc.lat)}&longitude=${encodeURIComponent(loc.lon)}` +
        "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&timezone=auto";

      const withTimeout = (url) => {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 8000);
        return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t));
      };

      const [airRes, wxRes] = await Promise.all([withTimeout(air), withTimeout(wx)]);
      if (!airRes.ok || !wxRes.ok) throw new Error("Environment provider returned an error.");

      const airJson = await airRes.json();
      const wxJson = await wxRes.json();
      const a = airJson.current || {};
      const w = wxJson.current || {};

      return {
        location: { ...loc, source: loc.source || "manual" },
        aqi: Math.round(Number(a.us_aqi) || 0),
        pm25: Math.round(Number(a.pm2_5) || 0),
        pm10: Math.round(Number(a.pm10) || 0),
        no2: Math.round(Number(a.nitrogen_dioxide) || 0),
        o3: Math.round(Number(a.ozone) || 0),
        temperature: Math.round(Number(w.temperature_2m) || 0),
        humidity: Math.round(Number(w.relative_humidity_2m) || 0),
        precipitation: Number(w.precipitation) || 0,
        weather: describeWeather(Number(w.weather_code), Number(w.precipitation) || 0),
        provider: "open-meteo",
        isDemo: false,
        fetchedAt: new Date().toISOString(),
      };
    },
  };

  const PROVIDERS = {
    mock: MockEnvironmentProvider,
    live: LiveEnvironmentProvider,
  };

  /* ------------------------------------------------------------ location -- */

  /**
   * Resolve the location to use. Device geolocation is *optional*: if the
   * user has not opted in, or permission is denied, or the browser has no
   * geolocation API, we silently fall back to the configured manual location.
   * The application never blocks on this.
   */
  function resolveLocation() {
    const settings = S.getSettings();
    const manual = { ...settings.manualLocation, source: "manual" };

    if (settings.locationMode !== "device" || !navigator.geolocation) {
      return Promise.resolve(manual);
    }

    return new Promise((resolve) => {
      let settled = false;
      const done = (value) => {
        if (!settled) {
          settled = true;
          resolve(value);
        }
      };
      const timer = setTimeout(() => done(manual), 7000);

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          clearTimeout(timer);
          done({
            label: "Current location",
            lat: U.round(pos.coords.latitude, 4),
            lon: U.round(pos.coords.longitude, 4),
            source: "device",
          });
        },
        () => {
          clearTimeout(timer);
          done(manual);
        },
        { enableHighAccuracy: false, timeout: 6000, maximumAge: 600000 }
      );
    });
  }

  /** Reports geolocation permission without prompting, where supported. */
  async function permissionState() {
    if (!navigator.permissions || !navigator.permissions.query) return "unknown";
    try {
      const status = await navigator.permissions.query({ name: "geolocation" });
      return status.state; // granted | prompt | denied
    } catch (err) {
      return "unknown";
    }
  }

  /* ------------------------------------------------------------- service -- */

  const cacheFresh = (env) => {
    if (!env || !env.fetchedAt) return false;
    return (Date.now() - new Date(env.fetchedAt).getTime()) / 60000 < CACHE_TTL_MIN;
  };

  /**
   * The reading every screen renders from. Never null: before the first
   * asynchronous fetch completes we synthesise the deterministic mock reading,
   * so wash scores computed on any route are consistent from the first paint.
   */
  function current() {
    const db = S.loadDB();
    if (db.environment && db.environment.cache) return db.environment.cache;
    return MockEnvironmentProvider.read({ ...db.settings.manualLocation, source: "manual" });
  }

  /**
   * Fetch (or reuse) an environment reading.
   * Guarantees a resolved reading — a live failure downgrades to mock and
   * flags `degraded` so the UI can tell the user what happened.
   */
  async function load({ force = false } = {}) {
    const settings = S.getSettings();
    // NOTE: read the *stored* cache here, not current() — current() synthesises
    // a reading when nothing is stored, which would look permanently fresh.
    const db = S.loadDB();
    const cached = db.environment ? db.environment.cache : null;
    if (!force && cacheFresh(cached) && cached.providerMode === settings.environmentMode) {
      return cached;
    }

    const provider = PROVIDERS[settings.environmentMode] || MockEnvironmentProvider;
    const location = await resolveLocation();

    let reading;
    let degraded = null;

    try {
      if (provider.needsNetwork && !navigator.onLine) {
        throw new Error("Device is offline.");
      }
      reading = await provider.fetch(location);
    } catch (err) {
      degraded = err.message || "Live environment data unavailable.";
      reading = await MockEnvironmentProvider.fetch(location);
    }

    reading.providerMode = settings.environmentMode;
    reading.degraded = degraded;

    S.update((db) => {
      db.environment = {
        cache: reading,
        fetchedAt: reading.fetchedAt,
        provider: reading.provider,
      };
    });

    return reading;
  }

  /* ------------------------------------------------------------ exposure -- */

  /**
   * Normalised pollution index (0–1) from the five pollutant readings.
   * AQI dominates; the individual pollutants refine it. These weights are the
   * ones documented in docs/algorithms.md.
   */
  function pollutionIndex(env) {
    if (!env) return 0;
    const parts = [
      { v: env.aqi, max: 300, w: 0.5 },
      { v: env.pm25, max: 150, w: 0.2 },
      { v: env.pm10, max: 200, w: 0.15 },
      { v: env.no2, max: 100, w: 0.08 },
      { v: env.o3, max: 120, w: 0.07 },
    ];
    return U.clamp(
      parts.reduce((acc, p) => acc + U.clamp((Number(p.v) || 0) / p.max, 0, 1) * p.w, 0),
      0,
      1
    );
  }

  /**
   * Normalised road-dust index (0–1).
   * Coarse particulate (PM10) is the primary signal; dry air lifts more dust,
   * rain suppresses it, and recent dusty journeys add to it.
   */
  function dustIndex(env, journeyDust = 0) {
    if (!env) return 0;
    const coarse = U.clamp((Number(env.pm10) || 0) / 200, 0, 1);
    const dryness = U.clamp((70 - (Number(env.humidity) || 50)) / 60, 0, 1);
    const rainRelief = (Number(env.precipitation) || 0) > 0.2 ? -0.25 : 0;
    return U.clamp(coarse * 0.6 + dryness * 0.2 + journeyDust * 0.2 + rainRelief, 0, 1);
  }

  const aqiLabel = (aqi) => C.aqiBand(Number(aqi) || 0);

  return {
    CACHE_TTL_MIN,
    PROVIDERS,
    MockEnvironmentProvider,
    LiveEnvironmentProvider,
    describeWeather,
    resolveLocation,
    permissionState,
    current,
    load,
    pollutionIndex,
    dustIndex,
    aqiLabel,
  };
})();

  </script>
  <script>
/* ===== js/journeys.js ===== */
/* ==========================================================================
   AutoCare Pro — journeys.js
   Journeys are how the app learns *where* and *how hard* a vehicle is used.
   They feed two things: the distance-since-wash term of the Wash Score and
   the environmental-exposure analytics.
   ========================================================================== */

window.AC = window.AC || {};

AC.journeys = (function () {
  "use strict";

  const U = AC.utils;
  const S = AC.storage;

  /** Qualitative dust levels mapped onto the 0–1 scale the maths needs. */
  const DUST_LEVELS = [
    { key: "low", label: "Low", value: 0.2 },
    { key: "moderate", label: "Moderate", value: 0.55 },
    { key: "high", label: "High", value: 0.85 },
  ];

  const dustValue = (key) => (DUST_LEVELS.find((d) => d.key === key) || DUST_LEVELS[1]).value;
  const dustLabel = (key) => (DUST_LEVELS.find((d) => d.key === key) || DUST_LEVELS[1]).label;

  const all = () => U.sortBy(S.list("journeys"), (j) => j.date, "desc");

  const forVehicle = (vehicleId) => all().filter((j) => j.vehicleId === vehicleId);

  /** Journeys taken on or after `fromIso`. */
  function since(vehicleId, fromIso) {
    if (!fromIso) return forVehicle(vehicleId);
    return forVehicle(vehicleId).filter((j) => j.date >= fromIso);
  }

  const distanceSince = (vehicleId, fromIso) => U.sum(since(vehicleId, fromIso), (j) => j.distanceKm);

  /**
   * Exposure summary for a vehicle over the supplied journeys.
   * `dust` and `exposure` are 0–1 indices; `exposure` blends the pollution
   * the vehicle drove through with the distance it covered.
   */
  function exposureSummary(vehicleId, list = null) {
    const rows = list || forVehicle(vehicleId);
    if (!rows.length) {
      return { count: 0, totalDistance: 0, avgAqi: null, dust: 0, exposure: 0, label: "NO DATA" };
    }

    const totalDistance = U.sum(rows, (j) => j.distanceKm);
    const withAqi = rows.filter((j) => U.isNum(j.avgAqi));

    // Distance-weighted AQI: a 300 km drive through smog matters more than a
    // 5 km errand through the same air.
    const avgAqi = withAqi.length
      ? Math.round(
          U.sum(withAqi, (j) => Number(j.avgAqi) * Number(j.distanceKm)) /
            Math.max(1, U.sum(withAqi, (j) => j.distanceKm))
        )
      : null;

    const dust = U.clamp(
      U.sum(rows, (j) => dustValue(j.dustLevel) * Number(j.distanceKm)) /
        Math.max(1, totalDistance),
      0,
      1
    );

    const aqiComponent = avgAqi === null ? 0.4 : U.clamp(avgAqi / 300, 0, 1);
    const distanceComponent = U.clamp(totalDistance / 1500, 0, 1);
    const exposure = U.clamp(aqiComponent * 0.55 + dust * 0.3 + distanceComponent * 0.15, 0, 1);

    return {
      count: rows.length,
      totalDistance,
      avgAqi,
      dust,
      exposure,
      label: AC.constants.levelBand(exposure).label,
      tone: AC.constants.levelBand(exposure).tone,
    };
  }

  /**
   * Adding a journey advances the odometer, because kilometres driven are
   * kilometres driven — the two must never disagree.
   */
  function add(value) {
    const row = S.insert("journeys", {
      vehicleId: value.vehicleId,
      from: value.from,
      to: value.to,
      distanceKm: Number(value.distanceKm),
      date: value.date,
      avgAqi: U.isNum(value.avgAqi) ? Number(value.avgAqi) : null,
      dustLevel: value.dustLevel || "moderate",
      source: "user",
    });

    S.update((db) => {
      const v = db.vehicles.find((x) => x.id === value.vehicleId);
      if (v) v.odometer = (Number(v.odometer) || 0) + Number(value.distanceKm);
    });

    return row;
  }

  const remove = (id) => S.remove("journeys", id);

  /** Monthly distance series for the analytics charts. */
  function monthlyDistance(vehicleId = null, months = 6) {
    const rows = (vehicleId ? forVehicle(vehicleId) : all()).slice();
    const buckets = new Map();
    for (let i = months - 1; i >= 0; i -= 1) {
      const key = U.formatMonthKey(U.addMonths(U.today(), -i));
      buckets.set(key, 0);
    }
    rows.forEach((j) => {
      const key = U.formatMonthKey(j.date);
      if (buckets.has(key)) buckets.set(key, buckets.get(key) + Number(j.distanceKm));
    });
    return Array.from(buckets.entries()).map(([key, value]) => ({
      key,
      label: U.monthLabel(key),
      value,
    }));
  }

  return {
    DUST_LEVELS,
    dustValue,
    dustLabel,
    all,
    forVehicle,
    since,
    distanceSince,
    exposureSummary,
    add,
    remove,
    monthlyDistance,
  };
})();

  </script>
  <script>
/* ===== js/washAdvisor.js ===== */
/* ==========================================================================
   AutoCare Pro — washAdvisor.js
   The Smart Wash Advisor: a 0–100 Wash Score built from four weighted
   factors instead of a naive "wash every 7 days" rule.

   ALGORITHM — calculateWashScore(vehicle, environment)
   ---------------------------------------------------
   TIME  (max 60)  Days since the last wash, scaled so that 20 days saturates
                   the factor. Weather multiplies elapsed time because road
                   spray, fog and snow soil a vehicle faster than dry air:
                       Rain/Showers/Storm x1.20   Snow x1.25   Fog x1.10

   POLLUTION (max 20)  environment.pollutionIndex() — a weighted blend of
                   AQI (50%), PM2.5 (20%), PM10 (15%), NO2 (8%), O3 (7%).

   ROAD DUST (max 10)  environment.dustIndex() — coarse particulate, air
                   dryness and the dust level of journeys since the last wash,
                   with a rain credit.

   USAGE (max 10)  Distance driven since the wash (7 pts, saturating at
                   500 km) plus journey frequency (3 pts, saturating at 6
                   trips).

   The four are summed and clamped to 0–100, then mapped to a band:
       0–30 CLEAN · 31–55 MONITOR · 56–75 WASH SOON · 76–100 WASH NOW

   Every factor returns its own points, cap and a plain-English note, which is
   what the "Why this score?" panel renders — the score is always explainable.
   ========================================================================== */

window.AC = window.AC || {};

AC.wash = (function () {
  "use strict";

  const U = AC.utils;
  const C = AC.constants;
  const S = AC.storage;
  const ENV = AC.environment;
  const J = AC.journeys;

  const TIME_SATURATION_DAYS = 20;
  const USAGE_SATURATION_KM = 500;
  const USAGE_SATURATION_TRIPS = 6;

  const WEATHER_MULTIPLIER = {
    Rain: 1.2,
    Showers: 1.2,
    Storm: 1.2,
    Snow: 1.25,
    Fog: 1.1,
    Cloudy: 1.0,
    Clear: 1.0,
  };

  /* -------------------------------------------------- distance since wash -- */

  /**
   * How far has the vehicle travelled since it was last washed?
   * Preference order (most trustworthy first):
   *   1. odometer delta, when the odometer at the last wash was recorded
   *   2. sum of journeys logged since the last wash date
   *   3. days elapsed x the vehicle's estimated daily distance
   */
  function distanceSinceWash(vehicle) {
    const odo = Number(vehicle.odometer) || 0;

    if (U.isNum(vehicle.odometerAtLastWash)) {
      return {
        km: Math.max(0, odo - Number(vehicle.odometerAtLastWash)),
        source: "odometer",
      };
    }

    const trips = J.since(vehicle.id, vehicle.lastWashDate);
    if (trips.length) {
      return { km: U.sum(trips, (t) => t.distanceKm), source: "journeys" };
    }

    const days = Math.max(0, U.daysBetween(vehicle.lastWashDate) ?? 0);
    return {
      km: Math.round(days * AC.health.estimateDailyKm(vehicle)),
      source: "estimated",
    };
  }

  /* -------------------------------------------------------------- scoring -- */

  /**
   * @param {object} vehicle
   * @param {object} environment reading from AC.environment
   * @returns {object} score, band, factors and the conditions used
   */
  function calculateWashScore(vehicle, environment) {
    const env = environment || ENV.current();

    if (!vehicle) {
      return emptyResult();
    }

    const days = Math.max(0, U.daysBetween(vehicle.lastWashDate) ?? TIME_SATURATION_DAYS);
    const weather = (env && env.weather) || "Clear";
    const weatherMult = WEATHER_MULTIPLIER[weather] || 1;
    const effectiveDays = days * weatherMult;

    /* ---- 1. TIME ------------------------------------------------------- */
    const timeRatio = U.clamp(effectiveDays / TIME_SATURATION_DAYS, 0, 1);
    const timePoints = U.round(timeRatio * C.WASH_WEIGHTS.time, 1);

    /* ---- 2. POLLUTION -------------------------------------------------- */
    const pollution = ENV.pollutionIndex(env);
    const pollutionPoints = U.round(pollution * C.WASH_WEIGHTS.pollution, 1);

    /* ---- 3. ROAD DUST -------------------------------------------------- */
    const tripsSinceWash = J.since(vehicle.id, vehicle.lastWashDate);
    const journeyDust = tripsSinceWash.length
      ? U.clamp(
          U.sum(tripsSinceWash, (t) => J.dustValue(t.dustLevel) * Number(t.distanceKm)) /
            Math.max(1, U.sum(tripsSinceWash, (t) => t.distanceKm)),
          0,
          1
        )
      : 0;
    const dust = ENV.dustIndex(env, journeyDust);
    const dustPoints = U.round(dust * C.WASH_WEIGHTS.dust, 1);

    /* ---- 4. USAGE ------------------------------------------------------ */
    const distance = distanceSinceWash(vehicle);
    const distanceRatio = U.clamp(distance.km / USAGE_SATURATION_KM, 0, 1);
    const tripRatio = U.clamp(tripsSinceWash.length / USAGE_SATURATION_TRIPS, 0, 1);
    const usagePoints = U.round(distanceRatio * 7 + tripRatio * 3, 1);

    const score = U.clamp(
      Math.round(timePoints + pollutionPoints + dustPoints + usagePoints),
      0,
      100
    );

    const band = C.washBand(score);

    return {
      score,
      band,
      status: band.label,
      tone: band.tone,
      key: band.key,
      message: band.message,
      daysSinceWash: days,
      distanceSinceWash: distance.km,
      distanceSource: distance.source,
      tripsSinceWash: tripsSinceWash.length,
      factors: [
        {
          key: "time",
          name: "TIME SINCE WASH",
          points: timePoints,
          max: C.WASH_WEIGHTS.time,
          note:
            weatherMult > 1
              ? `${days} days elapsed, weighted x${weatherMult} for ${weather.toLowerCase()} conditions`
              : `${days} day${days === 1 ? "" : "s"} since the last recorded wash`,
        },
        {
          key: "pollution",
          name: "POLLUTION EXPOSURE",
          points: pollutionPoints,
          max: C.WASH_WEIGHTS.pollution,
          note: env
            ? `AQI ${env.aqi} · PM2.5 ${env.pm25} · PM10 ${env.pm10} µg/m³`
            : "No environmental reading available",
        },
        {
          key: "dust",
          name: "ROAD DUST",
          points: dustPoints,
          max: C.WASH_WEIGHTS.dust,
          note: env
            ? `Humidity ${env.humidity}% · ${C.levelBand(dust).label.toLowerCase()} dust deposition`
            : "No environmental reading available",
        },
        {
          key: "usage",
          name: "VEHICLE USAGE",
          points: usagePoints,
          max: C.WASH_WEIGHTS.usage,
          note: `${U.formatNumber(distance.km)} km${
            distance.source === "estimated" ? " (estimated)" : ""
          } over ${tripsSinceWash.length} logged trip${tripsSinceWash.length === 1 ? "" : "s"}`,
        },
      ],
      conditions: {
        aqi: env ? env.aqi : null,
        aqiBand: env ? C.aqiBand(env.aqi) : null,
        pollution,
        dust,
        dustBand: C.levelBand(dust),
        weather,
        temperature: env ? env.temperature : null,
        humidity: env ? env.humidity : null,
        location: env ? env.location : null,
        provider: env ? env.provider : null,
        isDemo: env ? Boolean(env.isDemo) : true,
        degraded: env ? env.degraded || null : null,
      },
    };
  }

  function emptyResult() {
    const band = C.washBand(0);
    return {
      score: 0,
      band,
      status: band.label,
      tone: band.tone,
      key: band.key,
      message: "Add a vehicle to start tracking wash recommendations.",
      daysSinceWash: 0,
      distanceSinceWash: 0,
      distanceSource: "none",
      tripsSinceWash: 0,
      factors: [],
      conditions: {},
    };
  }

  /* --------------------------------------------------------------- writes -- */

  /**
   * Record a wash. This resets the two inputs the time and usage factors read
   * (last wash date + odometer at last wash) so the gauge visibly drops.
   */
  function recordWash(value) {
    const vehicle = S.find("vehicles", value.vehicleId);
    const odometer = U.isNum(value.odometer) ? Number(value.odometer) : Number(vehicle.odometer) || 0;

    const row = S.insert("washRecords", {
      vehicleId: value.vehicleId,
      date: value.date,
      odometer,
      cost: Number(value.cost) || 0,
      source: "user",
    });

    S.update((db) => {
      const v = db.vehicles.find((x) => x.id === value.vehicleId);
      if (!v) return;
      v.lastWashDate = value.date;
      v.odometerAtLastWash = odometer;
      if (odometer > (Number(v.odometer) || 0)) v.odometer = odometer;
    });

    if (value.logExpense && Number(value.cost) > 0) {
      S.insert("expenses", {
        vehicleId: value.vehicleId,
        category: "wash",
        amount: Number(value.cost),
        date: value.date,
        description: "Vehicle wash",
        linkedRecordId: row.id,
        source: "user",
      });
    }

    return row;
  }

  const history = (vehicleId = null) =>
    U.sortBy(
      S.list("washRecords").filter((w) => !vehicleId || w.vehicleId === vehicleId),
      (w) => w.date,
      "desc"
    );

  /** Washes per month, for the analytics "Wash Frequency" chart. */
  function monthlyFrequency(vehicleId = null, months = 6) {
    const rows = history(vehicleId);
    const buckets = new Map();
    for (let i = months - 1; i >= 0; i -= 1) {
      buckets.set(U.formatMonthKey(U.addMonths(U.today(), -i)), 0);
    }
    rows.forEach((w) => {
      const key = U.formatMonthKey(w.date);
      if (buckets.has(key)) buckets.set(key, buckets.get(key) + 1);
    });
    return Array.from(buckets.entries()).map(([key, value]) => ({
      key,
      label: U.monthLabel(key),
      value,
    }));
  }

  return {
    TIME_SATURATION_DAYS,
    USAGE_SATURATION_KM,
    WEATHER_MULTIPLIER,
    distanceSinceWash,
    calculateWashScore,
    recordWash,
    history,
    monthlyFrequency,
  };
})();

  </script>
  <script>
/* ===== js/expenses.js ===== */
/* ==========================================================================
   AutoCare Pro — expenses.js
   Expense CRUD plus the aggregations the Expenses and Analytics pages read.
   All money is stored as a plain number of rupees; formatting happens in the
   view layer only.
   ========================================================================== */

window.AC = window.AC || {};

AC.expenses = (function () {
  "use strict";

  const U = AC.utils;
  const C = AC.constants;
  const S = AC.storage;

  const all = () => U.sortBy(S.list("expenses"), (e) => e.date, "desc");

  /** Filter helper shared by every aggregation below. */
  function query({ vehicleId = null, category = null, from = null, to = null } = {}) {
    return all().filter((e) => {
      if (vehicleId && e.vehicleId !== vehicleId) return false;
      if (category && e.category !== category) return false;
      if (from && e.date < from) return false;
      if (to && e.date > to) return false;
      return true;
    });
  }

  const total = (filter = {}) => U.sum(query(filter), (e) => e.amount);

  /** Spend for the current calendar month. */
  function monthToDate(filter = {}) {
    const now = U.today();
    const first = U.isoDate(new Date(now.getFullYear(), now.getMonth(), 1));
    return total({ ...filter, from: first });
  }

  /** Totals per category, largest first, with share of the whole. */
  function byCategory(filter = {}) {
    const rows = query(filter);
    const grand = U.sum(rows, (e) => e.amount) || 1;
    return C.EXPENSE_CATEGORIES.map((cat) => {
      const amount = U.sum(
        rows.filter((e) => e.category === cat.key),
        (e) => e.amount
      );
      return { ...cat, amount, share: amount / grand };
    })
      .filter((c) => c.amount > 0)
      .sort((a, b) => b.amount - a.amount);
  }

  /** Month-by-month totals for the trailing `months` window. */
  function monthly(filter = {}, months = 6) {
    const rows = query(filter);
    const buckets = new Map();
    for (let i = months - 1; i >= 0; i -= 1) {
      buckets.set(U.formatMonthKey(U.addMonths(U.today(), -i)), 0);
    }
    rows.forEach((e) => {
      const key = U.formatMonthKey(e.date);
      if (buckets.has(key)) buckets.set(key, buckets.get(key) + Number(e.amount));
    });
    return Array.from(buckets.entries()).map(([key, value]) => ({
      key,
      label: U.monthLabel(key),
      value,
    }));
  }

  /** Stacked monthly series split by category — used by the analytics page. */
  function monthlyByCategory(filter = {}, months = 6) {
    const labels = monthly(filter, months).map((m) => m.label);
    const keys = monthly(filter, months).map((m) => m.key);
    const series = C.EXPENSE_CATEGORIES.map((cat) => {
      const data = keys.map((key) =>
        U.sum(
          query({ ...filter, category: cat.key }).filter((e) => U.formatMonthKey(e.date) === key),
          (e) => e.amount
        )
      );
      return { ...cat, data };
    }).filter((s) => s.data.some((v) => v > 0));
    return { labels, series };
  }

  const create = (value) =>
    S.insert("expenses", {
      vehicleId: value.vehicleId,
      category: value.category,
      amount: Number(value.amount),
      date: value.date,
      description: value.description || "",
      source: "user",
    });

  const update = (id, value) =>
    S.patch("expenses", id, {
      vehicleId: value.vehicleId,
      category: value.category,
      amount: Number(value.amount),
      date: value.date,
      description: value.description || "",
    });

  const remove = (id) => S.remove("expenses", id);

  /** Cost per kilometre — a genuinely useful ownership metric. */
  function costPerKm(vehicleId) {
    const vehicle = AC.vehicles.get(vehicleId);
    if (!vehicle) return null;
    const spent = total({ vehicleId });
    const journeyKm = AC.journeys.forVehicle(vehicleId).reduce((a, j) => a + Number(j.distanceKm), 0);
    const basis = journeyKm > 100 ? journeyKm : Number(vehicle.odometer) || 0;
    if (!basis) return null;
    return spent / basis;
  }

  return {
    all,
    query,
    total,
    monthToDate,
    byCategory,
    monthly,
    monthlyByCategory,
    create,
    update,
    remove,
    costPerKm,
  };
})();

  </script>
  <script>
/* ===== js/vehicles.js ===== */
/* ==========================================================================
   AutoCare Pro — vehicles.js
   Vehicle CRUD and the derived "summary" object that every screen renders
   from. Keeping the derivation here means the dashboard, the vehicles page
   and the command palette all agree on what a vehicle's numbers are.
   ========================================================================== */

window.AC = window.AC || {};

AC.vehicles = (function () {
  "use strict";

  const U = AC.utils;
  const S = AC.storage;

  const all = () => U.sortBy(S.list("vehicles"), (v) => (v.isPrimary ? 0 : 1), "asc");

  const get = (id) => S.find("vehicles", id);

  const count = () => S.list("vehicles").length;

  /** The primary vehicle, falling back to the first one on file. */
  function primary() {
    const list = S.list("vehicles");
    return list.find((v) => v.isPrimary) || list[0] || null;
  }

  /** Exactly one vehicle may be primary at a time. */
  function setPrimary(id) {
    S.update((db) => {
      db.vehicles.forEach((v) => {
        v.isPrimary = v.id === id;
      });
    });
    return get(id);
  }

  function create(value) {
    const isFirst = count() === 0;
    const row = S.insert("vehicles", {
      name: value.name,
      make: value.make,
      model: value.model,
      year: Number(value.year),
      fuelType: value.fuelType,
      odometer: Number(value.odometer),
      registration: value.registration || "",
      lastServiceDate: value.lastServiceDate || null,
      lastServiceOdometer: U.isNum(value.lastServiceOdometer)
        ? Number(value.lastServiceOdometer)
        : null,
      lastWashDate: value.lastWashDate || null,
      odometerAtLastWash: U.isNum(value.odometerAtLastWash)
        ? Number(value.odometerAtLastWash)
        : null,
      notes: value.notes || "",
      isPrimary: isFirst,
      source: "user",
    });

    // A baseline service record makes the health and due-date maths meaningful
    // from day one instead of reporting "no history".
    if (value.lastServiceDate && U.isNum(value.lastServiceOdometer)) {
      S.insert("maintenanceRecords", {
        vehicleId: row.id,
        type: "general",
        date: value.lastServiceDate,
        odometer: Number(value.lastServiceOdometer),
        cost: 0,
        notes: "Baseline service recorded when the vehicle was added.",
        nextServiceDate: null,
        nextServiceOdometer: null,
        source: "baseline",
      });
    }

    return row;
  }

  function update(id, value) {
    return S.patch("vehicles", id, {
      name: value.name,
      make: value.make,
      model: value.model,
      year: Number(value.year),
      fuelType: value.fuelType,
      odometer: Number(value.odometer),
      registration: value.registration || "",
      lastServiceDate: value.lastServiceDate || null,
      lastServiceOdometer: U.isNum(value.lastServiceOdometer)
        ? Number(value.lastServiceOdometer)
        : null,
      lastWashDate: value.lastWashDate || null,
      odometerAtLastWash: U.isNum(value.odometerAtLastWash)
        ? Number(value.odometerAtLastWash)
        : null,
      notes: value.notes || "",
    });
  }

  /** Removes the vehicle and everything attached to it, then repairs primary. */
  const remove = (id) => S.removeVehicleCascade(id);

  /**
   * Everything a card needs about a vehicle, computed once.
   * `env` is optional — pass the current reading to avoid recomputing it.
   */
  function summary(vehicle, env = null) {
    if (!vehicle) return null;
    const health = AC.health.calculateVehicleHealth(vehicle);
    const next = AC.maintenance.nextService(vehicle);
    const washScore = AC.wash.calculateWashScore(vehicle, env);
    const schedule = AC.maintenance.scheduleFor(vehicle);

    return {
      vehicle,
      health,
      next,
      washScore,
      schedule,
      overdue: schedule.filter((r) => r.status === AC.maintenance.STATUS.OVERDUE).length,
      dueSoon: schedule.filter((r) => r.status === AC.maintenance.STATUS.DUE_SOON).length,
      maintenanceCost: AC.maintenance.totalCost(vehicle.id),
      expenseTotal: AC.expenses.total({ vehicleId: vehicle.id }),
      daysSinceWash: U.daysBetween(vehicle.lastWashDate),
    };
  }

  const displayName = (v) => (v ? `${v.make} ${v.model}`.trim() || v.name : "—");

  return { all, get, count, primary, setPrimary, create, update, remove, summary, displayName };
})();

  <script>
/* ===== js/analytics.js ===== */
/* ==========================================================================
   AutoCare Pro — analytics.js
   Every number shown on the dashboard and the analytics page is derived here
   from the stored records. Nothing in this file is a literal metric value.
   ========================================================================== */

window.AC = window.AC || {};

AC.analytics = (function () {
  "use strict";

  const U = AC.utils;
  const C = AC.constants;

  /* ---------------------------------------------------- dashboard tiles -- */

  function dashboardMetrics(env = null) {
    const vehicles = AC.vehicles.all();
    const { dueSoon, overdue } = AC.maintenance.fleetSummary(vehicles);

    const maintenanceCost =
      AC.maintenance.totalCost() +
      AC.expenses.total({ category: "repair" }) +
      AC.expenses.total({ category: "maintenance" }) -
      // maintenance expenses created *from* a service record would otherwise
      // be counted twice, so subtract the linked ones
      U.sum(
        AC.expenses.all().filter((e) => e.linkedRecordId && e.category !== "wash"),
        (e) => e.amount
      );

    const washScores = vehicles.map((v) => AC.wash.calculateWashScore(v, env).score);

    return {
      totalVehicles: vehicles.length,
      serviceDue: dueSoon,
      overdue,
      maintenanceCost: Math.max(0, Math.round(maintenanceCost)),
      totalExpenses: AC.expenses.total(),
      monthExpenses: AC.expenses.monthToDate(),
      fleetHealth: AC.health.fleetHealth(vehicles),
      avgWashScore: washScores.length
        ? Math.round(U.sum(washScores) / washScores.length)
        : 0,
      totalDistance: U.sum(vehicles, (v) => v.odometer),
    };
  }

  /* ------------------------------------------------------------- series -- */

  /**
   * Odometer growth reconstructed from the recorded odometer readings
   * (maintenance records, wash records and journeys all carry one).
   * Months with no reading inherit the previous known value.
   */
  function odometerGrowth(vehicleId, months = 6) {
    const vehicle = AC.vehicles.get(vehicleId);
    if (!vehicle) return [];

    const points = [];
    AC.maintenance.forVehicle(vehicleId).forEach((r) =>
      points.push({ date: r.date, odo: Number(r.odometer) || 0 })
    );
    AC.wash.history(vehicleId).forEach((w) =>
      points.push({ date: w.date, odo: Number(w.odometer) || 0 })
    );

    const sorted = U.sortBy(points, (p) => p.date, "asc");
    const buckets = [];

    for (let i = months - 1; i >= 0; i -= 1) {
      const monthDate = U.addMonths(U.today(), -i);
      const key = U.formatMonthKey(monthDate);
      const upto = sorted.filter((p) => U.formatMonthKey(p.date) <= key);
      const value = upto.length ? Math.max(...upto.map((p) => p.odo)) : null;
      buckets.push({ key, label: U.monthLabel(key), value });
    }

    // Forward-fill, then anchor the final point to the live odometer.
    let last = null;
    buckets.forEach((b) => {
      if (b.value === null) b.value = last;
      else last = b.value;
    });
    const firstKnown = buckets.find((b) => b.value !== null);
    buckets.forEach((b) => {
      if (b.value === null) b.value = firstKnown ? firstKnown.value : Number(vehicle.odometer) || 0;
    });
    buckets[buckets.length - 1].value = Math.max(
      buckets[buckets.length - 1].value,
      Number(vehicle.odometer) || 0
    );

    return buckets;
  }

  /** Maintenance spend grouped by service type. */
  function maintenanceCostByType(vehicleId = null) {
    const rows = vehicleId ? AC.maintenance.forVehicle(vehicleId) : AC.maintenance.all();
    const grouped = U.groupBy(rows, (r) => r.type);
    return Object.keys(grouped)
      .map((key) => ({
        key,
        label: C.maintenanceLabel(key),
        value: U.sum(grouped[key], (r) => r.cost),
      }))
      .filter((r) => r.value > 0)
      .sort((a, b) => b.value - a.value)
      .slice(0, 8);
  }

  /** Environmental exposure per month, derived from journeys. */
  function exposureSeries(vehicleId = null, months = 6) {
    const rows = vehicleId ? AC.journeys.forVehicle(vehicleId) : AC.journeys.all();
    const out = [];
    for (let i = months - 1; i >= 0; i -= 1) {
      const key = U.formatMonthKey(U.addMonths(U.today(), -i));
      const monthRows = rows.filter((j) => U.formatMonthKey(j.date) === key);
      const summary = AC.journeys.exposureSummary(vehicleId, monthRows);
      out.push({
        key,
        label: U.monthLabel(key),
        distance: summary.totalDistance,
        aqi: summary.avgAqi,
        dust: U.round(summary.dust * 100),
      });
    }
    return out;
  }

  /* ------------------------------------------------------------ insights -- */

  /**
   * Short, factual observations generated from the data. These are computed
   * statements, not canned marketing copy — each one names the number that
   * produced it.
   */
  function insights(vehicleId = null) {
    const out = [];
    const vehicles = vehicleId ? [AC.vehicles.get(vehicleId)].filter(Boolean) : AC.vehicles.all();
    if (!vehicles.length) return out;

    // Compare the two most recent *meaningful* months: early in a new month the
    // current bucket is nearly empty, which would produce a misleading "-100%".
    const spendSeries = AC.expenses.monthly(vehicleId ? { vehicleId } : {}, 4);
    const dayOfMonth = new Date().getDate();
    const pair = dayOfMonth <= 7 ? spendSeries.slice(-3, -1) : spendSeries.slice(-2);
    if (pair.length >= 2) {
      const [prev, curr] = pair;
      if (prev.value > 0) {
        const delta = ((curr.value - prev.value) / prev.value) * 100;
        out.push({
          title: "SPEND TREND",
          text: `${curr.label} spending is ${Math.abs(Math.round(delta))}% ${
            delta >= 0 ? "higher" : "lower"
          } than ${prev.label} (${U.formatCurrency(curr.value)} vs ${U.formatCurrency(prev.value)}).`,
        });
      }
    }

    const cats = AC.expenses.byCategory(vehicleId ? { vehicleId } : {});
    if (cats.length) {
      out.push({
        title: "LARGEST CATEGORY",
        text: `${cats[0].label} accounts for ${Math.round(cats[0].share * 100)}% of recorded spend (${U.formatCurrency(
          cats[0].amount
        )}).`,
      });
    }

    const worst = U.sortBy(
      vehicles.map((v) => ({ v, h: AC.health.calculateVehicleHealth(v) })),
      (x) => x.h.overall,
      "asc"
    )[0];
    if (worst) {
      out.push({
        title: "LOWEST HEALTH",
        text: `${worst.v.name} is at ${worst.h.overall}% (${worst.h.band.label}). Weakest subsystem: ${
          U.sortBy(worst.h.factors, (f) => f.score, "asc")[0].label
        }.`,
      });
    }

    const { overdue, dueSoon } = AC.maintenance.fleetSummary(vehicles);
    out.push({
      title: "SERVICE PIPELINE",
      text: overdue
        ? `${overdue} service${overdue === 1 ? " is" : "s are"} overdue and ${dueSoon} due soon across ${vehicles.length} vehicle${
            vehicles.length === 1 ? "" : "s"
          }.`
        : `No overdue services. ${dueSoon} item${dueSoon === 1 ? "" : "s"} due soon.`,
    });

    const cpk = vehicleId ? AC.expenses.costPerKm(vehicleId) : null;
    if (cpk) {
      out.push({
        title: "RUNNING COST",
        text: `Approximately ${U.formatCurrency(cpk * 100)} per 100 km based on recorded spend and distance.`,
      });
    }

    return out;
  }

  return {
    dashboardMetrics,
    odometerGrowth,
    maintenanceCostByType,
    exposureSeries,
    insights,
  };
})();

  </script>
  <script>
/* ===== js/notifications.js ===== */
/* ==========================================================================
   AutoCare Pro — notifications.js
   The alert engine. Alerts are *computed* from current state every time the
   UI asks for them — there is no stored list of hard-coded alert cards.
   Priority order: CRITICAL > WARNING > INFO > SUCCESS.
   ========================================================================== */

window.AC = window.AC || {};

AC.notifications = (function () {
  "use strict";

  const U = AC.utils;
  const C = AC.constants;
  const M = AC.maintenance;

  const PRIORITY = { critical: 0, warning: 1, info: 2, success: 3 };

  /**
   * Build the current alert list.
   * @param {object} env   optional environment reading (avoids a refetch)
   * @returns {object[]}   sorted, most urgent first
   */
  function generate(env = null) {
    const settings = AC.storage.getSettings();
    const vehicles = AC.vehicles.all();
    const alerts = [];

    if (!vehicles.length) {
      alerts.push({
        id: "no-vehicles",
        priority: "info",
        icon: "car",
        title: "No vehicles registered",
        meta: "Add your first vehicle to unlock health, maintenance and wash tracking.",
        action: { label: "Add vehicle", event: "vehicle:new" },
      });
      return alerts;
    }

    vehicles.forEach((vehicle) => {
      /* --- maintenance ------------------------------------------------- */
      if (settings.notifications.service) {
        M.scheduleFor(vehicle).forEach((row) => {
          if (row.status === M.STATUS.OVERDUE) {
            alerts.push({
              id: `overdue-${vehicle.id}-${row.type}`,
              priority: "critical",
              icon: "alert",
              vehicleId: vehicle.id,
              title: `${row.label.toUpperCase()} OVERDUE`,
              meta: `${vehicle.name} · ${describeRemaining(row, settings.units)}`,
              action: { label: "Log service", event: "maintenance:new", payload: { vehicleId: vehicle.id, type: row.type } },
            });
          } else if (row.status === M.STATUS.DUE_SOON) {
            alerts.push({
              id: `due-${vehicle.id}-${row.type}`,
              priority: "warning",
              icon: "wrench",
              vehicleId: vehicle.id,
              title: `${row.label.toUpperCase()} DUE SOON`,
              meta: `${vehicle.name} · ${describeRemaining(row, settings.units)}`,
              action: { label: "Log service", event: "maintenance:new", payload: { vehicleId: vehicle.id, type: row.type } },
            });
          }
        });
      }

      /* --- health ------------------------------------------------------ */
      const health = AC.health.calculateVehicleHealth(vehicle);
      if (health.overall < 50) {
        alerts.push({
          id: `health-${vehicle.id}`,
          priority: "critical",
          icon: "heart",
          vehicleId: vehicle.id,
          title: "VEHICLE HEALTH CRITICAL",
          meta: `${vehicle.name} is at ${health.overall}%. ${weakest(health)}`,
          action: { label: "Open vehicle", hash: "vehicles" },
        });
      } else if (health.overall < 75) {
        alerts.push({
          id: `health-${vehicle.id}`,
          priority: "warning",
          icon: "heart",
          vehicleId: vehicle.id,
          title: "VEHICLE HEALTH NEEDS ATTENTION",
          meta: `${vehicle.name} is at ${health.overall}%. ${weakest(health)}`,
          action: { label: "Open vehicle", hash: "vehicles" },
        });
      }

      /* --- wash -------------------------------------------------------- */
      if (settings.notifications.wash) {
        const wash = AC.wash.calculateWashScore(vehicle, env);
        if (wash.score >= 76) {
          alerts.push({
            id: `wash-${vehicle.id}`,
            priority: "warning",
            icon: "droplet",
            vehicleId: vehicle.id,
            title: "WASH RECOMMENDED",
            meta: `${vehicle.name} · wash score ${wash.score}/100 · ${wash.daysSinceWash} days since last wash`,
            action: { label: "Open advisor", hash: "wash" },
          });
        } else if (wash.score >= 56) {
          alerts.push({
            id: `wash-${vehicle.id}`,
            priority: "info",
            icon: "droplet",
            vehicleId: vehicle.id,
            title: "WASH RECOMMENDED SOON",
            meta: `${vehicle.name} · wash score ${wash.score}/100`,
            action: { label: "Open advisor", hash: "wash" },
          });
        }
      }
    });

    /* --- environment ---------------------------------------------------- */
    const reading = env || AC.environment.current();
    if (settings.notifications.environment && reading && reading.aqi >= 201) {
      const band = C.aqiBand(reading.aqi);
      alerts.push({
        id: "env-aqi",
        priority: reading.aqi >= 301 ? "warning" : "info",
        icon: "wind",
        title: "HIGH POLLUTION EXPOSURE",
        meta: `AQI ${reading.aqi} (${band.label}) at ${
          reading.location ? reading.location.label : "your location"
        }. Contamination builds up faster than usual.`,
        action: { label: "Open advisor", hash: "wash" },
      });
    }

    /* --- all clear ------------------------------------------------------ */
    if (!alerts.length) {
      alerts.push({
        id: "all-clear",
        priority: "success",
        icon: "check",
        title: "ALL SYSTEMS NOMINAL",
        meta: "No overdue services, no wash required and vehicle health is within range.",
      });
    }

    return alerts.sort((a, b) => PRIORITY[a.priority] - PRIORITY[b.priority]);
  }

  function describeRemaining(row, units) {
    const bits = [];
    if (row.remainingKm !== null) {
      bits.push(
        row.remainingKm < 0
          ? `${U.formatDistance(Math.abs(row.remainingKm), units)} past due`
          : `${U.formatDistance(row.remainingKm, units)} remaining`
      );
    }
    if (row.remainingDays !== null) {
      bits.push(
        row.remainingDays < 0
          ? `${Math.abs(row.remainingDays)} days past due`
          : `${row.remainingDays} days remaining`
      );
    }
    return bits.join(" · ") || "Interval reached";
  }

  const weakest = (health) => {
    const w = U.sortBy(health.factors, (f) => f.score, "asc")[0];
    return w ? `${U.titleCase(w.label)} at ${w.score}% — ${w.reason}.` : "";
  };

  const criticalCount = (alerts) => alerts.filter((a) => a.priority === "critical").length;

  const actionableCount = (alerts) =>
    alerts.filter((a) => a.priority === "critical" || a.priority === "warning").length;

  return { PRIORITY, generate, criticalCount, actionableCount };
})();
