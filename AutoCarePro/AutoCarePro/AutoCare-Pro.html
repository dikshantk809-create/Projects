              <div class="journey__stats">
                <div class="journey__stat"><span class="k">Distance</span><span class="v">${U.formatDistance(
                  t.distanceKm,
                  settings.units
                )}</span></div>
                <div class="journey__stat"><span class="k">Avg AQI</span><span class="v">${U.esc(
                  t.avgAqi ?? "—"
                )}</span></div>
                <div class="journey__stat"><span class="k">Dust</span><span class="v">${U.esc(
                  AC.journeys.dustLabel(t.dustLevel)
                )}</span></div>
                <div class="journey__stat"><span class="k">Date</span><span class="v">${U.formatDate(
                  t.date
                )}</span></div>
              </div>
              <button class="btn btn--sm btn--icon btn--danger" data-action="journey:delete" data-id="${U.esc(
                t.id
              )}" aria-label="Delete journey">${I.get("trash", { size: 14 })}</button>
            </div>`
            )
            .join("")}
        </div>

        <div class="divider"></div>
        <div class="stat-row">
          <div class="stat stat--accent">
            <span class="stat__label">Total distance</span>
            <span class="stat__value">${U.formatDistance(summary.totalDistance, settings.units)}</span>
          </div>
          <div class="stat">
            <span class="stat__label">Distance-weighted AQI</span>
            <span class="stat__value">${U.esc(summary.avgAqi ?? "—")}</span>
          </div>
          <div class="stat">
            <span class="stat__label">Dust exposure</span>
            <span class="stat__value">${Math.round(summary.dust * 100)}%</span>
          </div>
          <div class="stat">
            <span class="stat__label">Journeys</span>
            <span class="stat__value">${U.pad2(summary.count)}</span>
          </div>
        </div>
      </article>`;
  }

  function historyCard(vehicle, settings) {
    const rows = AC.wash.history(vehicle.id);
    if (!rows.length) {
      return UI.emptyState({
        icon: "droplet",
        title: "No washes recorded",
        text: "Record a wash to reset the time and usage factors of the score.",
        actionLabel: "Record wash",
        actionEvent: "wash:new",
      });
    }
    return `
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Date</th><th>Odometer</th><th>Cost</th><th>Interval</th><th></th></tr></thead>
          <tbody>
            ${rows
              .map((w, idx) => {
                const prev = rows[idx + 1];
                const gap = prev ? U.daysBetween(prev.date, w.date) : null;
                return `
                <tr>
                  <td class="num">${U.formatDate(w.date)} ${w.source === "demo" ? UI.demoFlag() : ""}</td>
                  <td class="num">${U.formatDistance(w.odometer, settings.units)}</td>
                  <td class="num">${U.formatCurrency(w.cost)}</td>
                  <td class="num text-muted">${gap === null ? "—" : `${gap} days after previous`}</td>
                  <td>
                    <div class="actions">
                      <button class="btn btn--sm btn--icon btn--danger" data-action="wash:delete" data-id="${U.esc(
                        w.id
                      )}" aria-label="Delete wash record">${I.get("trash", { size: 14 })}</button>
                    </div>
                  </td>
                </tr>`;
              })
              .join("")}
          </tbody>
        </table>
      </div>`;
  }

  /* ---------------------------------------------------------------- mount -- */

  function mount(root) {
    U.raf(() =>
      U.raf(() => {
        const arc = U.$("#gaugeArc", root);
        if (arc) arc.style.strokeDashoffset = arc.dataset.offset;
      })
    );

    const picker = U.$("#washVehiclePicker", root);
    if (picker) {
      picker.addEventListener("change", (e) => {
        state.vehicleId = e.target.value;
        AC.router.refresh();
      });
    }
  }

  return { render, mount, state, get lastResult() { return lastResult; } };
})();

  </script>
  <script>
/* ===== js/pages/analytics.js ===== */
/* ==========================================================================
   AutoCare Pro — pages/analytics.js
   Eight charts, all fed by computed series. Charts are created in mount() and
   destroyed by the router before the next page renders.
   ========================================================================== */

window.AC = window.AC || {};
AC.pages = AC.pages || {};

AC.pages.analytics = (function () {
  "use strict";

  const U = AC.utils;
  const UI = AC.ui;
  const I = AC.icons;

  let state = { vehicleId: "all", months: 6 };

  const scopeFilter = () => (state.vehicleId === "all" ? {} : { vehicleId: state.vehicleId });
  const scopeId = () => (state.vehicleId === "all" ? null : state.vehicleId);

  function render() {
    const vehicles = AC.vehicles.all();
    if (!vehicles.length) {
      return `
        <section class="page">
          ${header([])}
          ${UI.emptyState({
            icon: "chart",
            title: "Nothing to analyse yet",
            text: "Add a vehicle and record a few services, expenses or journeys — the charts build themselves from your data.",
            actionLabel: "Add vehicle",
            actionEvent: "vehicle:new",
          })}
        </section>`;
    }

    const insights = AC.analytics.insights(scopeId());

    return `
      <section class="page">
        ${header(vehicles)}

        <div class="grid grid--2 stagger" style="margin-bottom:var(--sp-4)">
          ${insights
            .slice(0, 4)
            .map(
              (ins) => `
            <div class="insight">
              <span class="insight__mark"></span>
              <div>
                <div class="insight__title">${U.esc(ins.title)}</div>
                <div class="insight__text">${U.esc(ins.text)}</div>
              </div>
            </div>`
            )
            .join("")}
        </div>

        <div class="grid grid--2">
          ${chartCard("Monthly expenses", "Total recorded spend per month", "chMonthly")}
          ${chartCard("Expense distribution", "Share of spend by category", "chCategory")}
        </div>

        <div class="grid grid--2 mt-4">
          ${chartCard("Vehicle usage", "Distance from logged journeys", "chUsage")}
          ${chartCard("Odometer growth", "Reconstructed from recorded readings", "chOdometer")}
        </div>

        <div class="grid grid--2 mt-4">
          ${chartCard("Maintenance cost by type", "Where service money goes", "chMaintenance")}
          ${chartCard("Vehicle health trend", "Score replayed over recent months", "chHealth")}
        </div>

        <div class="grid grid--2 mt-4">
          ${chartCard("Wash frequency", "Washes recorded per month", "chWash")}
          ${chartCard("Environmental exposure", "Distance-weighted AQI and dust index", "chExposure")}
        </div>
      </section>`;
  }

  function header(vehicles) {
    return `
      <header class="page-head">
        <div>
          <div class="page-head__eyebrow">Data intelligence</div>
          <h1>Analytics</h1>
          <p class="page-head__sub">
            Spending, usage, health and exposure trends — every series is derived from the records
            stored on this device.
          </p>
        </div>
        <div class="page-head__actions">
          ${
            vehicles.length
              ? `<select class="select" id="anVehicle" aria-label="Scope" style="min-width:190px">
                   <option value="all"${state.vehicleId === "all" ? " selected" : ""}>All vehicles</option>
                   ${vehicles
                     .map(
                       (v) =>
                         `<option value="${U.esc(v.id)}"${state.vehicleId === v.id ? " selected" : ""}>${U.esc(
                           v.name
                         )}</option>`
                     )
                     .join("")}
                 </select>`
              : ""
          }
          <div class="segmented" role="group" aria-label="Time range">
            ${[3, 6, 12]
              .map(
                (m) =>
                  `<button data-months="${m}" class="${state.months === m ? "is-active" : ""}">${m}M</button>`
              )
              .join("")}
          </div>
        </div>
      </header>`;
  }

  function chartCard(title, sub, canvasId, extra = "") {
    return `
      <article class="chart-card">
        <div class="chart-card__head">
          <div>
            <h3 class="chart-card__title">${U.esc(title)}</h3>
            <div class="chart-card__sub">${U.esc(sub)}</div>
          </div>
          ${extra}
        </div>
        <div class="chart-box"><canvas id="${canvasId}"></canvas></div>
      </article>`;
  }

  /* ---------------------------------------------------------------- mount -- */

  function mount(root) {
    const picker = U.$("#anVehicle", root);
    if (picker) {
      picker.addEventListener("change", (e) => {
        state.vehicleId = e.target.value;
        AC.router.refresh();
      });
    }
    U.$$("[data-months]", root).forEach((btn) =>
      btn.addEventListener("click", () => {
        state.months = Number(btn.dataset.months);
        AC.router.refresh();
      })
    );

    if (!AC.charts.available() || !AC.vehicles.count()) return;

    const months = state.months;
    const filter = scopeFilter();
    const id = scopeId();

    /* 1. Monthly expenses (stacked by category) */
    const stacked = AC.expenses.monthlyByCategory(filter, months);
    if (stacked.series.length) {
      AC.charts.stackedBar("chMonthly", { labels: stacked.labels, series: stacked.series });
    } else {
      const m = AC.expenses.monthly(filter, months);
      AC.charts.bar("chMonthly", {
        labels: m.map((x) => x.label),
        data: m.map((x) => x.value),
        money: true,
        label: "Spend",
      });
    }

    /* 2. Category distribution */
    const cats = AC.expenses.byCategory(filter);
    AC.charts.doughnut("chCategory", {
      labels: cats.map((c) => c.label),
      data: cats.map((c) => c.amount),
      colors: cats.map((c) => c.hex),
    });

    /* 3. Usage */
    const usage = AC.journeys.monthlyDistance(id, months);
    AC.charts.line("chUsage", {
      labels: usage.map((x) => x.label),
      data: usage.map((x) => x.value),
      label: "Distance (km)",
      color: AC.charts.css("--viz-2", "#4aa8ff"),
      suffix: " km",
    });

    /* 4. Odometer growth (primary or selected vehicle) */
    const odoVehicle = id || (AC.vehicles.primary() || {}).id;
    const odo = AC.analytics.odometerGrowth(odoVehicle, months);
    AC.charts.line("chOdometer", {
      labels: odo.map((x) => x.label),
      data: odo.map((x) => x.value),
      label: "Odometer (km)",
      color: AC.charts.css("--viz-3", "#39ff88"),
      suffix: " km",
    });

    /* 5. Maintenance cost by type */
    const byType = AC.analytics.maintenanceCostByType(id);
    AC.charts.bar("chMaintenance", {
      labels: byType.map((x) => x.label),
      data: byType.map((x) => x.value),
      money: true,
      label: "Spend",
    });

    /* 6. Health trend */
    const trendVehicle = AC.vehicles.get(odoVehicle);
    const trend = AC.health.healthTrend(trendVehicle, months);
    AC.charts.line("chHealth", {
      labels: trend.map((x) => x.label),
      data: trend.map((x) => x.value),
      label: "Health score",
      color: AC.charts.css("--viz-4", "#ff9d2e"),
      suffix: "%",
    });

    /* 7. Wash frequency */
    const washes = AC.wash.monthlyFrequency(id, months);
    AC.charts.bar("chWash", {
      labels: washes.map((x) => x.label),
      data: washes.map((x) => x.value),
      label: "Washes",
      color: AC.charts.css("--viz-6", "#22d3ee"),
      integer: true,
    });

    /* 8. Environmental exposure */
    const exposure = AC.analytics.exposureSeries(id, months);
    AC.charts.multiLine("chExposure", {
      labels: exposure.map((x) => x.label),
      series: [
        {
          label: "Avg AQI",
          data: exposure.map((x) => x.aqi),
          color: AC.charts.css("--viz-1", "#e10600"),
        },
        {
          label: "Dust index",
          data: exposure.map((x) => x.dust),
          color: AC.charts.css("--viz-7", "#f5d90a"),
        },
      ],
    });
  }

  return { render, mount, state };
})();

  </script>
  <script>
/* ===== js/pages/expenses.js ===== */
/* ==========================================================================
   AutoCare Pro — pages/expenses.js
   Expense ledger with category breakdown and a spend chart.
   ========================================================================== */

window.AC = window.AC || {};
AC.pages = AC.pages || {};

AC.pages.expenses = (function () {
  "use strict";

  const U = AC.utils;
  const UI = AC.ui;
  const I = AC.icons;
  const C = AC.constants;

  let state = { vehicleId: "all", category: "all", range: "all", limit: 25 };

  function filterObj() {
    const f = {};
    if (state.vehicleId !== "all") f.vehicleId = state.vehicleId;
    if (state.category !== "all") f.category = state.category;
    if (state.range !== "all") {
      const days = Number(state.range);
      f.from = U.isoDate(U.addDays(U.today(), -days));
    }
    return f;
  }

  function render() {
    const vehicles = AC.vehicles.all();
    if (!vehicles.length) {
      return `
        <section class="page">
          ${header()}
          ${UI.emptyState({
            icon: "rupee",
            title: "No vehicles registered",
            text: "Expenses are tracked per vehicle. Add one to begin recording costs.",
            actionLabel: "Add vehicle",
            actionEvent: "vehicle:new",
          })}
        </section>`;
    }

    const filter = filterObj();
    const rows = AC.expenses.query(filter);
    const cats = AC.expenses.byCategory(filter);
    const grand = U.sum(rows, (e) => e.amount);

    const scope = state.vehicleId === "all" ? {} : { vehicleId: state.vehicleId };

    return `
      <section class="page">
        ${header()}
        ${toolbar(vehicles, Math.min(state.limit, rows.length), rows.length)}

        <div class="expense-summary stagger">
          ${UI.metricCard({ label: "Total expenses", value: AC.expenses.total(scope), format: "money", icon: "rupee", foot: "All time" })}
          ${UI.metricCard({ label: "This month", value: AC.expenses.monthToDate(scope), format: "money", icon: "calendar", foot: U.monthLabel(U.formatMonthKey(U.today())) })}
          ${UI.metricCard({ label: "Fuel", value: AC.expenses.total({ ...scope, category: "fuel" }), format: "money", icon: "fuel", foot: "Recorded fills" })}
          ${UI.metricCard({ label: "Maintenance", value: AC.expenses.total({ ...scope, category: "maintenance" }) + AC.expenses.total({ ...scope, category: "repair" }), format: "money", icon: "wrench", foot: "Service + repair" })}
          ${UI.metricCard({ label: "Wash", value: AC.expenses.total({ ...scope, category: "wash" }), format: "money", icon: "droplet", foot: "Cleaning spend" })}
        </div>

        <div class="grid grid--2">
          <article class="chart-card">
            <div class="chart-card__head">
              <div>
                <h3 class="chart-card__title">Monthly spend</h3>
                <div class="chart-card__sub">Last 6 months, filtered by the controls above</div>
              </div>
            </div>
            <div class="chart-box"><canvas id="expMonthly"></canvas></div>
          </article>

          <article class="card">
            <div class="card__head">
              <span class="card__title">Category breakdown</span>
              <span class="count-note">${U.formatCurrency(grand)}</span>
            </div>
            ${
              cats.length
                ? `<div class="breakdown">${cats
                    .map(
                      (c) => `
                  <div class="breakdown__row">
                    <div class="breakdown__head">
                      <span class="cat-chip"><span class="cat-chip__dot" style="background:${c.hex}"></span>${U.esc(
                        c.label
                      )}</span>
                      <span>
                        <span class="money">${U.formatCurrency(c.amount)}</span>
                        <span class="breakdown__pct">${Math.round(c.share * 100)}%</span>
                      </span>
                    </div>
                    <div class="bar__track">
                      <div class="bar__fill" data-width="${c.share * 100}"
                           style="background:${c.hex};box-shadow:0 0 12px -2px ${c.hex}"></div>
                    </div>
                  </div>`
                    )
                    .join("")}</div>`
                : `<p class="text-muted">No expenses match the current filters.</p>`
            }
          </article>
        </div>

        ${UI.sectionHead("Expense ledger", `${rows.length} record${rows.length === 1 ? "" : "s"}`)}
        ${
          rows.length
            ? table(rows.slice(0, state.limit)) +
              (rows.length > state.limit
                ? `<div class="flex mt-4" style="justify-content:center">
                     <button class="btn" id="expMore">Load ${Math.min(25, rows.length - state.limit)} more</button>
                   </div>`
                : "")
            : UI.emptyState({
                icon: "rupee",
                title: "No expenses recorded",
                text: "Record fuel, maintenance, wash or insurance costs to build the analytics.",
                actionLabel: "Record expense",
                actionEvent: "expense:new",
              })
        }
      </section>`;
  }

  function header() {
    return `
      <header class="page-head">
        <div>
          <div class="page-head__eyebrow">Cost of ownership</div>
          <h1>Expenses</h1>
          <p class="page-head__sub">
            Every rupee spent on the fleet, grouped by category and vehicle.
          </p>
        </div>
        <div class="page-head__actions">
          <button class="btn btn--primary" data-action="expense:new">
            ${I.get("plus", { size: 16 })}<span>Record expense</span>
          </button>
        </div>
      </header>`;
  }

  /** Filters live in their own toolbar so the page title is never squeezed. */
  function toolbar(vehicles, shown, total) {
    return `
      <div class="toolbar">
        <select class="select" id="expVehicle" aria-label="Filter by vehicle">
          <option value="all"${state.vehicleId === "all" ? " selected" : ""}>All vehicles</option>
          ${vehicles
            .map(
              (v) =>
                `<option value="${U.esc(v.id)}"${state.vehicleId === v.id ? " selected" : ""}>${U.esc(
                  v.name
                )}</option>`
            )
            .join("")}
        </select>
        <select class="select" id="expCategory" aria-label="Filter by category">
          <option value="all"${state.category === "all" ? " selected" : ""}>All categories</option>
          ${C.EXPENSE_CATEGORIES.map(
            (c) => `<option value="${c.key}"${state.category === c.key ? " selected" : ""}>${c.label}</option>`
          ).join("")}
        </select>
        <select class="select" id="expRange" aria-label="Filter by period">
          <option value="all"${state.range === "all" ? " selected" : ""}>All time</option>
          <option value="30"${state.range === "30" ? " selected" : ""}>Last 30 days</option>
          <option value="90"${state.range === "90" ? " selected" : ""}>Last 90 days</option>
          <option value="365"${state.range === "365" ? " selected" : ""}>Last year</option>
        </select>
        <div class="toolbar__spacer"></div>
        <span class="count-note">Showing ${U.pad2(shown)} of ${U.pad2(total)}</span>
      </div>`;
  }

  function table(rows) {
    const vehicleName = (id) => {
      const v = AC.vehicles.get(id);
      return v ? v.name : "Deleted vehicle";
    };
    return `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Date</th><th>Vehicle</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr>
          </thead>
          <tbody>
            ${rows
              .map((e) => {
                const cat = C.EXPENSE_BY_KEY[e.category] || C.EXPENSE_BY_KEY.other;
                return `
                <tr>
                  <td class="num">${U.formatDate(e.date)}</td>
                  <td>${U.esc(vehicleName(e.vehicleId))} ${e.source === "demo" ? UI.demoFlag() : ""}</td>
                  <td><span class="cat-chip"><span class="cat-chip__dot" style="background:${cat.hex}"></span>${U.esc(
                  cat.label
                )}</span></td>
                  <td class="text-muted">${U.esc(e.description || "—")}</td>
                  <td class="num money">${U.formatCurrency(e.amount)}</td>
                  <td>
                    <div class="actions">
                      <button class="btn btn--sm btn--icon" data-action="expense:edit" data-id="${U.esc(e.id)}"
                              aria-label="Edit expense">${I.get("edit", { size: 14 })}</button>
                      <button class="btn btn--sm btn--icon btn--danger" data-action="expense:delete" data-id="${U.esc(
                        e.id
                      )}" aria-label="Delete expense">${I.get("trash", { size: 14 })}</button>
                    </div>
                  </td>
                </tr>`;
              })
              .join("")}
          </tbody>
        </table>
      </div>`;
  }

  function mount(root) {
    const bind = (id, key) => {
      const el = U.$(id, root);
      if (el) {
        el.addEventListener("change", (e) => {
          state[key] = e.target.value;
          state.limit = 25; // a new filter starts a fresh page
          AC.router.refresh();
        });
      }
    };
    bind("#expVehicle", "vehicleId");
    bind("#expCategory", "category");
    bind("#expRange", "range");

    const more = U.$("#expMore", root);
    if (more) {
      more.addEventListener("click", () => {
        state.limit += 25;
        AC.router.refresh();
      });
    }

    if (AC.charts.available() && AC.vehicles.count()) {
      const series = AC.expenses.monthly(filterObj(), 6);
      AC.charts.bar("expMonthly", {
        labels: series.map((s) => s.label),
        data: series.map((s) => s.value),
        money: true,
        label: "Spend",
      });
    }
  }

  return { render, mount, state };
})();

  </script>
  <script>
/* ===== js/pages/settings.js ===== */
/* ==========================================================================
   AutoCare Pro — pages/settings.js
   Profile, units, notifications, location, environment provider, motion and
   data management (export / import / reset).
   ========================================================================== */

window.AC = window.AC || {};
AC.pages = AC.pages || {};

AC.pages.settings = (function () {
  "use strict";

  const U = AC.utils;
  const UI = AC.ui;
  const I = AC.icons;
  const S = AC.storage;

  const SECTIONS = [
    { id: "profile", label: "Profile", icon: "user" },
    { id: "units", label: "Units", icon: "ruler" },
    { id: "notifications", label: "Notifications", icon: "bell" },
    { id: "location", label: "Location", icon: "pin" },
    { id: "environment", label: "Environmental data", icon: "wind" },
    { id: "appearance", label: "Appearance", icon: "sun" },
    { id: "data", label: "Data management", icon: "database" },
  ];

  let permission = "unknown";

  function render() {
    const s = S.getSettings();
    const db = S.loadDB();
    const bytes = S.usageBytes();

    return `
      <section class="page">
        <header class="page-head">
          <div>
            <div class="page-head__eyebrow">System</div>
            <h1>Settings</h1>
            <p class="page-head__sub">
              Everything here is stored locally in your browser under a single key
              (<code>${U.esc(S.KEY)}</code>). Nothing leaves this device unless you export it.
            </p>
          </div>
        </header>

        <div class="settings-layout">
          <nav class="settings-nav" aria-label="Settings sections">
            ${SECTIONS.map(
              (sec, i) =>
                `<button data-section="${sec.id}" class="${i === 0 ? "is-active" : ""}">
                   ${I.get(sec.icon, { size: 16 })}<span>${sec.label}</span>
                 </button>`
            ).join("")}
          </nav>

          <div class="settings-panels">
            ${profileSection(s)}
            ${unitsSection(s)}
            ${notificationsSection(s)}
            ${locationSection(s)}
            ${environmentSection(s)}
            ${appearanceSection(s)}
            ${dataSection(s, db, bytes)}
          </div>
        </div>
      </section>`;
  }

  const panel = (id, title, hint, inner) => `
    <article class="card settings-section" id="sec-${id}">
      <div class="card__head">
        <div>
          <span class="card__title">${U.esc(title)}</span>
          ${hint ? `<div class="chart-card__sub">${U.esc(hint)}</div>` : ""}
        </div>
      </div>
      ${inner}
    </article>`;

  const row = (title, desc, control) => `
    <div class="setting-row">
      <div class="setting-row__info">
        <div class="setting-row__title">${U.esc(title)}</div>
        <div class="setting-row__desc">${desc}</div>
      </div>
      <div class="setting-row__control">${control}</div>
    </div>`;

  /* ------------------------------------------------------------ sections -- */

  function profileSection(s) {
    return panel(
      "profile",
      "Profile",
      "Shown in the sidebar, the top bar and the dashboard greeting.",
      row(
        "Display name",
        "Used in the greeting — “Good morning, …”.",
        `<input class="input" id="setName" value="${U.esc(s.userName)}" maxlength="30" aria-label="Display name" />`
      ) +
        row(
          "Role label",
          "A short description shown under your name.",
          `<input class="input" id="setRole" value="${U.esc(s.userRole)}" maxlength="30" aria-label="Role label" />`
        )
    );
  }

  function unitsSection(s) {
    return panel(
      "units",
      "Units",
      "Distances are always stored in kilometres; this only changes how they are displayed.",
      row(
        "Distance unit",
        "Kilometres or miles.",
        `<div class="segmented" role="group" aria-label="Distance unit">
           <button data-units="km" class="${s.units === "km" ? "is-active" : ""}">Kilometres</button>
           <button data-units="mi" class="${s.units === "mi" ? "is-active" : ""}">Miles</button>
         </div>`
      )
    );
  }

  function notificationsSection(s) {
    const t = (key, label, desc) =>
      row(label, desc, UI.switchField({ name: `notif-${key}`, label: "", checked: s.notifications[key] }));
    return panel(
      "notifications",
      "Notifications",
      "Alerts are recomputed from your data every time a screen renders.",
      t("service", "Service alerts", "Overdue and due-soon maintenance items.") +
        t("wash", "Wash recommendations", "Raised when the wash score crosses 56.") +
        t("environment", "Environmental alerts", "Raised when AQI reaches the Poor band (201+).") +
        t("expense", "Expense reminders", "Reserved for future budget alerts.")
    );
  }

  function locationSection(s) {
    return panel(
      "location",
      "Location",
      "Location is optional. The app works fully without it.",
      row(
        "Location source",
        "Device location uses the browser Geolocation API and asks for permission. If it is denied or unavailable, AutoCare Pro silently falls back to the manual location.",
        `<div class="segmented" role="group" aria-label="Location source">
           <button data-location="manual" class="${s.locationMode === "manual" ? "is-active" : ""}">Manual</button>
           <button data-location="device" class="${s.locationMode === "device" ? "is-active" : ""}">Device</button>
         </div>`
      ) +
        row(
          "Manual location",
          "Used when device location is off or unavailable.",
          `<input class="input" id="setLocLabel" value="${U.esc(s.manualLocation.label)}" placeholder="City" aria-label="Location label" />
           <input class="input" id="setLat" type="number" step="0.0001" value="${U.esc(
             s.manualLocation.lat
           )}" style="min-width:120px" placeholder="Latitude" aria-label="Latitude" />
           <input class="input" id="setLon" type="number" step="0.0001" value="${U.esc(
             s.manualLocation.lon
           )}" style="min-width:120px" placeholder="Longitude" aria-label="Longitude" />`
        ) +
        row(
          "Permission status",
          "Reported by the browser without prompting, where supported.",
          `<span class="pill pill--muted" id="permState">${U.esc(permission)}</span>
           <button class="btn btn--sm" id="checkPermission">Check</button>`
        )
    );
  }

  function environmentSection(s) {
    const env = AC.environment.current();
    return panel(
      "environment",
      "Environmental data",
      "The provider that supplies AQI and weather to the Wash Advisor.",
      row(
        "Provider mode",
        "<strong>Mock</strong> is deterministic offline data — the app is fully functional with no network and no API key. <strong>Live</strong> uses the key-free Open-Meteo air-quality and forecast APIs; if the request fails the app degrades to mock automatically.",
        `<div class="segmented" role="group" aria-label="Environment provider">
           <button data-env="mock" class="${s.environmentMode === "mock" ? "is-active" : ""}">Mock / offline</button>
           <button data-env="live" class="${s.environmentMode === "live" ? "is-active" : ""}">Live (Open-Meteo)</button>
         </div>`
      ) +
        row(
          "Current reading",
          env
            ? `${U.esc(env.provider)} · AQI ${U.esc(env.aqi)} · ${U.esc(env.weather)} · fetched ${U.esc(
                new Date(env.fetchedAt).toLocaleString()
              )}`
            : "No reading cached yet.",
          `<button class="btn btn--sm" data-action="env:refresh">${I.get("refresh", { size: 14 })}<span>Refresh now</span></button>`
        )
    );
  }

  function appearanceSection(s) {
    return panel(
      "appearance",
      "Appearance",
      "AutoCare Pro ships as a single dark automotive theme, tuned for contrast on OLED panels.",
      row(
        "Theme",
        "The instrument-cluster palette is the product's identity, so there is no light mode. Accent, surface and status colours are all CSS variables in <code>css/variables.css</code> if you want to retheme it.",
        `<span class="pill pill--accent pill--plain">Dark cockpit</span>`
      ) +
        row(
          "Reduce motion",
          "Turns off non-essential animation. Your operating system's “reduce motion” setting is honoured automatically; this forces it on.",
          UI.switchField({ name: "reduceMotion", label: "", checked: s.reduceMotion })
        )
    );
  }

  function dataSection(s, db, bytes) {
    const counts = [
      ["Vehicles", db.vehicles.length],
      ["Service records", db.maintenanceRecords.length],
      ["Expenses", db.expenses.length],
      ["Journeys", db.journeys.length],
      ["Washes", db.washRecords.length],
    ];
    const quota = 5 * 1024 * 1024; // typical 5 MB localStorage budget
    const pct = U.clamp((bytes / quota) * 100, 0, 100);

    return `
      <article class="card settings-section danger-zone" id="sec-data">
        <div class="card__head">
          <div>
            <span class="card__title">Data management</span>
            <div class="chart-card__sub">Export, import or reset the local database.</div>
          </div>
          ${s.seededDemoData ? UI.demoFlag() : ""}
        </div>

        <div class="stat-row" style="margin-bottom:var(--sp-4)">
          ${counts
            .map(
              ([k, v]) => `<div class="stat"><span class="stat__label">${k}</span>
                            <span class="stat__value">${U.pad2(v)}</span></div>`
            )
            .join("")}
        </div>

        <div class="storage-meter" style="margin-bottom:var(--sp-4)">
          <div class="flex-between">
            <span class="micro-label">Storage used</span>
            <span class="mono" style="font-size:var(--fs-xs)">${(bytes / 1024).toFixed(1)} KB of ~5 MB</span>
          </div>
          <div class="storage-meter__bar"><div class="storage-meter__fill" style="width:${pct}%"></div></div>
        </div>

        ${row(
          "Export data",
          "Downloads the entire database as a timestamped JSON file — a complete backup you can re-import on any device.",
          `<button class="btn" id="btnExport">${I.get("download", { size: 15 })}<span>Export JSON</span></button>`
        )}
        ${row(
          "Import data",
          "Replaces the current database with a previously exported file. The payload is validated and sanitised before it is applied.",
          `<input type="file" id="importFile" accept="application/json,.json" hidden />
           <button class="btn" id="btnImport">${I.get("upload", { size: 15 })}<span>Import JSON</span></button>`
        )}
        ${row(
          "Reload demo data",
          "Clears everything and re-seeds the two demo vehicles with their full history.",
          `<button class="btn" id="btnReseed">${I.get("refresh", { size: 15 })}<span>Reset with demo data</span></button>`
        )}
        ${row(
          "Reset application",
          "Deletes every record and setting. This cannot be undone.",
          `<button class="btn btn--danger" id="btnReset">${I.get("trash", { size: 15 })}<span>Erase everything</span></button>`
        )}
      </article>`;
  }

  /* --------------------------------------------------------------- mount -- */

  function mount(root) {
    /* section navigation */
    U.$$("[data-section]", root).forEach((btn) =>
      btn.addEventListener("click", () => {
        U.$$("[data-section]", root).forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        const target = U.$(`#sec-${btn.dataset.section}`, root);
        if (target) target.scrollIntoView({ behavior: U.prefersReducedMotion() ? "auto" : "smooth", block: "start" });
      })
    );

    /* profile */
    const save = U.debounce(() => {
      S.setSettings({
        userName: (U.$("#setName", root).value || "Driver").trim().slice(0, 30),
        userRole: (U.$("#setRole", root).value || "Vehicle Owner").trim().slice(0, 30),
      });
      AC.app.renderChrome();
      UI.toast("Profile updated.");
    }, 500);
    ["#setName", "#setRole"].forEach((sel) => {
      const el = U.$(sel, root);
      if (el) el.addEventListener("input", save);
    });

    /* units */
    U.$$("[data-units]", root).forEach((btn) =>
      btn.addEventListener("click", () => {
        S.setSettings({ units: btn.dataset.units });
        UI.toast(`Distances now shown in ${btn.dataset.units === "mi" ? "miles" : "kilometres"}.`);
        AC.router.refresh();
      })
    );

    /* notifications */
    U.$$('input[name^="notif-"]', root).forEach((input) =>
      input.addEventListener("change", () => {
        const key = input.name.replace("notif-", "");
        S.setSettings({ notifications: { [key]: input.checked } });
        UI.toast("Notification preferences updated.");
      })
    );

    /* location */
    U.$$("[data-location]", root).forEach((btn) =>
      btn.addEventListener("click", async () => {
        S.setSettings({ locationMode: btn.dataset.location });
        UI.toast(
          btn.dataset.location === "device"
            ? "Device location enabled. Your browser may ask for permission."
            : "Using the manual location."
        );
        await AC.app.refreshEnvironment({ force: true });
        AC.router.refresh();
      })
    );

    const saveLoc = U.debounce(() => {
      const lat = Number(U.$("#setLat", root).value);
      const lon = Number(U.$("#setLon", root).value);
      if (Number.isNaN(lat) || Number.isNaN(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
        UI.toast("Latitude must be between -90 and 90, longitude between -180 and 180.", {
          type: "error",
          title: "Invalid coordinates",
        });
        return;
      }
      S.setSettings({
        manualLocation: {
          label: (U.$("#setLocLabel", root).value || "Custom location").trim().slice(0, 40),
          lat,
          lon,
        },
      });
      AC.app.refreshEnvironment({ force: true });
      UI.toast("Location updated.");
    }, 700);
    ["#setLocLabel", "#setLat", "#setLon"].forEach((sel) => {
      const el = U.$(sel, root);
      if (el) el.addEventListener("input", saveLoc);
    });

    const permBtn = U.$("#checkPermission", root);
    if (permBtn) {
      permBtn.addEventListener("click", async () => {
        permission = await AC.environment.permissionState();
        const el = U.$("#permState", root);
        if (el) el.textContent = permission;
        UI.toast(`Geolocation permission: ${permission}.`, { type: "info" });
      });
    }

    /* environment provider */
    U.$$("[data-env]", root).forEach((btn) =>
      btn.addEventListener("click", async () => {
        S.setSettings({ environmentMode: btn.dataset.env });
        UI.toast(
          btn.dataset.env === "live"
            ? "Switched to the live provider. Fetching…"
            : "Switched to deterministic offline data."
        );
        await AC.app.refreshEnvironment({ force: true });
        AC.router.refresh();
      })
    );

    /* appearance */
    const rm = U.$('input[name="reduceMotion"]', root);
    if (rm) {
      rm.addEventListener("change", () => {
        S.setSettings({ reduceMotion: rm.checked });
        document.documentElement.classList.toggle("reduce-motion", rm.checked);
        UI.toast(rm.checked ? "Non-essential motion disabled." : "Motion restored.");
      });
    }

    /* data management */
    const exportBtn = U.$("#btnExport", root);
    if (exportBtn) {
      exportBtn.addEventListener("click", () => {
        U.downloadFile(`autocare-pro-backup-${U.isoDate(U.today())}.json`, S.exportDB());
        UI.toast("Data exported successfully.");
      });
    }

    const importBtn = U.$("#btnImport", root);
    const fileInput = U.$("#importFile", root);
    if (importBtn && fileInput) {
      importBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        try {
          const text = await U.readFileAsText(file);
          S.importDB(text);
          UI.toast("Data imported successfully.");
          AC.app.refreshAll();
        } catch (err) {
          UI.toast(err.message || "The selected file is not valid AutoCare Pro data.", {
            type: "error",
            title: "Import failed",
          });
        } finally {
          fileInput.value = "";
        }
      });
    }

    const reseed = U.$("#btnReseed", root);
    if (reseed) {
      reseed.addEventListener("click", async () => {
        const ok = await UI.confirm({
          title: "Reload demo data?",
          message:
            "This clears every record you have added and restores the two demo vehicles with their full history. This action cannot be undone.",
          confirmLabel: "Reload demo data",
        });
        if (!ok) return;
        S.resetDB({ seed: true });
        UI.toast("Demo data restored.");
        AC.app.refreshAll();
      });
    }

    const reset = U.$("#btnReset", root);
    if (reset) {
      reset.addEventListener("click", async () => {
        const ok = await UI.confirm({
          title: "Reset application data?",
          message:
            "Every vehicle, service record, expense, journey and setting will be permanently deleted from this browser. This action cannot be undone.",
          confirmLabel: "Erase everything",
        });
        if (!ok) return;
        S.resetDB({ seed: false });
        UI.toast("Application data erased.");
        AC.app.refreshAll();
      });
    }

    // Non-blocking permission probe on entry.
    AC.environment.permissionState().then((state) => {
      permission = state;
      const el = U.$("#permState");
      if (el) el.textContent = state;
    });
  }

  return { render, mount };
})();

  </script>

  <!-- Bootstrap -->
  <script>
/* ===== js/app.js ===== */
/* ==========================================================================
   AutoCare Pro — app.js
   Application bootstrap and the global shell:
     - builds the sidebar / top bar / mobile navigation from ROUTES
     - one delegated click handler drives every [data-action] in the app
     - command palette (Ctrl/Cmd + K) and keyboard shortcuts
     - splash screen lifecycle
     - service-worker registration and online/offline status
   ========================================================================== */

window.AC = window.AC || {};

AC.app = (function () {
  "use strict";

  const U = AC.utils;
  const UI = AC.ui;
  const I = AC.icons;
  const C = AC.constants;

  let paletteIndex = 0;
  let paletteItems = [];

  /* ================================================================ chrome = */

  function renderChrome() {
    renderSidebar();
    renderTopbar();
    renderMobileNav();
    if (AC.router.current) AC.router.render();
  }

  function renderSidebar() {
    const sidebar = U.$("#sidebar");
    if (!sidebar) return;
    const groups = [];
    C.ROUTES.forEach((r) => {
      let g = groups.find((x) => x.label === r.group);
      if (!g) {
        g = { label: r.group, items: [] };
        groups.push(g);
      }
      g.items.push(r);
    });

    const alerts = AC.notifications.generate(AC.environment.current());
    const badges = {
      maintenance: alerts.filter((a) => a.id.startsWith("overdue-") || a.id.startsWith("due-")).length,
      wash: alerts.filter((a) => a.id.startsWith("wash-")).length,
    };

    sidebar.innerHTML = `
      <div class="sidebar__brand">
        <span class="brand-mark">${I.logo(34)}</span>
        <span class="brand-text">
          <span class="brand-text__name">AutoCare</span>
          <span class="brand-text__sub">// PRO</span>
        </span>
      </div>

      <div class="sidebar__status">
        <span class="pill pill--success pill--live" style="border:0;background:transparent;padding:0"></span>
        <span id="systemStatus">System online</span>
      </div>

      <nav class="sidebar__nav" aria-label="Primary">
        ${groups
          .map(
            (g) => `
          <div class="nav-group">
            <div class="nav-group__label">${U.esc(g.label)}</div>
            ${g.items
              .map(
                (item) => `
              <a class="nav-item" href="#${item.hash}" data-route="${item.hash}">
                <span class="nav-item__icon">${I.get(item.icon, { size: 18 })}</span>
                <span>${U.esc(item.label)}</span>
                ${
                  badges[item.hash]
                    ? `<span class="nav-item__badge">${badges[item.hash]}</span>`
                    : ""
                }
              </a>`
              )
              .join("")}
          </div>`
          )
          .join("")}
      </nav>

      <div class="sidebar__footer">
        <span>SVMS v1.0</span>
        <span id="netStatus">${navigator.onLine ? "ONLINE" : "OFFLINE"}</span>
      </div>`;
  }

  function renderTopbar() {
    const bar = U.$("#topbar");
    if (!bar) return;
    const s = AC.storage.getSettings();
    const alerts = AC.notifications.generate(AC.environment.current());
    const actionable = AC.notifications.actionableCount(alerts);

    bar.innerHTML = `
      <div class="topbar__search">
        ${I.get("search", { size: 16 })}
        <input id="globalSearch" type="search" placeholder="Search vehicles, services, expenses…"
               aria-label="Global search" />
        <span class="topbar__kbd"><kbd>Ctrl</kbd> <kbd>K</kbd></span>
      </div>

      <div class="topbar__spacer"></div>

      <div class="topbar__actions">
        <button class="icon-btn" data-action="palette:open" aria-label="Open command palette">
          ${I.get("layers", { size: 18 })}
        </button>
        <button class="icon-btn" data-action="alerts:open" aria-label="Notifications">
          ${I.get("bell", { size: 18 })}
          ${actionable ? '<span class="icon-btn__dot"></span>' : ""}
        </button>
        <button class="user-chip" data-action="nav:settings" aria-label="Open settings">
          <span class="avatar">${U.esc(U.initials(s.userName))}</span>
          <span class="user-chip__meta">
            <span class="user-chip__name">${U.esc(s.userName)}</span>
            <span class="user-chip__role">${U.esc(s.userRole)}</span>
          </span>
        </button>
      </div>`;
  }

  function renderMobileNav() {
    const nav = U.$("#mobileNav");
    const top = U.$("#mobileTopbar");
    if (!nav || !top) return;
    const s = AC.storage.getSettings();

    top.innerHTML = `
      <button class="icon-btn" data-action="drawer:toggle" aria-label="Open navigation" aria-expanded="false">
        ${I.get("menu", { size: 20 })}
      </button>
      <span class="mobile-topbar__brand">${I.logo(24)} AutoCare</span>
      <span class="mobile-topbar__spacer"></span>
      <button class="icon-btn" data-action="palette:open" aria-label="Search">${I.get("search", { size: 18 })}</button>
      <button class="user-chip" data-action="nav:settings" aria-label="Settings">
        <span class="avatar" style="width:30px;height:30px;font-size:.9rem">${U.esc(U.initials(s.userName))}</span>
      </button>`;

    const primary = ["dashboard", "vehicles", "maintenance", "wash", "analytics"];
    nav.innerHTML = primary
      .map((hash) => {
        const r = C.ROUTES.find((x) => x.hash === hash);
        return `<a class="mobile-nav__item" href="#${r.hash}" data-route="${r.hash}">
                  ${I.get(r.icon, { size: 20 })}<span>${U.esc(r.label.split(" ")[0])}</span>
                </a>`;
      })
      .join("");
  }

  /* ============================================================== actions = */

  /** Central action dispatcher — every `data-action` in the app lands here. */
  async function dispatch(action, payload = {}) {
    switch (action) {
      case "vehicle:new":
        return AC.forms.vehicleModal();
      case "vehicle:edit":
        return AC.forms.vehicleModal(payload.id);
      case "vehicle:view":
        return AC.forms.vehicleDetailModal(payload.id);
      case "vehicle:primary": {
        const v = AC.vehicles.setPrimary(payload.id);
        UI.toast(`${v ? v.name : "Vehicle"} is now the primary vehicle.`);
        return refreshAll();
      }
      case "vehicle:delete": {
        const v = AC.vehicles.get(payload.id);
        if (!v) return null;
        const ok = await UI.confirm({
          title: "Delete vehicle?",
          message: `This removes ${v.name} together with its service records, expenses, journeys and wash history. This action cannot be undone.`,
          confirmLabel: "Delete vehicle",
        });
        if (!ok) return null;
        AC.vehicles.remove(payload.id);
        UI.toast(`${v.name} deleted.`);
        return refreshAll();
      }

      case "maintenance:new":
        return AC.forms.maintenanceModal({ vehicleId: payload.vehicleId, type: payload.type });
      case "maintenance:edit":
        return AC.forms.maintenanceModal({ recordId: payload.id });
      case "maintenance:delete": {
        const ok = await UI.confirm({
          title: "Delete service record?",
          message:
            "Due dates and health scores will be recalculated without it. Any expense created from this record is removed too.",
          confirmLabel: "Delete record",
        });
        if (!ok) return null;
        AC.maintenance.deleteRecord(payload.id);
        UI.toast("Service record deleted.");
        return refreshAll();
      }

      case "expense:new":
        return AC.forms.expenseModal({ vehicleId: payload.vehicleId, category: payload.category });
      case "expense:edit":
        return AC.forms.expenseModal({ expenseId: payload.id });
      case "expense:delete": {
        const ok = await UI.confirm({
          title: "Delete expense?",
          message: "This entry will be removed from all totals and charts.",
          confirmLabel: "Delete expense",
        });
        if (!ok) return null;
        AC.expenses.remove(payload.id);
        UI.toast("Expense deleted.");
        return refreshAll();
      }

      case "journey:new":
        return AC.forms.journeyModal({ vehicleId: payload.vehicleId });
      case "journey:delete": {
        const ok = await UI.confirm({
          title: "Delete journey?",
          message:
            "Exposure and wash-score usage will be recalculated. The odometer is not rolled back automatically.",
          confirmLabel: "Delete journey",
        });
        if (!ok) return null;
        AC.journeys.remove(payload.id);
        UI.toast("Journey deleted.");
        return refreshAll();
      }

      case "wash:new":
        return AC.forms.washModal({ vehicleId: payload.vehicleId });
      case "wash:delete": {
        const ok = await UI.confirm({
          title: "Delete wash record?",
          message: "The wash score will be recalculated from the next most recent wash.",
          confirmLabel: "Delete record",
        });
        if (!ok) return null;
        AC.storage.remove("washRecords", payload.id);
        UI.toast("Wash record deleted.");
        return refreshAll();
      }

      case "env:refresh": {
        UI.toast("Refreshing environmental data…", { type: "info", duration: 1600 });
        await refreshEnvironment({ force: true });
        AC.router.refresh();
        return null;
      }

      case "alerts:open":
        return alertsModal();
      case "palette:open":
        return openPalette();
      case "drawer:toggle":
        return toggleDrawer();

      default:
        if (action.startsWith("nav:")) return AC.router.navigate(action.slice(4));
        console.warn("[AutoCare] Unhandled action:", action);
        return null;
    }
  }

  function bindGlobalClicks() {
    document.addEventListener("click", (e) => {
      const trigger = e.target.closest("[data-action]");
      if (!trigger) return;
      e.preventDefault();
      dispatch(trigger.dataset.action, {
        id: trigger.dataset.id,
        vehicleId: trigger.dataset.vehicleId,
        type: trigger.dataset.type,
        category: trigger.dataset.category,
      });
    });

    // Close the mobile drawer whenever a nav link is used.
    document.addEventListener("click", (e) => {
      if (e.target.closest("[data-route]")) closeDrawer();
    });
  }

  /* ============================================================== alerts == */

  function alertsModal() {
    const alerts = AC.notifications.generate(AC.environment.current());
    UI.openModal({
      title: "Alerts",
      subtitle: `${alerts.length} generated from your current data`,
      body: `<div class="alert-list">${alerts.map(UI.alertRow).join("")}</div>`,
      footer: `<button class="btn btn--ghost" data-close-modal>Close</button>`,
      onMount(modal) {
        modal.querySelectorAll("[data-alert-action]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const alert = alerts.find((a) => a.id === btn.dataset.alertAction);
            UI.closeModal(true);
            if (!alert || !alert.action) return;
            if (alert.action.hash) AC.router.navigate(alert.action.hash);
            else if (alert.action.event) dispatch(alert.action.event, alert.action.payload || {});
          });
        });
      },
    });
  }

  /* ============================================================= drawer === */

  const drawerOpen = () => U.$("#sidebar").classList.contains("is-open");

  function toggleDrawer() {
    drawerOpen() ? closeDrawer() : openDrawer();
  }

  function openDrawer() {
    U.$("#sidebar").classList.add("is-open");
    U.$("#drawerBackdrop").classList.add("is-open");
    const btn = U.$('[data-action="drawer:toggle"]');
    if (btn) btn.setAttribute("aria-expanded", "true");
  }

  function closeDrawer() {
    U.$("#sidebar").classList.remove("is-open");
    U.$("#drawerBackdrop").classList.remove("is-open");
    const btn = U.$('[data-action="drawer:toggle"]');
    if (btn) btn.setAttribute("aria-expanded", "false");
  }

  /* ==================================================== command palette === */

  function paletteCommands() {
    const cmds = [
      { label: "Go to Dashboard", hint: "#dashboard", icon: "gauge", run: () => AC.router.navigate("dashboard") },
      { label: "Go to Vehicles", hint: "#vehicles", icon: "car", run: () => AC.router.navigate("vehicles") },
      { label: "Go to Maintenance", hint: "#maintenance", icon: "wrench", run: () => AC.router.navigate("maintenance") },
      { label: "Go to Wash Advisor", hint: "#wash", icon: "droplet", run: () => AC.router.navigate("wash") },
      { label: "Go to Analytics", hint: "#analytics", icon: "chart", run: () => AC.router.navigate("analytics") },
      { label: "Go to Expenses", hint: "#expenses", icon: "rupee", run: () => AC.router.navigate("expenses") },
      { label: "Go to Settings", hint: "#settings", icon: "settings", run: () => AC.router.navigate("settings") },
      { label: "Add vehicle", hint: "Create", icon: "plus", run: () => dispatch("vehicle:new") },
      { label: "Log maintenance", hint: "Create", icon: "wrench", run: () => dispatch("maintenance:new") },
      { label: "Record expense", hint: "Create", icon: "rupee", run: () => dispatch("expense:new") },
      { label: "Record wash", hint: "Create", icon: "droplet", run: () => dispatch("wash:new") },
      { label: "Log journey", hint: "Create", icon: "route", run: () => dispatch("journey:new") },
      { label: "Refresh environmental data", hint: "System", icon: "refresh", run: () => dispatch("env:refresh") },
      { label: "Export data as JSON", hint: "System", icon: "download", run: () => {
          U.downloadFile(`autocare-pro-backup-${U.isoDate(U.today())}.json`, AC.storage.exportDB());
          UI.toast("Data exported successfully.");
        } },
      { label: "View alerts", hint: "System", icon: "bell", run: () => dispatch("alerts:open") },
    ];

    // Vehicles become searchable entries of their own.
    AC.vehicles.all().forEach((v) =>
      cmds.push({
        label: `Open ${v.name}`,
        hint: v.registration || "Vehicle",
        icon: "car",
        run: () => dispatch("vehicle:view", { id: v.id }),
      })
    );

    return cmds;
  }

  function openPalette(prefill = "") {
    const palette = U.$("#palette");
    palette.hidden = false;
    palette.innerHTML = `
      <div class="modal__backdrop" data-close-palette></div>
      <div class="palette__panel" role="dialog" aria-modal="true" aria-label="Command palette">
        <input class="palette__input" id="paletteInput" type="text" placeholder="Type a command or search…"
               value="${U.esc(prefill)}" autocomplete="off" />
        <div class="palette__list" id="paletteList"></div>
      </div>`;

    palette.querySelector("[data-close-palette]").addEventListener("click", closePalette);
    const input = U.$("#paletteInput");
    input.addEventListener("input", () => filterPalette(input.value));
    input.addEventListener("keydown", paletteKeys);
    filterPalette(prefill);
    input.focus();
    input.select();
  }

  function filterPalette(query) {
    const q = String(query || "").toLowerCase().trim();
    paletteItems = paletteCommands().filter(
      (c) => !q || c.label.toLowerCase().includes(q) || c.hint.toLowerCase().includes(q)
    );
    paletteIndex = 0;
    paintPalette();
  }

  function paintPalette() {
    const list = U.$("#paletteList");
    if (!list) return;
    if (!paletteItems.length) {
      list.innerHTML = `<div class="palette__empty">No matching commands.</div>`;
      return;
    }
    list.innerHTML = paletteItems
      .map(
        (c, i) => `
        <button class="palette__item${i === paletteIndex ? " is-active" : ""}" data-index="${i}">
          ${I.get(c.icon, { size: 16 })}<span>${U.esc(c.label)}</span><small>${U.esc(c.hint)}</small>
        </button>`
      )
      .join("");
    list.querySelectorAll("[data-index]").forEach((btn) =>
      btn.addEventListener("click", () => runPalette(Number(btn.dataset.index)))
    );
  }

  function paletteKeys(e) {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      paletteIndex = Math.min(paletteIndex + 1, paletteItems.length - 1);
      paintPalette();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      paletteIndex = Math.max(paletteIndex - 1, 0);
      paintPalette();
    } else if (e.key === "Enter") {
      e.preventDefault();
      runPalette(paletteIndex);
    }
  }

  function runPalette(index) {
    const cmd = paletteItems[index];
    closePalette();
    if (cmd) cmd.run();
  }

  function closePalette() {
    const palette = U.$("#palette");
    if (!palette) return;
    palette.hidden = true;
    palette.innerHTML = "";
  }

  const paletteOpen = () => !U.$("#palette").hidden;

  /* ========================================================== shortcuts === */

  function bindKeyboard() {
    document.addEventListener("keydown", (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        paletteOpen() ? closePalette() : openPalette();
        return;
      }

      if (e.key === "Escape") {
        if (paletteOpen()) return closePalette();
        if (UI.isModalOpen()) return UI.closeModal();
        if (drawerOpen()) return closeDrawer();
        return;
      }

      if (typing || e.ctrlKey || e.metaKey || e.altKey) return;

      // Single-key navigation shortcuts (press "g" then a letter is overkill
      // for this app — direct digits map to the seven routes).
      const digit = Number(e.key);
      if (digit >= 1 && digit <= C.ROUTES.length) {
        AC.router.navigate(C.ROUTES[digit - 1].hash);
        return;
      }
      if (e.key.toLowerCase() === "n") dispatch("vehicle:new");
      if (e.key === "?") shortcutsModal();
    });
  }

  function shortcutsModal() {
    const rows = [
      ["Ctrl / ⌘ + K", "Open the command palette"],
      ["1 – 7", "Jump to a section"],
      ["N", "Add a vehicle"],
      ["Esc", "Close dialog, palette or drawer"],
      ["?", "Show this help"],
    ];
    UI.openModal({
      title: "Keyboard shortcuts",
      size: "sm",
      body: rows
        .map(
          ([k, v]) =>
            `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border-soft)">
               <span class="text-muted">${U.esc(v)}</span><kbd>${U.esc(k)}</kbd></div>`
        )
        .join(""),
      footer: `<button class="btn btn--ghost" data-close-modal>Close</button>`,
    });
  }

  /* ============================================================= search === */

  function bindSearch() {
    document.addEventListener("focusin", (e) => {
      if (e.target.id === "globalSearch") {
        e.target.blur();
        openPalette();
      }
    });
  }

  /* ======================================================== environment === */

  async function refreshEnvironment(opts = {}) {
    try {
      await AC.environment.load(opts);
    } catch (err) {
      console.warn("[AutoCare] Environment refresh failed", err);
    }
  }

  /* ============================================================ refresh === */

  /** Re-render chrome + current page after any data mutation. */
  function refreshAll() {
    renderSidebar();
    renderTopbar();
    renderMobileNav();
    AC.router.refresh();
  }

  /* ================================================================ boot == */

  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    // The single-file build has no separate service-worker.js to register.
    if (window.AC && window.AC.STANDALONE) {
      console.info("[AutoCare] Single-file build — service worker not applicable.");
      return;
    }
    if (window.location.protocol === "file:") {
      console.info("[AutoCare] Service worker skipped — open the app over http:// to enable offline mode.");
      return;
    }
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("service-worker.js")
        .then((reg) => console.info("[AutoCare] Service worker registered", reg.scope))
        .catch((err) => console.warn("[AutoCare] Service worker registration failed", err));
    });
  }

  function bindNetworkStatus() {
    const paint = () => {
      const online = navigator.onLine;
      const net = U.$("#netStatus");
      const sys = U.$("#systemStatus");
      if (net) net.textContent = online ? "ONLINE" : "OFFLINE";
      if (sys) sys.textContent = online ? "System online" : "Offline mode";
    };
    window.addEventListener("online", () => {
      paint();
      UI.toast("Back online.", { type: "success", duration: 2200 });
    });
    window.addEventListener("offline", () => {
      paint();
      UI.toast("You are offline. AutoCare Pro keeps working from local data.", {
        type: "warning",
        duration: 4200,
      });
    });
    paint();
  }

  function hideSplash() {
    const splash = U.$("#splash");
    const shell = U.$("#appShell");
    if (shell) shell.classList.add("is-ready");
    if (!splash) return;
    splash.classList.add("is-hidden");
    setTimeout(() => splash.remove(), 500);
  }

  async function init() {
    const started = performance.now();

    // 1. Database — create + seed on very first run only.
    const db = AC.storage.loadDB();
    if (!db.vehicles.length && !db.settings.seededDemoData) {
      AC.seed.apply(db);
      AC.storage.saveDB(db);
    }

    if (!AC.storage.isAvailable()) {
      UI.toast(
        "Browser storage is unavailable, so changes will not persist after you close this tab.",
        { type: "warning", title: "Storage disabled", duration: 6000 }
      );
    }

    if (db.settings.reduceMotion) document.documentElement.classList.add("reduce-motion");

    // 2. Register pages and start routing.
    Object.keys(AC.pages).forEach((name) => AC.router.register(name, AC.pages[name]));

    renderChrome();
    bindGlobalClicks();
    bindKeyboard();
    bindSearch();
    bindNetworkStatus();
    U.$("#drawerBackdrop").addEventListener("click", closeDrawer);

    AC.router.start();
    AC.router.onChange(closeDrawer);

    // 3. Environment is fetched after first paint so nothing blocks on it.
    refreshEnvironment().then(() => {
      renderSidebar();
      renderTopbar();
      AC.router.refresh();
    });

    // 4. Splash: minimum 1.4s so the animation reads, never longer than needed.
    const elapsed = performance.now() - started;
    setTimeout(hideSplash, Math.max(0, 1400 - elapsed));

    registerServiceWorker();
  }

  return {
    init,
    dispatch,
    refreshAll,
    refreshEnvironment,
    renderChrome,
    renderSidebar,
    renderTopbar,
    openPalette,
    closePalette,
    toggleDrawer,
  };
})();

document.addEventListener("DOMContentLoaded", () => {
  try {
    AC.app.init();
  } catch (err) {
    console.error("[AutoCare] Startup failed", err);
    const splash = document.getElementById("splash");
    if (splash) splash.remove();
    const view = document.getElementById("view");
    if (view) {
      view.innerHTML =
        '<div class="empty"><h3 class="empty__title">AutoCare Pro could not start</h3>' +
        '<p class="empty__text">Reload the page. If the problem persists, clear this site\'s storage and try again.</p></div>';
    }
  }
});

  </script>
</body>
</html>
