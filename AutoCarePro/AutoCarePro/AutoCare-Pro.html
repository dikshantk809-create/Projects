/* ===== css/variables.css ===== */
/* ==========================================================================
   AutoCare Pro — Design Tokens
   Single source of truth for colour, type, spacing, elevation and motion.
   Every other stylesheet consumes these variables; no raw hex values should
   appear outside this file (except inside gradients that mix tokens).
   ========================================================================== */

:root {
  /* ---------- Surfaces ---------- */
  --bg-primary: #070809;
  --bg-secondary: #0d0f12;
  --surface: #111419;
  --surface-elevated: #171a1f;
  --surface-hover: #1d2127;
  --surface-sunken: #0a0c0e;

  /* ---------- Lines ---------- */
  --border: #282d35;
  --border-soft: #1c2027;
  --border-strong: #39404b;

  /* ---------- Brand accent ---------- */
  --accent-red: #e10600;
  --accent-red-bright: #ff2b24;
  --accent-red-dim: rgba(225, 6, 0, 0.14);
  --accent-red-glow: rgba(225, 6, 0, 0.38);

  /* ---------- Status ---------- */
  --success: #39ff88;
  --success-dim: rgba(57, 255, 136, 0.12);
  --warning: #ff9d2e;
  --warning-dim: rgba(255, 157, 46, 0.12);
  --critical: #ff453a;
  --critical-dim: rgba(255, 69, 58, 0.12);
  --info: #4aa8ff;
  --info-dim: rgba(74, 168, 255, 0.12);

  /* ---------- Text ---------- */
  --text-primary: #f4f6f8;
  --text-secondary: #a1a8b2;
  --text-muted: #626b76;
  --text-inverse: #070809;

  /* ---------- Data-visualisation palette ----------
     Sequenced for maximum separation on a near-black ground. */
  --viz-1: #e10600;
  --viz-2: #4aa8ff;
  --viz-3: #39ff88;
  --viz-4: #ff9d2e;
  --viz-5: #a06bff;
  --viz-6: #22d3ee;
  --viz-7: #f5d90a;
  --viz-8: #7d8794;

  /* ---------- Typography ---------- */
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --font-display: "Barlow Condensed", "Oswald", "Inter", "Arial Narrow", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, "Cascadia Mono", Menlo,
    Consolas, monospace;

  --fs-3xs: 0.625rem;   /* 10px — micro telemetry labels */
  --fs-2xs: 0.6875rem;  /* 11px — uppercase eyebrow labels */
  --fs-xs: 0.75rem;     /* 12px */
  --fs-sm: 0.8125rem;   /* 13px */
  --fs-base: 0.875rem;  /* 14px — body default */
  --fs-md: 1rem;        /* 16px */
  --fs-lg: 1.125rem;    /* 18px */
  --fs-xl: 1.375rem;    /* 22px */
  --fs-2xl: 1.75rem;    /* 28px */
  --fs-3xl: 2.25rem;    /* 36px */
  --fs-4xl: 3rem;       /* 48px */
  --fs-5xl: 4rem;       /* 64px — hero instrumentation readouts */

  --track-wide: 0.14em;
  --track-wider: 0.22em;

  /* ---------- Spacing scale (4px base) ---------- */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.25rem;
  --sp-6: 1.5rem;
  --sp-8: 2rem;
  --sp-10: 2.5rem;
  --sp-12: 3rem;
  --sp-16: 4rem;

  /* ---------- Radii ---------- */
  --r-xs: 3px;
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-pill: 999px;

  /* ---------- Elevation ---------- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.6);
  --shadow-red: 0 0 0 1px rgba(225, 6, 0, 0.35), 0 8px 28px rgba(225, 6, 0, 0.2);

  /* ---------- Layout ---------- */
  --sidebar-w: 252px;
  --topbar-h: 64px;
  --content-max: 1560px;

  /* ---------- Motion ---------- */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --dur-fast: 120ms;
  --dur-base: 220ms;
  --dur-slow: 420ms;
  --dur-page: 320ms;

  /* ---------- Z-index ladder ---------- */
  --z-base: 1;
  --z-sticky: 40;
  --z-drawer: 60;
  --z-modal: 80;
  --z-toast: 90;
  --z-splash: 100;
}

/* Users who ask for less motion get a near-instant interface. */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 1ms;
    --dur-base: 1ms;
    --dur-slow: 1ms;
    --dur-page: 1ms;
  }
}

/* ===== css/reset.css ===== */
/* ==========================================================================
   AutoCare Pro — Reset / Normalise
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

body,
h1,
h2,
h3,
h4,
h5,
h6,
p,
figure,
blockquote,
dl,
dd,
ul,
ol {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

img,
picture,
svg,
canvas {
  display: block;
  max-width: 100%;
}

input,
button,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  background: none;
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

table {
  border-collapse: collapse;
  width: 100%;
}

:focus-visible {
  outline: 2px solid var(--accent-red-bright);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

/* Remove the default focus ring only where we replace it ourselves. */
:focus:not(:focus-visible) {
  outline: none;
}

::selection {
  background: var(--accent-red);
  color: #fff;
}

/* Scrollbars — thin, dark, unobtrusive. */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}

*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

*::-webkit-scrollbar-thumb {
  background: var(--border);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: var(--r-pill);
}

*::-webkit-scrollbar-thumb:hover {
  background: var(--border-strong);
  background-clip: content-box;
}

/* Screen-reader-only utility. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  top: -100px;
  left: var(--sp-4);
  z-index: var(--z-toast);
  padding: var(--sp-3) var(--sp-5);
  background: var(--accent-red);
  color: #fff;
  border-radius: var(--r-md);
  font-weight: 600;
  transition: top var(--dur-base) var(--ease-out);
}

.skip-link:focus {
  top: var(--sp-4);
}

/* ===== css/animations.css ===== */
/* ==========================================================================
   AutoCare Pro — Motion system
   Only transform/opacity are animated so every effect stays on the GPU.
   ========================================================================== */

@keyframes fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes page-in {
  from { opacity: 0; transform: translate3d(0, 10px, 0); }
  to   { opacity: 1; transform: none; }
}

@keyframes rise-in {
  from { opacity: 0; transform: translate3d(0, 14px, 0); }
  to   { opacity: 1; transform: none; }
}

@keyframes modal-in {
  from { opacity: 0; transform: translate3d(0, 16px, 0) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

@keyframes modal-out {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translate3d(0, 8px, 0) scale(0.985); }
}

@keyframes toast-in {
  from { opacity: 0; transform: translate3d(0, 18px, 0) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

@keyframes toast-out {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translate3d(24px, 0, 0); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes shimmer {
  100% { transform: translateX(100%); }
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.35; transform: scale(0.8); }
}

@keyframes nav-bar-grow {
  from { height: 0; }
  to   { height: 20px; }
}

@keyframes sweep-x {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(320%); }
}

@keyframes grid-drift {
  0%   { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(34px, 34px, 0); }
}

/* Staggered entrance helper: add .stagger to a grid, children fade up in turn */
.stagger > * {
  animation: rise-in var(--dur-slow) var(--ease-out) both;
}
.stagger > *:nth-child(1) { animation-delay: 0ms; }
.stagger > *:nth-child(2) { animation-delay: 45ms; }
.stagger > *:nth-child(3) { animation-delay: 90ms; }
.stagger > *:nth-child(4) { animation-delay: 135ms; }
.stagger > *:nth-child(5) { animation-delay: 180ms; }
.stagger > *:nth-child(6) { animation-delay: 225ms; }
.stagger > *:nth-child(7) { animation-delay: 270ms; }
.stagger > *:nth-child(8) { animation-delay: 315ms; }

/* ============================== Splash screen ============================= */

.splash {
  position: fixed;
  inset: 0;
  z-index: var(--z-splash);
  display: grid;
  place-items: center;
  background: var(--bg-primary);
  overflow: hidden;
  transition: opacity 420ms var(--ease-out), visibility 420ms;
}

.splash.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.splash__grid {
  position: absolute;
  inset: -40px;
  background-image: linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(circle at 50% 50%, #000 10%, transparent 72%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 10%, transparent 72%);
  opacity: 0;
  animation: fade-in 500ms var(--ease-out) 60ms forwards,
    grid-drift 9s linear infinite;
}

.splash__glow {
  position: absolute;
  width: 620px;
  height: 620px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(225, 6, 0, 0.16), transparent 65%);
  filter: blur(20px);
  opacity: 0;
  animation: fade-in 900ms var(--ease-out) 180ms forwards;
}

.splash__inner {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-5);
  text-align: center;
  padding: var(--sp-6);
}

.splash__logo {
  opacity: 0;
  transform: translateY(12px);
  animation: rise-in 620ms var(--ease-out) 220ms forwards;
}

.splash__logo svg {
  width: 72px;
  height: 72px;
}

.splash__wordmark {
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 9vw, 4rem);
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 0.95;
  text-transform: uppercase;
  opacity: 0;
  animation: rise-in 620ms var(--ease-out) 340ms forwards;
}

.splash__wordmark span {
  display: block;
  font-size: 0.42em;
  color: var(--accent-red-bright);
  letter-spacing: 0.28em;
  margin-top: 6px;
}

.splash__line {
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-red-bright), transparent);
  animation: splash-line 700ms var(--ease-out) 440ms forwards;
}

@keyframes splash-line {
  to { width: 260px; }
}

.splash__title {
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  letter-spacing: var(--track-wider);
  text-transform: uppercase;
  color: var(--text-secondary);
  opacity: 0;
  animation: fade-in 500ms var(--ease-out) 620ms forwards;
}

.splash__loader {
  position: relative;
  width: 220px;
  height: 2px;
  border-radius: var(--r-pill);
  background: var(--surface-elevated);
  overflow: hidden;
  opacity: 0;
  animation: fade-in 400ms var(--ease-out) 720ms forwards;
}

.splash__loader::after {
  content: "";
  position: absolute;
  inset: 0;
  width: 34%;
  border-radius: inherit;
  background: var(--accent-red-bright);
  box-shadow: 0 0 12px var(--accent-red-glow);
  animation: sweep-x 1.1s var(--ease-in-out) infinite;
}

.splash__status {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0;
  animation: fade-in 400ms var(--ease-out) 820ms forwards;
}

.splash__status .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px rgba(57, 255, 136, 0.7);
  animation: pulse-dot 1.6s var(--ease-in-out) infinite;
}

/* Reduced motion: show the splash statically and get out of the way fast. */
@media (prefers-reduced-motion: reduce) {
  .splash__grid,
  .splash__glow,
  .splash__logo,
  .splash__wordmark,

  font-size: var(--fs-3xs);
  color: var(--text-muted);
  line-height: 1.4;
}

/* --------------------------- Progress bars ------------------------------- */

.bar {
  --bar-color: var(--accent-red-bright);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.bar__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  font-size: var(--fs-xs);
}

.bar__label {
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  color: var(--text-secondary);
}

.bar__value {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--bar-color);
}

.bar__track {
  position: relative;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--surface-sunken);
  border: 1px solid var(--border-soft);
  overflow: hidden;
}

.bar__fill {
  height: 100%;
  width: 0;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--bar-color), color-mix(in srgb, var(--bar-color) 55%, #fff));
  box-shadow: 0 0 12px -2px var(--bar-color);
  transition: width 900ms var(--ease-out);
}

.bar--success {
  --bar-color: var(--success);
}
.bar--warning {
  --bar-color: var(--warning);
}
.bar--critical {
  --bar-color: var(--critical);
}
.bar--info {
  --bar-color: var(--info);
}

/* ------------------------------ Forms ------------------------------------ */

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--sp-4);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field--full {
  grid-column: 1 / -1;
}

.field > label {
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  color: var(--text-secondary);
}

.field .req {
  color: var(--accent-red-bright);
}

.input,
.select,
.textarea {
  width: 100%;
  min-height: 42px;
  padding: var(--sp-2) var(--sp-3);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text-primary);
  font-size: var(--fs-base);
  transition: border-color var(--dur-fast), background var(--dur-fast),
    box-shadow var(--dur-fast);
}

.textarea {
  min-height: 92px;
  resize: vertical;
  line-height: 1.55;
}

.select {
  appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23626b76' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: var(--sp-8);
}

.input:hover,
.select:hover,
.textarea:hover {
  border-color: var(--border-strong);
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--accent-red);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-red-dim);
}

.input[aria-invalid="true"],
.select[aria-invalid="true"],
.textarea[aria-invalid="true"] {
  border-color: var(--critical);
  box-shadow: 0 0 0 3px var(--critical-dim);
}

.field__error {
  min-height: 15px;
  font-size: var(--fs-3xs);
  color: var(--critical);
  letter-spacing: 0.02em;
}

.field__hint {
  font-size: var(--fs-3xs);
  color: var(--text-muted);
}

.input-group {
  display: flex;
  gap: var(--sp-2);
}

/* Toggle switch */
.switch {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  cursor: pointer;
}

.switch input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.switch__track {
  position: relative;
  flex: none;
  width: 42px;
  height: 24px;
  border-radius: var(--r-pill);
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  transition: background var(--dur-base), border-color var(--dur-base);
}

.switch__track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: transform var(--dur-base) var(--ease-spring), background var(--dur-base);
}

.switch input:checked + .switch__track {
  background: var(--accent-red-dim);
  border-color: var(--accent-red);
}

.switch input:checked + .switch__track::after {
  transform: translateX(18px);
  background: var(--accent-red-bright);
}

.switch input:focus-visible + .switch__track {
  outline: 2px solid var(--accent-red-bright);
  outline-offset: 2px;
}

/* Segmented control */
.segmented {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
}

.segmented button {
  padding: 6px 14px;
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  transition: background var(--dur-fast), color var(--dur-fast);
}

.segmented button:hover {
  color: var(--text-primary);
}

.segmented button.is-active {
  background: var(--surface-hover);
  color: var(--text-primary);
  box-shadow: inset 0 0 0 1px var(--border);
}

/* ------------------------------ Tables ----------------------------------- */

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  background: var(--surface);
}

.table {
  min-width: 620px;
  font-size: var(--fs-sm);
}

.table thead th {
  position: sticky;
  top: 0;
  padding: var(--sp-3) var(--sp-4);
  text-align: left;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  font-weight: 600;
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.table tbody td {
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}

.table tbody tr:last-child td {
  border-bottom: 0;
}

.table tbody tr {
  transition: background var(--dur-fast);
}

.table tbody tr:hover {
  background: var(--surface-elevated);
}

.table .num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.table .actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}

/* ------------------------------ Modal ------------------------------------ */

.modal-root {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: grid;
  place-items: center;
  padding: var(--sp-4);
  overflow-y: auto;
}

.modal-root[hidden] {
  display: none;
}

.modal__backdrop {
  position: fixed;
  inset: 0;
  background: rgba(3, 4, 5, 0.72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: fade-in var(--dur-base) var(--ease-out) both;
}

.modal {
  position: relative;
  width: min(720px, 100%);
  max-height: calc(100dvh - var(--sp-8));
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  animation: modal-in var(--dur-base) var(--ease-out) both;
}

.modal--sm {
  width: min(460px, 100%);
}

.modal--lg {
  width: min(920px, 100%);
}

.modal.is-closing {
  animation: modal-out var(--dur-fast) var(--ease-in-out) both;
}

.modal__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-6);
  border-bottom: 1px solid var(--border-soft);
}

.modal__title {
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.modal__sub {
  margin-top: 4px;
  font-size: var(--fs-xs);
  color: var(--text-muted);
}

.modal__body {
  padding: var(--sp-6);
  overflow-y: auto;
}

.modal__foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-6);
  border-top: 1px solid var(--border-soft);
  background: var(--bg-secondary);
  border-radius: 0 0 var(--r-xl) var(--r-xl);
}

/* ------------------------------ Toasts ----------------------------------- */

.toast-stack {
  position: fixed;
  right: var(--sp-5);
  bottom: var(--sp-5);
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  width: min(360px, calc(100vw - var(--sp-8)));
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-red);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  pointer-events: auto;
  animation: toast-in var(--dur-base) var(--ease-spring) both;
}

.toast.is-out {
  animation: toast-out var(--dur-fast) var(--ease-in-out) both;
}

.toast--success {
  border-left-color: var(--success);
}
.toast--warning {
  border-left-color: var(--warning);
}
.toast--error {
  border-left-color: var(--critical);
}
.toast--info {
  border-left-color: var(--info);
}

.toast__icon {
  flex: none;
  width: 18px;
  height: 18px;
  margin-top: 1px;
}

.toast--success .toast__icon {
  color: var(--success);
}
.toast--warning .toast__icon {
  color: var(--warning);
}
.toast--error .toast__icon {
  color: var(--critical);
}
.toast--info .toast__icon {
  color: var(--info);
}

.toast__body {
  flex: 1;
  min-width: 0;
}

.toast__title {
  font-size: var(--fs-sm);
  font-weight: 600;
}

.toast__msg {
  font-size: var(--fs-xs);
  color: var(--text-secondary);
  margin-top: 2px;
}

/* --------------------------- Empty & error ------------------------------- */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--sp-3);
  padding: var(--sp-12) var(--sp-6);
  border: 1px dashed var(--border);
  border-radius: var(--r-lg);
  background: var(--bg-secondary);
}

.empty__icon {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--border-soft);
  color: var(--text-muted);
}

.empty__icon svg {
  width: 24px;
  height: 24px;
}

.empty__title {

  font-size: var(--fs-lg);
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.empty__text {
  max-width: 46ch;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
}

.banner {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-elevated);
  font-size: var(--fs-sm);
  color: var(--text-secondary);
}

.banner svg {
  flex: none;
  width: 17px;
  height: 17px;
  margin-top: 1px;
}

.banner--warning {
  border-color: rgba(255, 157, 46, 0.32);
  background: var(--warning-dim);
  color: var(--warning);
}

.banner--info {
  border-color: rgba(74, 168, 255, 0.28);
  background: var(--info-dim);
  color: var(--info);
}

.banner--critical {
  border-color: rgba(255, 69, 58, 0.32);
  background: var(--critical-dim);
  color: var(--critical);
}

/* --------------------------- Skeleton loaders ---------------------------- */

.skeleton {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: var(--surface-elevated);
}

.skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.05),
    transparent
  );
  animation: shimmer 1.3s infinite;
}

.skeleton--text {
  height: 12px;
  margin-bottom: 8px;
}
.skeleton--title {
  height: 26px;
  width: 46%;
  margin-bottom: 14px;
}
.skeleton--card {
  height: 120px;
}

}

  color: var(--critical);
}
.text-muted {
  color: var(--text-muted);
}
.text-accent {
  color: var(--accent-red-bright);
}

.flex {
  display: flex;
}
.flex-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
}
.flex-wrap {
  flex-wrap: wrap;
}
.gap-2 {
  gap: var(--sp-2);
}
.gap-3 {
  gap: var(--sp-3);
}
.gap-4 {
  gap: var(--sp-4);
}
.mt-4 {

}
.mt-6 {
  margin-top: var(--sp-6);
}

.chart-box {

  width: 100%;
  height: 260px;
}

.chart-box--tall {
  height: 320px;
}

}

/* Command palette */
.palette {

  inset: 0;
  z-index: var(--z-modal);

  align-items: start;
  justify-items: center;
  padding: 12vh var(--sp-4) var(--sp-4);
}

.palette[hidden] {
  display: none;
}

.palette__panel {

}

.palette__empty {

  color: var(--text-muted);
  font-size: var(--fs-sm);
}

/* ==========================================================================
   AutoCare Pro — Dashboard
   ========================================================================== */

.greeting {
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  letter-spacing: var(--track-wider);
  text-transform: uppercase;
  color: var(--accent-red-bright);
}

.metric-card {
  position: relative;
  padding: var(--sp-5);
  min-height: 132px;
}

.metric-card::after {
  /* hairline accent that lights up on hover */
  content: "";
  position: absolute;
  left: var(--sp-5);
  right: var(--sp-5);
  bottom: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-red), transparent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--dur-slow) var(--ease-out);
}

.metric-card:hover::after {
  transform: scaleX(1);
}

/* ------------------------- Primary vehicle hero -------------------------- */

.hero-vehicle {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
  padding: var(--sp-6);
  min-height: 340px;
  background:
    radial-gradient(700px 320px at 88% 8%, rgba(225, 6, 0, 0.16), transparent 68%),
    linear-gradient(150deg, var(--surface-elevated), var(--surface) 55%);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
}

.hero-vehicle__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  position: relative;
  z-index: 1;
}

.hero-vehicle__name {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4.4vw, var(--fs-4xl));
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1;
  margin-top: var(--sp-2);
}

.hero-vehicle__spec {
  margin-top: var(--sp-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.1em;
  color: var(--text-secondary);
  text-transform: uppercase;
}

.hero-vehicle__art {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  padding: var(--sp-2) 0;
}

.hero-vehicle__art svg {
  width: min(100%, 460px);
  height: auto;
  filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.55));
}

.hero-vehicle__foot {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-4);
}

/* --------------------------- Vehicle health ------------------------------ */

.health-card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
  padding: var(--sp-6);
}

.health-hero {
  display: flex;
  align-items: center;
  gap: var(--sp-5);
}

.health-hero__value {
  font-family: var(--font-display);
  font-size: var(--fs-5xl);
  font-weight: 700;
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
}

.health-hero__value sup {
  font-size: 0.32em;
  vertical-align: super;
  color: var(--text-muted);
  margin-left: 2px;
}

.health-ring {
  flex: none;
}

.health-bars {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.health-note {
  font-size: var(--fs-xs);
  color: var(--text-muted);
  line-height: 1.6;
  padding-top: var(--sp-3);
  border-top: 1px dashed var(--border);
}

/* ------------------------------ Timeline --------------------------------- */

.timeline {
  position: relative;
  padding-left: var(--sp-6);
}

.timeline::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 6px;
  bottom: 6px;
  width: 1px;
  background: linear-gradient(180deg, var(--border-strong), transparent);
}

.timeline__item {
  position: relative;
  padding-bottom: var(--sp-5);
}

.timeline__item:last-child {
  padding-bottom: 0;
}

.timeline__dot {
  position: absolute;
  left: calc(-1 * var(--sp-6) + 2px);
  top: 4px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--text-muted);
}

.timeline__item--success .timeline__dot { border-color: var(--success); }
.timeline__item--warning .timeline__dot { border-color: var(--warning); }
.timeline__item--critical .timeline__dot {
  border-color: var(--critical);
  box-shadow: 0 0 10px rgba(255, 69, 58, 0.55);
}

.timeline__title {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.timeline__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-top: 4px;
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  color: var(--text-muted);
  letter-spacing: 0.06em;
}

.timeline__next {
  margin-top: var(--sp-2);
  font-size: var(--fs-xs);
  color: var(--text-secondary);
}

/* ------------------------- Environment strip ----------------------------- */

.env-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: var(--sp-3);
}

.env-cell {
  padding: var(--sp-3);
  border-radius: var(--r-md);
  background: var(--bg-secondary);
  border: 1px solid var(--border-soft);
}

.env-cell__label {
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  color: var(--text-muted);
}

.env-cell__value {
  margin-top: 4px;
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.env-cell__sub {
  font-size: var(--fs-3xs);
  color: var(--text-secondary);
}

/* --------------------------- Quick actions ------------------------------- */

.quick-actions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--sp-3);
}

.quick-action {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md);
  background: var(--bg-secondary);
  border: 1px solid var(--border-soft);
  color: var(--text-secondary);
  font-size: var(--fs-sm);
  font-weight: 500;
  text-align: left;
  transition: background var(--dur-fast), color var(--dur-fast),
    border-color var(--dur-fast), transform var(--dur-fast);
}

.quick-action:hover {
  background: var(--surface-hover);
  border-color: var(--border-strong);
  color: var(--text-primary);
  transform: translateY(-2px);
}

.quick-action svg {
  width: 17px;
  height: 17px;
  color: var(--accent-red-bright);
  flex: none;
}

/* ===== css/wash-advisor.css ===== */
/* ==========================================================================
   AutoCare Pro — Smart Wash Advisor
   ========================================================================== */

.wash-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  gap: var(--sp-4);
  align-items: start;
}

@media (max-width: 1100px) {
  .wash-layout {
    grid-template-columns: 1fr;
  }
}

/* ------------------------------- Gauge ----------------------------------- */

.gauge-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-8) var(--sp-6) var(--sp-6);
  background:
    radial-gradient(520px 320px at 50% 0%, rgba(225, 6, 0, 0.14), transparent 68%),
    var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
}

.gauge {
  position: relative;
  width: min(300px, 74vw);
  aspect-ratio: 1;
}

.gauge svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.gauge__track {
  fill: none;
  stroke: var(--surface-sunken);
  stroke-width: 14;
}

.gauge__ticks line {
  stroke: var(--border-strong);
  stroke-width: 2;
}

.gauge__value {
  fill: none;
  stroke: var(--accent-red-bright);
  stroke-width: 14;
  stroke-linecap: round;
  filter: drop-shadow(0 0 10px var(--accent-red-glow));
  transition: stroke-dashoffset 1200ms var(--ease-out), stroke 400ms linear;
}

.gauge__readout {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  text-align: center;
  pointer-events: none;
}

.gauge__num {
  font-family: var(--font-display);
  font-size: clamp(3.4rem, 14vw, 5rem);
  font-weight: 700;
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
}

.gauge__caption {
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  letter-spacing: var(--track-wider);
  text-transform: uppercase;
  color: var(--text-muted);
}

.gauge__status {
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-align: center;
}

.gauge__message {
  max-width: 40ch;
  text-align: center;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
}

.wash-status--clean   { color: var(--success); }
.wash-status--monitor { color: var(--info); }
.wash-status--soon    { color: var(--warning); }
.wash-status--now     { color: var(--critical); }

/* --------------------------- Condition strip ----------------------------- */

.condition-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--sp-3);
}

.condition {
  padding: var(--sp-4);
  border-radius: var(--r-md);
  background: var(--bg-secondary);
  border: 1px solid var(--border-soft);
  transition: border-color var(--dur-base);
}

.condition:hover {
  border-color: var(--border-strong);
}

.condition__label {
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  color: var(--text-muted);
}

.condition__value {
  margin-top: 6px;
  font-family: var(--font-display);
  font-size: var(--fs-2xl);
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.condition__value small {
  font-size: 0.4em;
  color: var(--text-muted);
  letter-spacing: var(--track-wide);
  margin-left: 4px;
}

.condition__sub {
  margin-top: 4px;
  font-size: var(--fs-3xs);
  color: var(--text-secondary);
}

/* -------------------------- Factor breakdown ----------------------------- */

.factor {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: var(--sp-3) 0;
  border-bottom: 1px dashed var(--border-soft);
}

.factor:last-child {
  border-bottom: 0;
}

.factor__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
}

.factor__name {
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  color: var(--text-secondary);
}

.factor__points {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.factor__points span {
  color: var(--text-muted);
  font-size: 0.75em;
}

.factor__note {
  font-size: var(--fs-3xs);
  color: var(--text-muted);
}

/* Segmented capacity meter — each block is one tenth of the factor's cap. */
.factor__meter {
  display: flex;
  gap: 3px;
  height: 8px;
}

.factor__seg {
  flex: 1;
  border-radius: 2px;
  background: var(--surface-sunken);
  border: 1px solid var(--border-soft);
  transform: scaleY(0.55);
  transform-origin: bottom;
  transition: transform 420ms var(--ease-out), background 420ms var(--ease-out);
}

.factor__seg.is-on {
  background: var(--accent-red-bright);
  border-color: transparent;
  box-shadow: 0 0 8px -2px var(--accent-red-glow);
  transform: scaleY(1);
}

.factor__seg.is-partial {
  background: rgba(225, 6, 0, 0.45);
  border-color: transparent;
  transform: scaleY(0.82);
}

/* ------------------------------ Journeys --------------------------------- */

.journey {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4);
  border-radius: var(--r-md);
  background: var(--bg-secondary);
  border: 1px solid var(--border-soft);
}

.journey__route {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-width: 0;
  flex: 1 1 240px;
}

.journey__place {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.journey__arrow {
  flex: none;
  width: 26px;
  height: 1px;
  background: var(--accent-red);
  position: relative;
}

.journey__arrow::after {
  content: "";
  position: absolute;
  right: -1px;
  top: -3px;
  border: 3.5px solid transparent;
  border-left-color: var(--accent-red);
}

.journey__stats {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-4);
  margin-left: auto;
}

.journey__stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 74px;
}

.journey__stat .k {
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.journey__stat .v {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* -------------------- Environmental provider status ---------------------- */

.provider-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md);
  background: var(--bg-secondary);
  border: 1px solid var(--border-soft);
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ===== css/analytics.css ===== */
/* ==========================================================================
   AutoCare Pro — Analytics
   ========================================================================== */

.chart-card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  padding: var(--sp-5);
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
}

.chart-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
}

.chart-card__title {
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.chart-card__sub {
  margin-top: 2px;
  font-size: var(--fs-xs);
  color: var(--text-muted);
}

.chart-card--wide {
  grid-column: 1 / -1;
}

/* Charts that render a legend need a little more vertical room. */
.chart-card .chart-box {
  height: 290px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-top: var(--sp-2);
}

.legend__item {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: var(--fs-xs);
  color: var(--text-secondary);
}

.legend__swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex: none;
}

.insight {
  display: flex;
  gap: var(--sp-3);
  padding: var(--sp-4);
  border-radius: var(--r-md);
  background: var(--bg-secondary);
  border: 1px solid var(--border-soft);
}

.insight__mark {
  flex: none;
  width: 3px;
  border-radius: var(--r-pill);
  background: var(--accent-red);
}

.insight__title {
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  color: var(--text-muted);
}

.insight__text {
  margin-top: 4px;
  font-size: var(--fs-sm);
  color: var(--text-primary);
  line-height: 1.55;
}

  </style>

/* ==========================================================================
   AutoCare Pro — Expenses

.expense-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--sp-3);
  margin-bottom: var(--sp-5);
}

.cat-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface-elevated);
  font-size: var(--fs-3xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-secondary);
  white-space: nowrap;
}

.cat-chip__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
}

.money {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;

.money--lg {
  font-family: var(--font-display);
  font-size: var(--fs-2xl);
  font-weight: 700;
}

.breakdown {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.breakdown__row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.breakdown__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  font-size: var(--fs-sm);
}

.breakdown__pct {
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  color: var(--text-muted);
}

/* ===== css/settings.css ===== */
/* ==========================================================================
   AutoCare Pro — Settings
   ========================================================================== */

.settings-layout {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  gap: var(--sp-6);
  align-items: start;
}

.settings-nav {
  position: sticky;
  top: calc(var(--topbar-h) + var(--sp-4));
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.settings-nav button {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  color: var(--text-secondary);
  font-size: var(--fs-sm);
  text-align: left;
  transition: background var(--dur-fast), color var(--dur-fast);
}

.settings-nav button svg {
  width: 16px;
  height: 16px;
  flex: none;
}

.settings-nav button:hover {
  background: var(--surface);
  color: var(--text-primary);
}

.settings-nav button.is-active {
  background: var(--accent-red-dim);
  color: var(--text-primary);
  box-shadow: inset 2px 0 0 var(--accent-red-bright);
}

.settings-panels {
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}

.settings-section {
  scroll-margin-top: calc(var(--topbar-h) + var(--sp-4));
}

.setting-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: var(--sp-4) 0;
  border-bottom: 1px solid var(--border-soft);
}

.setting-row:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.setting-row__info {
  flex: 1 1 260px;
  min-width: 0;
}

.setting-row__title {
  font-size: var(--fs-base);
  font-weight: 600;
}

.setting-row__desc {
  margin-top: 3px;
  font-size: var(--fs-xs);
  color: var(--text-muted);
  max-width: 60ch;
}

.setting-row__control {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  align-items: center;
}

.setting-row__control .input,
.setting-row__control .select {
  min-width: 200px;
}

.danger-zone {
  border-color: rgba(255, 69, 58, 0.3);
  background: linear-gradient(180deg, rgba(255, 69, 58, 0.05), transparent 60%),
    var(--surface);
}

.storage-meter {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.storage-meter__bar {
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--surface-sunken);
  border: 1px solid var(--border-soft);
  overflow: hidden;
}

.storage-meter__fill {
  height: 100%;
  background: linear-gradient(90deg, var(--info), #7fc7ff);
  transition: width 800ms var(--ease-out);
}

@media (max-width: 860px) {
  .settings-layout {
    grid-template-columns: 1fr;
  }
  .settings-nav {
    position: static;
    flex-direction: row;
    overflow-x: auto;
    padding-bottom: var(--sp-2);
  }
  .settings-nav button {
    white-space: nowrap;
  }
}

  </style>
  <style>
/* ===== css/responsive.css ===== */
/* ==========================================================================
   AutoCare Pro — Responsive behaviour
   Breakpoints: 1280 / 1024 / 768 / 560 / 380.
   Mobile is a distinct experience (drawer + bottom bar), not a squeezed
   desktop layout.
   ========================================================================== */

@media (max-width: 1280px) {
  :root {
    --sidebar-w: 224px;
  }
  .content {
    padding: var(--sp-6) var(--sp-5) var(--sp-16);
  }
}

/* -------------------- Tablet & below: off-canvas drawer ------------------ */

@media (max-width: 1024px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: min(292px, 84vw);
    transform: translate3d(-102%, 0, 0);
    transition: transform var(--dur-base) var(--ease-out);
    box-shadow: none;
  }

  .sidebar.is-open {
    transform: none;
    box-shadow: var(--shadow-lg);
  }

  .drawer-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    z-index: calc(var(--z-drawer) - 1);
    background: rgba(3, 4, 5, 0.66);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--dur-base), visibility var(--dur-base);
  }

  .drawer-backdrop.is-open {
    opacity: 1;
    visibility: visible;
  }

  .topbar {
    display: none;
  }

  .mobile-topbar {
    display: flex;
  }

  .mobile-topbar__brand {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .mobile-topbar__brand svg {
    width: 24px;
    height: 24px;
  }

  .mobile-topbar__spacer {
    flex: 1;
  }
}

/* ------------------------- Phones: bottom navigation --------------------- */

@media (max-width: 768px) {
  .content {
    padding: var(--sp-5) var(--sp-4) calc(72px + var(--sp-8));
  }

  .page-head h1 {
    font-size: var(--fs-2xl);
  }

  .page-head__actions {
    width: 100%;
  }

  .page-head__actions .btn {
    flex: 1;
  }

  .mobile-nav {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: var(--z-sticky);
    justify-content: space-around;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(10, 12, 14, 0.94);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-soft);
  }

  .mobile-nav__item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex: 1;
    min-height: 54px;
    padding: 8px 2px;
    border-radius: var(--r-md);
    color: var(--text-muted);
    font-size: var(--fs-3xs);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color var(--dur-fast);
  }

  .mobile-nav__item svg {
    width: 20px;
    height: 20px;
  }

  .mobile-nav__item.is-active {
    color: var(--accent-red-bright);
  }

  .mobile-nav__item.is-active::before {
    content: "";
    position: absolute;
    top: 0;
    width: 22px;
    height: 2px;
    border-radius: var(--r-pill);
    background: var(--accent-red-bright);
    box-shadow: 0 0 10px var(--accent-red-glow);
  }

  /* Cards go full-bleed-ish and single column */
  .grid--metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .grid--cards,
  .grid--2,
  .grid--3 {
    grid-template-columns: 1fr;
  }

  .hero-vehicle {
    padding: var(--sp-5);
    min-height: 0;
  }

  .health-hero {
    flex-direction: row;
    justify-content: space-between;
  }

  .modal-root {
    padding: 0;
    align-items: flex-end;
  }

  .modal,
  .modal--sm,
  .modal--lg {
    width: 100%;
    max-height: 92dvh;
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    animation: sheet-in var(--dur-base) var(--ease-out) both;
  }

  .modal__foot {
    border-radius: 0;
    padding-bottom: calc(var(--sp-4) + env(safe-area-inset-bottom, 0px));
  }

  .modal__foot .btn {
    flex: 1;
  }

  .toast-stack {
    left: var(--sp-3);
    right: var(--sp-3);
    bottom: calc(72px + var(--sp-3));
    width: auto;
  }

  .palette {
    padding: var(--sp-4);
    align-items: end;
  }

  .table {
    min-width: 560px;
  }

  .chart-box {
    height: 230px;
  }
}

@keyframes sheet-in {
  from { opacity: 0; transform: translate3d(0, 32px, 0); }
  to   { opacity: 1; transform: none; }
}

@media (max-width: 560px) {
  .content {
    padding: var(--sp-4) var(--sp-3) calc(72px + var(--sp-8));
  }

  .grid--metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--sp-3);
  }

  .metric__value {
    font-size: var(--fs-2xl);
  }

  .metric-card {
    min-height: 108px;
    padding: var(--sp-4);
  }

  .metric__icon {
    display: none;
  }

  .vehicle-card__grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .stat-row {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .health-hero__value {
    font-size: var(--fs-4xl);
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .modal__head,
  .modal__body,
  .modal__foot {
    padding-left: var(--sp-4);
    padding-right: var(--sp-4);
  }

  .journey__stats {
    width: 100%;
    margin-left: 0;
  }
}

/* Smallest supported width — 320px. Nothing may overflow horizontally. */
@media (max-width: 380px) {
  .grid--metrics {
    grid-template-columns: 1fr;
  }

  .page-head h1 {
    font-size: var(--fs-xl);
  }

  .vehicle-card__actions .btn {
    flex: 1 1 100%;
  }

  .mobile-nav__item {
    font-size: 9px;
  }

  .gauge {
    width: min(240px, 78vw);
  }
}

/* --------------------------- Print (report view) ------------------------- */

@media print {
  .sidebar,
  .topbar,
  .mobile-topbar,
  .mobile-nav,
  .toast-stack,
  .page-head__actions {
    display: none !important;
  }
  .app-shell {
    grid-template-columns: 1fr;
  }
  body {
    background: #fff;
    color: #000;
  }
  .card,
  .chart-card {
    border-color: #ccc;
    background: #fff;
  }
}

  </style>

      expenses: [],
      journeys: [],
      washRecords: [],
      environment: { cache: null, fetchedAt: null, provider: null },
      settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
    };
  }

  /* --------------------------------------------------------- raw access -- */

  let cache = null;
  const listeners = new Set();
  let storageAvailable = true;

  function read() {
    try {
      const raw = window.localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      // Private-mode Safari, disabled storage, or corrupt JSON.
      storageAvailable = false;
      console.warn("[AutoCare] localStorage unavailable — running in memory.", err);
      return null;
    }
  }

  function write(db) {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(db));
      storageAvailable = true;
      return true;
    } catch (err) {
      storageAvailable = false;
      console.warn("[AutoCare] Unable to persist database.", err);
      return false;
    }
  }

  /* ---------------------------------------------------------- migration -- */

  /**
   * Bring a document written by an older build up to the current schema.
   * Missing collections/settings are backfilled so the app never crashes on
   * data produced before a field existed.
   */
  function migrate(db) {
    const base = emptyDB();
    if (!db || typeof db !== "object") return base;

    const next = {
      ...base,
      ...db,
      meta: { ...base.meta, ...(db.meta || {}) },
      environment: { ...base.environment, ...(db.environment || {}) },
      settings: {
        ...base.settings,
        ...(db.settings || {}),
        notifications: {
          ...base.settings.notifications,
          ...((db.settings && db.settings.notifications) || {}),
        },
        manualLocation: {
          ...base.settings.manualLocation,
          ...((db.settings && db.settings.manualLocation) || {}),
        },
      },
    };

    COLLECTIONS.forEach((name) => {
      next[name] = Array.isArray(db[name]) ? db[name] : [];
    });

    next.schemaVersion = SCHEMA_VERSION;
    return next;
  }

  /* --------------------------------------------------------- public API -- */

  /** Load (and cache) the database, creating it on first run. */
  function loadDB() {
    if (cache) return cache;
    const stored = read();
    cache = stored ? migrate(stored) : emptyDB();
    if (!stored) write(cache);
    return cache;
  }

  /** Persist the in-memory database and notify subscribers. */
  function saveDB(db = cache) {
    cache = db;
    cache.meta.updatedAt = new Date().toISOString();
    write(cache);
    listeners.forEach((fn) => {
      try {
        fn(cache);
      } catch (err) {
        console.error("[AutoCare] storage listener failed", err);
      }
    });
    return cache;
  }

  /** Mutate the database inside a callback, then save exactly once. */
  function update(mutator) {
    const db = loadDB();
    mutator(db);
    return saveDB(db);
  }

  function subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  /* ------------------------------------------------------- collections -- */

  const list = (name) => (loadDB()[name] || []).slice();

  const find = (name, id) => (loadDB()[name] || []).find((r) => r.id === id) || null;

  function insert(name, record) {
    const row = { id: AC.utils.uid(name.slice(0, 3)), createdAt: new Date().toISOString(), ...record };
    update((db) => {
      db[name] = db[name] || [];
      db[name].push(row);
    });
    return row;
  }

  function patch(name, id, changes) {
    let updated = null;
    update((db) => {
      const idx = (db[name] || []).findIndex((r) => r.id === id);
      if (idx === -1) return;
      db[name][idx] = { ...db[name][idx], ...changes, updatedAt: new Date().toISOString() };
      updated = db[name][idx];
    });
    return updated;
  }

  function remove(name, id) {
    let removed = false;
    update((db) => {
      const before = (db[name] || []).length;
      db[name] = (db[name] || []).filter((r) => r.id !== id);
      removed = db[name].length !== before;
    });
    return removed;
  }

  /** Delete every record in every collection that belongs to a vehicle. */
  function removeVehicleCascade(vehicleId) {
    update((db) => {
      db.vehicles = db.vehicles.filter((v) => v.id !== vehicleId);
      db.maintenanceRecords = db.maintenanceRecords.filter((r) => r.vehicleId !== vehicleId);
      db.expenses = db.expenses.filter((r) => r.vehicleId !== vehicleId);
      db.journeys = db.journeys.filter((r) => r.vehicleId !== vehicleId);
      db.washRecords = db.washRecords.filter((r) => r.vehicleId !== vehicleId);
      // If the deleted vehicle was primary, promote the first remaining one.
      if (db.vehicles.length && !db.vehicles.some((v) => v.isPrimary)) {
        db.vehicles[0].isPrimary = true;
      }
    });
  }

  /* ---------------------------------------------------------- settings -- */

  const getSettings = () => loadDB().settings;

  function setSettings(changes) {
    update((db) => {
      db.settings = {
        ...db.settings,
        ...changes,
        notifications: { ...db.settings.notifications, ...(changes.notifications || {}) },
        manualLocation: { ...db.settings.manualLocation, ...(changes.manualLocation || {}) },
      };
    });
    return getSettings();
  }

  /* --------------------------------------------- import / export / reset -- */

  function exportDB() {
    const db = loadDB();
    return JSON.stringify(
      {
        app: "AutoCare Pro",
        exportedAt: new Date().toISOString(),
        schemaVersion: SCHEMA_VERSION,
        data: db,
      },
      null,
      2
    );
  }

  /**
   * Import a previously exported file. The payload is *never* trusted:
   * unknown keys are dropped by `migrate`, and every record is filtered to
   * plain objects with an id so a malformed file cannot corrupt the app.
   */
  function importDB(jsonText) {
    let parsed;
    try {
      parsed = JSON.parse(jsonText);
    } catch (err) {
      throw new Error("The selected file is not valid JSON.");
    }

    const payload = parsed && parsed.data ? parsed.data : parsed;
    if (!payload || typeof payload !== "object" || !Array.isArray(payload.vehicles)) {
      throw new Error("The selected file is not valid AutoCare Pro data.");
    }

    const clean = migrate(payload);
    COLLECTIONS.forEach((name) => {
      clean[name] = clean[name]
        .filter((r) => r && typeof r === "object")
        .map((r) => ({ ...r, id: r.id || AC.utils.uid(name.slice(0, 3)) }));
    });

    cache = clean;
    saveDB(cache);
    return cache;
  }

  function resetDB({ seed = true } = {}) {
    cache = emptyDB();
    if (seed && AC.seed) AC.seed.apply(cache);
    saveDB(cache);
    return cache;
  }

  /** Approximate bytes used by the database — surfaced in Settings. */
  function usageBytes() {
    try {
      const raw = window.localStorage.getItem(KEY) || "";
      return new Blob([raw]).size;
    } catch (err) {
      return 0;
    }
  }

  const isAvailable = () => storageAvailable;

  return {
    KEY,
    SCHEMA_VERSION,
    COLLECTIONS,
    DEFAULT_SETTINGS,
    emptyDB,
    loadDB,
    saveDB,
    update,
    subscribe,
    list,
    find,
    insert,
    patch,
    remove,
    removeVehicleCascade,
    getSettings,
    setSettings,
    exportDB,
    importDB,
    resetDB,
    usageBytes,
    isAvailable,
  };
})();

  </script>
  <script>
/* ===== js/seed.js ===== */
/* ==========================================================================
   AutoCare Pro — seed.js
   First-run demo data.

   IMPORTANT DATA RULE: the seed runs only when the database does not already
   exist (or when the user explicitly resets). It never overwrites records the
   user created. Every seeded row is stamped `source: "demo"` so the UI can
   label it and the user can tell generated data from their own.

   Dates are generated relative to "today" so the demo always looks current
   whenever the project is opened or evaluated.
   ========================================================================== */

window.AC = window.AC || {};

AC.seed = (function () {
  "use strict";

  const U = AC.utils;

  const daysAgo = (n) => U.isoDate(U.addDays(U.today(), -n));

  /* ------------------------------------------------------------ vehicles -- */

  function buildVehicles() {
    return [
      {
        id: "veh_demo_i20",
        name: "Hyundai i20",
        make: "Hyundai",
        model: "i20 Sportz",
        year: 2022,
        fuelType: "Petrol",
        odometer: 35240,
        registration: "PB11 CX 4821",
        lastServiceDate: daysAgo(150),
        lastServiceOdometer: 30690,
        lastWashDate: daysAgo(12),
        odometerAtLastWash: 34900,
        notes: "Daily driver. Mostly city running with weekend highway trips.",
        isPrimary: true,
        source: "demo",
        createdAt: new Date().toISOString(),
      },
      {
        id: "veh_demo_city",
        name: "Honda City",
        make: "Honda",
        model: "City VX CVT",
        year: 2021,
        fuelType: "Petrol",
        odometer: 48120,
        registration: "PB11 AH 7734",
        lastServiceDate: daysAgo(120),
        lastServiceOdometer: 45300,
        lastWashDate: daysAgo(19),
        odometerAtLastWash: 47450,
        notes: "Family car. Long inter-city runs on the Chandigarh corridor.",
        isPrimary: false,
        source: "demo",
        createdAt: new Date().toISOString(),
      },
    ];
  }

  /* ------------------------------------------------------- maintenance -- */

  /**
   * Service history is designed so the algorithms produce a genuinely
   * interesting state on first launch:
   *   i20   -> Engine Oil DUE SOON in ~450 km  (health: GOOD)
   *   City  -> Oil Filter OVERDUE, no tyre/battery history
   *            (health: ATTENTION REQUIRED)
   * The statuses are still *computed* — nothing below stores a status.
   */
  function buildMaintenance() {
    const rows = [];
    const add = (vehicleId, type, days, odometer, cost, notes) =>
      rows.push({
        id: U.uid("mnt"),
        vehicleId,
        type,
        date: daysAgo(days),
        odometer,
        cost,
        notes: notes || "",
        nextServiceDate: null,
        nextServiceOdometer: null,
        source: "demo",
        createdAt: new Date().toISOString(),
      });

    // ---- Hyundai i20 -----------------------------------------------------
    add("veh_demo_i20", "general", 540, 18900, 4850, "Periodic service at authorised workshop.");
    add("veh_demo_i20", "engine_oil", 540, 18900, 2150, "5W-30 semi-synthetic.");
    add("veh_demo_i20", "air_filter", 540, 18900, 640, "");
    add("veh_demo_i20", "engine_oil", 360, 24600, 2300, "5W-30 semi-synthetic.");
    add("veh_demo_i20", "brake_service", 300, 26800, 1850, "Front pads cleaned, rear drums adjusted.");
    add("veh_demo_i20", "general", 210, 29400, 5400, "Periodic service, all filters checked.");
    add("veh_demo_i20", "air_filter", 210, 29400, 780, "");
    add("veh_demo_i20", "wheel_align", 210, 29400, 700, "Alignment and balancing.");
    add("veh_demo_i20", "engine_oil", 150, 30690, 2450, "5W-30 fully synthetic.");
    add("veh_demo_i20", "tyres", 60, 33100, 18600, "Four new tubeless tyres.");
    add("veh_demo_i20", "oil_filter", 60, 33100, 650, "Replaced with tyre change visit.");
    add("veh_demo_i20", "battery", 25, 34600, 6200, "New 35Ah battery, 48-month warranty.");

    // ---- Honda City ------------------------------------------------------
    add("veh_demo_city", "general", 500, 34000, 5200, "Periodic service.");
    add("veh_demo_city", "engine_oil", 500, 34000, 2450, "");
    add("veh_demo_city", "engine_oil", 330, 39200, 2600, "");
    add("veh_demo_city", "brake_pads", 330, 39200, 4800, "Front brake pads replaced.");
    add("veh_demo_city", "general", 260, 41500, 5900, "Periodic service.");
    add("veh_demo_city", "oil_filter", 260, 41500, 680, "");
    add("veh_demo_city", "air_filter", 260, 41500, 820, "");
    add("veh_demo_city", "engine_oil", 120, 45300, 2700, "0W-20 fully synthetic.");
    add("veh_demo_city", "spark_plugs", 120, 45300, 2900, "Iridium plugs.");
    add("veh_demo_city", "coolant", 95, 46100, 1400, "Coolant flush and refill.");

    return rows;
  }

  /* ----------------------------------------------------------- journeys -- */

  function buildJourneys() {
    const trips = [
      ["veh_demo_i20", "Patiala", "Chandigarh", 65, 6, 132, "moderate"],
      ["veh_demo_i20", "Chandigarh", "Patiala", 65, 5, 128, "moderate"],
      ["veh_demo_i20", "Patiala", "Rajpura", 28, 9, 148, "high"],
      ["veh_demo_i20", "Patiala", "Ludhiana", 92, 22, 156, "high"],
      ["veh_demo_i20", "Ludhiana", "Patiala", 92, 21, 151, "high"],
      ["veh_demo_i20", "Patiala", "Chandigarh", 65, 38, 118, "moderate"],
      ["veh_demo_i20", "Patiala", "Nabha", 31, 52, 104, "low"],
      ["veh_demo_i20", "Patiala", "Delhi", 245, 74, 214, "high"],
      ["veh_demo_i20", "Delhi", "Patiala", 245, 71, 208, "high"],
      ["veh_demo_city", "Chandigarh", "Pathankot", 230, 14, 118, "high"],
      ["veh_demo_city", "Pathankot", "Chandigarh", 230, 11, 112, "high"],
      ["veh_demo_city", "Patiala", "Chandigarh", 65, 27, 136, "moderate"],
      ["veh_demo_city", "Chandigarh", "Shimla", 112, 46, 74, "low"],
      ["veh_demo_city", "Shimla", "Chandigarh", 112, 44, 71, "low"],
      ["veh_demo_city", "Patiala", "Amritsar", 228, 88, 142, "moderate"],
    ];

    return trips.map(([vehicleId, from, to, distanceKm, days, avgAqi, dustLevel]) => ({
      id: U.uid("jny"),
      vehicleId,
      from,
      to,
      distanceKm,
      date: daysAgo(days),
      avgAqi,
      dustLevel,
      source: "demo",
      createdAt: new Date().toISOString(),
    }));
  }

  /* -------------------------------------------------------- wash history -- */

  function buildWashes() {
    const rows = [
      ["veh_demo_i20", 12, 34900, 250],
      ["veh_demo_i20", 31, 33800, 250],
      ["veh_demo_i20", 55, 32600, 200],
      ["veh_demo_i20", 84, 31400, 250],
      ["veh_demo_city", 19, 47450, 300],
      ["veh_demo_city", 48, 46300, 300],
      ["veh_demo_city", 79, 44900, 250],
    ];
    return rows.map(([vehicleId, days, odometer, cost]) => ({
      id: U.uid("wsh"),
      vehicleId,
      date: daysAgo(days),
      odometer,
      cost,
      source: "demo",
      createdAt: new Date().toISOString(),
    }));
  }

  /* ----------------------------------------------------------- expenses -- */

  /**
   * Expenses combine three streams so the analytics charts have shape:
   *   - a fuel fill roughly every 11 days per vehicle
   *   - one expense mirroring each maintenance record that cost money
   *   - one expense per wash
   *   - one annual insurance premium per vehicle
   */
  function buildExpenses(maintenance, washes) {
    const rows = [];
    const push = (vehicleId, category, amount, date, description, linkedRecordId) =>
      rows.push({
        id: U.uid("exp"),
        vehicleId,
        category,
        amount,
        date,
        description,
        linkedRecordId: linkedRecordId || null,
        source: "demo",
        createdAt: new Date().toISOString(),
      });

    // Fuel — deterministic variation keeps the monthly chart lively.
    [
      { id: "veh_demo_i20", base: 2100, spread: 480, every: 11 },
      { id: "veh_demo_city", base: 2650, spread: 520, every: 13 },
    ].forEach((cfg) => {
      for (let d = 4; d <= 185; d += cfg.every) {
        const wobble = Math.round(Math.sin(d / 7) * cfg.spread);
        push(cfg.id, "fuel", cfg.base + wobble, daysAgo(d), "Fuel fill");
      }
    });

    maintenance
      .filter((m) => m.cost > 0)
      .forEach((m) =>
        push(
          m.vehicleId,
          m.type === "repair" ? "repair" : "maintenance",
          m.cost,
          m.date,
          `${AC.constants.maintenanceLabel(m.type)} — workshop bill`,
          m.id
        )
      );

    washes.forEach((w) =>
      push(w.vehicleId, "wash", w.cost, w.date, "Vehicle wash", w.id)
    );

    push("veh_demo_i20", "insurance", 14800, daysAgo(96), "Comprehensive insurance renewal");
    push("veh_demo_city", "insurance", 17600, daysAgo(142), "Comprehensive insurance renewal");
    push("veh_demo_i20", "other", 1200, daysAgo(63), "Cabin accessories and floor mats");
    push("veh_demo_city", "repair", 3400, daysAgo(58), "Power window regulator repair");

    return rows;
  }

  /* ---------------------------------------------------------------- apply -- */

  /**
   * Populate an *empty* database document in place.
   * Returns the same object so callers can chain.
   */
  function apply(db) {
    if (!db) return db;
    const hasData =
      (db.vehicles && db.vehicles.length) ||
      (db.maintenanceRecords && db.maintenanceRecords.length) ||
      (db.expenses && db.expenses.length);
    if (hasData) return db; // never overwrite real data

    const maintenance = buildMaintenance();
    const washes = buildWashes();

    db.vehicles = buildVehicles();
    db.maintenanceRecords = maintenance;
    db.journeys = buildJourneys();
    db.washRecords = washes;
    db.expenses = buildExpenses(maintenance, washes);
    db.settings.seededDemoData = true;
    db.meta.seededAt = new Date().toISOString();

    return db;
  }

  return { apply, buildVehicles, buildMaintenance, buildJourneys, buildWashes, buildExpenses };
})();

  <script>
/* ===== js/validation.js ===== */
/* ==========================================================================
   AutoCare Pro — validation.js
   Reusable field rules plus one validator per entity. Validators are pure:
   they take raw form values, return { valid, errors, value } and never touch
   the DOM or the database. The UI layer decides how to display `errors`.
   ========================================================================== */

window.AC = window.AC || {};

AC.validation = (function () {
  "use strict";

  const U = AC.utils;

  /* ------------------------------------------------------------- rules -- */

  const required = (v, label = "This field") =>
    v === null || v === undefined || String(v).trim() === "" ? `${label} is required.` : null;

  function numberIn(v, { min, max, label = "Value", integer = true } = {}) {
    if (!U.isNum(v)) return `${label} must be a number.`;
    const n = Number(v);
    if (integer && !Number.isInteger(n)) return `${label} must be a whole number.`;
    if (min !== undefined && n < min) return `${label} cannot be less than ${min}.`;
    if (max !== undefined && n > max) return `${label} cannot be greater than ${U.formatNumber(max)}.`;
    return null;
  }

  function validDate(v, { label = "Date", allowFuture = false, notBefore } = {}) {
    const d = U.toDate(v);
    if (!d) return `${label} is not a valid date.`;
    if (!allowFuture && d > U.today()) return `${label} cannot be in the future.`;
    if (notBefore) {
      const nb = U.toDate(notBefore);
      if (nb && d < nb) return `${label} cannot be before ${U.formatDate(nb)}.`;
    }
    return null;
  }

  function validYear(v) {
    const max = new Date().getFullYear() + 1;
    const err = numberIn(v, { min: 1950, max, label: "Model year" });
    if (err) return err;
    return null;
  }

  /** Registration numbers are compared case- and space-insensitively. */
  const normalizeReg = (v) => String(v || "").toUpperCase().replace(/[\s-]/g, "");

  /* ------------------------------------------------------- entity checks -- */

  function validateVehicle(input, { vehicles = [], editingId = null } = {}) {
    const errors = {};
    const value = {
      name: String(input.name || "").trim(),
      make: String(input.make || "").trim(),
      model: String(input.model || "").trim(),
      year: Number(input.year),
      fuelType: String(input.fuelType || "").trim(),
      odometer: Number(input.odometer),
      registration: String(input.registration || "").trim().toUpperCase(),
      lastServiceDate: input.lastServiceDate || "",
      lastServiceOdometer:
        input.lastServiceOdometer === "" || input.lastServiceOdometer === null
          ? null
          : Number(input.lastServiceOdometer),
      lastWashDate: input.lastWashDate || "",
      odometerAtLastWash:
        input.odometerAtLastWash === "" || input.odometerAtLastWash === null
          ? null
          : Number(input.odometerAtLastWash),
      notes: String(input.notes || "").trim(),
    };

    errors.name = required(value.name, "Vehicle name");
    errors.make = required(value.make, "Make");
    errors.model = required(value.model, "Model");
    errors.year = required(input.year, "Model year") || validYear(input.year);
    errors.fuelType = required(value.fuelType, "Fuel type");
    errors.odometer =
      required(input.odometer, "Odometer") ||
      numberIn(input.odometer, { min: 0, max: 2000000, label: "Odometer" });

    if (value.registration && !/^[A-Z0-9\s-]{4,15}$/i.test(input.registration)) {
      errors.registration = "Use 4–15 letters, digits, spaces or hyphens.";
    } else if (value.registration) {
      const clash = vehicles.some(
        (v) => v.id !== editingId && normalizeReg(v.registration) === normalizeReg(value.registration)
      );
      if (clash) errors.registration = "Another vehicle already uses this registration number.";
    }

    if (value.lastServiceDate) {
      errors.lastServiceDate = validDate(value.lastServiceDate, { label: "Last service date" });
    }
    if (value.lastWashDate) {
      errors.lastWashDate = validDate(value.lastWashDate, { label: "Last wash date" });
    }

    if (value.lastServiceOdometer !== null) {
      errors.lastServiceOdometer =
        numberIn(value.lastServiceOdometer, { min: 0, max: 2000000, label: "Last service odometer" }) ||
        (value.lastServiceOdometer > value.odometer
          ? "Last service odometer cannot exceed the current odometer."
          : null);
    }

    if (value.odometerAtLastWash !== null) {
      errors.odometerAtLastWash =
        numberIn(value.odometerAtLastWash, { min: 0, max: 2000000, label: "Odometer at last wash" }) ||
        (value.odometerAtLastWash > value.odometer
          ? "Odometer at last wash cannot exceed the current odometer."
          : null);
    }

    return finalize(errors, value);
  }

  function validateMaintenance(input, { vehicles = [] } = {}) {
    const errors = {};
    const value = {
      vehicleId: String(input.vehicleId || ""),
      type: String(input.type || ""),
      date: input.date || "",
      odometer: Number(input.odometer),
      cost: input.cost === "" || input.cost === null ? 0 : Number(input.cost),
      notes: String(input.notes || "").trim(),
      nextServiceDate: input.nextServiceDate || "",
      nextServiceOdometer:
        input.nextServiceOdometer === "" || input.nextServiceOdometer === null
          ? null
          : Number(input.nextServiceOdometer),
      logExpense: Boolean(input.logExpense),
    };

    errors.vehicleId = required(value.vehicleId, "Vehicle");
    if (!errors.vehicleId && !vehicles.some((v) => v.id === value.vehicleId)) {
      errors.vehicleId = "Select a vehicle that exists.";
    }

    errors.type = required(value.type, "Service type");
    errors.date = required(value.date, "Service date") || validDate(value.date, { label: "Service date" });
    errors.odometer =
      required(input.odometer, "Odometer") ||
      numberIn(input.odometer, { min: 0, max: 2000000, label: "Odometer" });
    errors.cost = numberIn(value.cost, { min: 0, max: 10000000, label: "Cost", integer: false });

    if (value.nextServiceDate) {
      errors.nextServiceDate = validDate(value.nextServiceDate, {
        label: "Next service date",
        allowFuture: true,
        notBefore: value.date,
      });
    }
    if (value.nextServiceOdometer !== null) {
      errors.nextServiceOdometer =
        numberIn(value.nextServiceOdometer, { min: 0, max: 2000000, label: "Next service odometer" }) ||
        (value.nextServiceOdometer < value.odometer
          ? "Next service odometer must be greater than the service odometer."
          : null);
    }

    return finalize(errors, value);
  }

  function validateExpense(input, { vehicles = [] } = {}) {
    const errors = {};
    const value = {
      vehicleId: String(input.vehicleId || ""),
      category: String(input.category || ""),
      amount: Number(input.amount),
      date: input.date || "",
      description: String(input.description || "").trim(),
    };

    errors.vehicleId = required(value.vehicleId, "Vehicle");
    if (!errors.vehicleId && !vehicles.some((v) => v.id === value.vehicleId)) {
      errors.vehicleId = "Select a vehicle that exists.";
    }
    errors.category = required(value.category, "Category");
    errors.amount =
      required(input.amount, "Amount") ||
      numberIn(input.amount, { min: 1, max: 10000000, label: "Amount", integer: false });
    errors.date = required(value.date, "Date") || validDate(value.date, { label: "Date" });

    return finalize(errors, value);
  }

  function validateJourney(input, { vehicles = [] } = {}) {
    const errors = {};
    const value = {
      vehicleId: String(input.vehicleId || ""),
      from: String(input.from || "").trim(),
      to: String(input.to || "").trim(),
      distanceKm: Number(input.distanceKm),
      date: input.date || "",
      avgAqi: input.avgAqi === "" || input.avgAqi === null ? null : Number(input.avgAqi),
      dustLevel: String(input.dustLevel || "moderate"),
    };

    errors.vehicleId = required(value.vehicleId, "Vehicle");
    if (!errors.vehicleId && !vehicles.some((v) => v.id === value.vehicleId)) {
      errors.vehicleId = "Select a vehicle that exists.";
    }
    errors.from = required(value.from, "Origin");
    errors.to = required(value.to, "Destination");
    errors.distanceKm =
      required(input.distanceKm, "Distance") ||
      numberIn(input.distanceKm, { min: 1, max: 5000, label: "Distance" });
    errors.date = required(value.date, "Date") || validDate(value.date, { label: "Date" });
    if (value.avgAqi !== null) {
      errors.avgAqi = numberIn(value.avgAqi, { min: 0, max: 500, label: "Average AQI" });
    }

    return finalize(errors, value);
  }

  function validateWash(input, { vehicles = [] } = {}) {
    const errors = {};
    const value = {
      vehicleId: String(input.vehicleId || ""),
      date: input.date || "",
      odometer: input.odometer === "" || input.odometer === null ? null : Number(input.odometer),
      cost: input.cost === "" || input.cost === null ? 0 : Number(input.cost),
      logExpense: Boolean(input.logExpense),
    };

    errors.vehicleId = required(value.vehicleId, "Vehicle");
    if (!errors.vehicleId && !vehicles.some((v) => v.id === value.vehicleId)) {
      errors.vehicleId = "Select a vehicle that exists.";
    }
    errors.date = required(value.date, "Wash date") || validDate(value.date, { label: "Wash date" });
    if (value.odometer !== null) {
      errors.odometer = numberIn(value.odometer, { min: 0, max: 2000000, label: "Odometer" });
    }
    errors.cost = numberIn(value.cost, { min: 0, max: 100000, label: "Cost", integer: false });

    return finalize(errors, value);
  }

  /* ----------------------------------------------------------- helpers -- */

  function finalize(errors, value) {
    Object.keys(errors).forEach((k) => {
      if (!errors[k]) delete errors[k];
    });
    return { valid: Object.keys(errors).length === 0, errors, value };
  }

  return {
    required,
    numberIn,
    validDate,
    validYear,
    normalizeReg,
    validateVehicle,
    validateMaintenance,
    validateExpense,
    validateJourney,
    validateWash,
  };
})();
