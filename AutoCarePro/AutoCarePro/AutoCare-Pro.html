  <script>
/* ===== js/ui.js ===== */
/* ==========================================================================
   AutoCare Pro — ui.js
   The presentation toolkit: reusable markup builders plus the modal, toast
   and confirmation systems. Nothing here reads the database directly — pages
   pass in the data they have already computed.
   ========================================================================== */

window.AC = window.AC || {};

AC.ui = (function () {
  "use strict";

  const U = AC.utils;
  const I = AC.icons;

  /* ====================================================== markup builders == */

  /**
   * @param {object} cfg
   * @param {"number"|"money"|"pad"} [cfg.format] how the count-up renders
   */
  function metricCard({ label, value, foot, icon, tone, unit, counter = true, id, format = "number" }) {
    const toneClass = tone ? ` is-${tone}` : "";
    const idAttr = id ? ` id="${id}"` : "";
    const fmt = format === "money" ? ' data-money="true"' : format === "pad" ? ' data-pad="true"' : "";
    const dataCount = counter ? ` data-count="${Number(value) || 0}"${fmt}` : "";
    return `
      <article class="card metric-card card--interactive">
        <div class="card__scanline"></div>
        <div class="metric${toneClass}">
          <span class="metric__label">${U.esc(label)}</span>
          <span class="metric__value counter"${idAttr}${dataCount}>${U.esc(
      counter ? "0" : value
    )}${unit ? `<span class="metric__unit">${U.esc(unit)}</span>` : ""}</span>
          ${foot ? `<span class="metric__foot">${U.esc(foot)}</span>` : ""}
        </div>
        ${icon ? `<span class="metric__icon">${I.get(icon, { size: 16 })}</span>` : ""}
      </article>`;
  }

  function statusPill(label, tone = "muted", opts = {}) {
    const cls = ["pill", `pill--${tone}`];
    if (opts.live) cls.push("pill--live");
    if (opts.plain) cls.push("pill--plain");
    return `<span class="${cls.join(" ")}">${U.esc(label)}</span>`;
  }

  /**
   * Progress bar. The fill starts at 0 and is animated to its real width by
   * `activateBars()` after the markup is in the DOM.
   */
  function progressBar({ label, value, max = 100, tone = "", suffix = "%", hint }) {
    const pct = U.clamp((Number(value) / max) * 100, 0, 100);
    return `
      <div class="bar${tone ? ` bar--${tone}` : ""}">
        <div class="bar__head">
          <span class="bar__label">${U.esc(label)}</span>
          <span class="bar__value">${U.esc(Math.round(Number(value)))}${U.esc(suffix)}</span>
        </div>
        <div class="bar__track">
          <div class="bar__fill" data-width="${pct}"></div>
        </div>
        ${hint ? `<span class="field__hint">${U.esc(hint)}</span>` : ""}
      </div>`;
  }

  function emptyState({ icon = "layers", title, text, actionLabel, actionEvent, actionAttrs = "" }) {
    return `
      <div class="empty">
        <span class="empty__icon">${I.get(icon, { size: 24 })}</span>
        <h3 class="empty__title">${U.esc(title)}</h3>
        <p class="empty__text">${U.esc(text)}</p>
        ${
          actionLabel
            ? `<button class="btn btn--primary" data-action="${U.esc(actionEvent)}" ${actionAttrs}>
                 ${I.get("plus", { size: 16 })}<span>${U.esc(actionLabel)}</span>
               </button>`
            : ""
        }
      </div>`;
  }

  function banner(text, tone = "info", icon = "info") {
    return `<div class="banner banner--${tone}">${I.get(icon, { size: 17 })}<span>${text}</span></div>`;
  }

  function alertRow(alert) {
    const action = alert.action
      ? `<button class="btn btn--ghost btn--sm alert__action" data-alert-action="${U.esc(
          alert.id
        )}">${U.esc(alert.action.label)}</button>`
      : "";
    return `
      <div class="alert alert--${U.esc(alert.priority)}">
        <span class="alert__icon">${I.get(alert.icon || "info", { size: 15 })}</span>
        <div class="alert__body">
          <div class="alert__title">${U.esc(alert.title)}</div>
          <div class="alert__meta">${U.esc(alert.meta)}</div>
        </div>
        ${action}
      </div>`;
  }

  const demoFlag = () => `<span class="demo-flag">${I.get("database", { size: 11 })} Demo data</span>`;

  function sectionHead(title, hint, actionsHtml = "") {
    return `
      <div class="section-head">
        <div>
          <h2>${U.esc(title)}</h2>
          ${hint ? `<div class="section-head__hint">${U.esc(hint)}</div>` : ""}
        </div>
        ${actionsHtml}
      </div>`;
  }

  /* ---- form field builders ------------------------------------------------ */

  function field({ name, label, type = "text", value = "", required = false, hint, attrs = "", full = false }) {
    return `
      <div class="field${full ? " field--full" : ""}">
        <label for="f-${name}">${U.esc(label)}${required ? ' <span class="req">*</span>' : ""}</label>
        <input class="input" id="f-${name}" name="${name}" type="${type}" value="${U.esc(value)}" ${attrs} />
        ${hint ? `<span class="field__hint">${U.esc(hint)}</span>` : ""}
        <span class="field__error" data-error-for="${name}"></span>
      </div>`;
  }

  function selectField({ name, label, options, value = "", required = false, hint, full = false }) {
    const opts = options
      .map(
        (o) =>
          `<option value="${U.esc(o.value)}"${String(o.value) === String(value) ? " selected" : ""}>${U.esc(
            o.label
          )}</option>`
      )
      .join("");
    return `
      <div class="field${full ? " field--full" : ""}">
        <label for="f-${name}">${U.esc(label)}${required ? ' <span class="req">*</span>' : ""}</label>
        <select class="select" id="f-${name}" name="${name}">${opts}</select>
        ${hint ? `<span class="field__hint">${U.esc(hint)}</span>` : ""}
        <span class="field__error" data-error-for="${name}"></span>
      </div>`;
  }

  function textareaField({ name, label, value = "", hint, full = true }) {
    return `
      <div class="field${full ? " field--full" : ""}">
        <label for="f-${name}">${U.esc(label)}</label>
        <textarea class="textarea" id="f-${name}" name="${name}" rows="3">${U.esc(value)}</textarea>
        ${hint ? `<span class="field__hint">${U.esc(hint)}</span>` : ""}
        <span class="field__error" data-error-for="${name}"></span>
      </div>`;
  }

  function switchField({ name, label, checked = false }) {
    return `
      <label class="switch">
        <input type="checkbox" name="${name}" ${checked ? "checked" : ""} />
        <span class="switch__track"></span>
        <span>${U.esc(label)}</span>
      </label>`;
  }

  /* ========================================================= animation ==== */

  /** Kick off every count-up and progress bar inside `root`. */
  function activate(root = document) {
    U.$$("[data-count]", root).forEach((el) => {
      const target = Number(el.dataset.count) || 0;
      const unitEl = el.querySelector(".metric__unit");
      const unitHtml = unitEl ? unitEl.outerHTML : "";
      const pad = el.dataset.pad === "true";
      const money = el.dataset.money === "true";
      const format = money
        ? U.formatCurrency
        : pad
        ? (n) => U.pad2(n)
        : U.formatNumber;
      const holder = document.createElement("span");
      el.textContent = "";
      el.appendChild(holder);
      if (unitHtml) el.insertAdjacentHTML("beforeend", unitHtml);
      U.countUp(holder, target, { format });
    });

    // Two frames: let layout settle so the transition actually runs.
    U.raf(() =>
      U.raf(() => {
        U.$$(".bar__fill[data-width]", root).forEach((el) => {
          el.style.width = `${el.dataset.width}%`;
        });
      })
    );
  }

  /* ============================================================ toasts ==== */

  const TOAST_ICONS = { success: "check", error: "alert", warning: "alert", info: "info" };

  function toast(message, { title, type = "success", duration = 3600 } = {}) {
    const stack = U.$("#toastStack");
    if (!stack) return;
    const el = document.createElement("div");
    el.className = `toast toast--${type}`;
    el.setAttribute("role", type === "error" ? "alert" : "status");
    el.innerHTML = `
      <span class="toast__icon">${I.get(TOAST_ICONS[type] || "info", { size: 18 })}</span>
      <div class="toast__body">
        <div class="toast__title">${U.esc(title || defaultTitle(type))}</div>
        <div class="toast__msg">${U.esc(message)}</div>
      </div>
      <button class="icon-btn" aria-label="Dismiss notification" style="width:26px;height:26px">
        ${I.get("close", { size: 14 })}
      </button>`;

    const dismiss = () => {
      el.classList.add("is-out");
      setTimeout(() => el.remove(), 200);
    };
    el.querySelector("button").addEventListener("click", dismiss);
    stack.appendChild(el);
    if (duration) setTimeout(dismiss, duration);
  }

  const defaultTitle = (type) =>
    ({ success: "Done", error: "Something went wrong", warning: "Heads up", info: "Note" }[type] || "Note");

  /* ============================================================= modal ==== */

  let activeModal = null;
  let lastFocused = null;

  /**
   * Open a modal.
   * @param {object} cfg { title, subtitle, body, footer, size, onMount, onSubmit }
   * @returns {HTMLElement} the modal element
   */
  function openModal(cfg) {
    closeModal(true);
    lastFocused = document.activeElement;

    const root = U.$("#modalRoot");
    root.hidden = false;
    root.innerHTML = `
      <div class="modal__backdrop" data-close-modal></div>
      <div class="modal ${cfg.size ? `modal--${cfg.size}` : ""}" role="dialog" aria-modal="true"
           aria-labelledby="modalTitle">
        <header class="modal__head">
          <div>
            <h2 class="modal__title" id="modalTitle">${U.esc(cfg.title)}</h2>
            ${cfg.subtitle ? `<div class="modal__sub">${U.esc(cfg.subtitle)}</div>` : ""}
          </div>
          <button class="icon-btn" data-close-modal aria-label="Close dialog">
            ${I.get("close", { size: 18 })}
          </button>
        </header>
        <div class="modal__body">${cfg.body || ""}</div>
        ${cfg.footer ? `<footer class="modal__foot">${cfg.footer}</footer>` : ""}
      </div>`;

    activeModal = root.querySelector(".modal");
    document.body.style.overflow = "hidden";

    root.querySelectorAll("[data-close-modal]").forEach((el) =>
      el.addEventListener("click", () => closeModal())
    );

    if (typeof cfg.onMount === "function") cfg.onMount(activeModal);

    // Focus the first meaningful control.
    const focusable = activeModal.querySelector(
      "input:not([type=hidden]), select, textarea, button:not([data-close-modal])"
    );
    (focusable || activeModal.querySelector("[data-close-modal]")).focus();

    activeModal.addEventListener("keydown", trapFocus);
    return activeModal;
  }

  function trapFocus(e) {
    if (e.key !== "Tab" || !activeModal) return;
    const items = Array.from(
      activeModal.querySelectorAll(
        'a[href], button:not([disabled]), input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )
    ).filter((el) => el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  function closeModal(immediate = false) {
    const root = U.$("#modalRoot");
    if (!root || root.hidden) return;
    const modal = root.querySelector(".modal");
    const finish = () => {
      root.hidden = true;
      root.innerHTML = "";
      activeModal = null;
      document.body.style.overflow = "";
      if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
    };
    if (immediate || U.prefersReducedMotion() || !modal) return finish();
    modal.classList.add("is-closing");
    setTimeout(finish, 130);
  }

  /** Promise-based confirmation dialog used before every destructive action. */
  function confirm({ title, message, confirmLabel = "Delete", tone = "danger" }) {
    return new Promise((resolve) => {
      openModal({
        title,
        size: "sm",
        body: `<p style="color:var(--text-secondary);line-height:1.6">${U.esc(message)}</p>`,
        footer: `
          <button class="btn btn--ghost" data-confirm="no">Cancel</button>
          <button class="btn btn--${tone}" data-confirm="yes">${U.esc(confirmLabel)}</button>`,
        onMount(modal) {
          modal.querySelector('[data-confirm="no"]').addEventListener("click", () => {
            closeModal();
            resolve(false);
          });
          modal.querySelector('[data-confirm="yes"]').addEventListener("click", () => {
            closeModal();
            resolve(true);
          });
        },
      });
    });
  }

  /* ============================================================== forms === */

  /** Collect a form's values into a plain object. */
  function formValues(form) {
    const out = {};
    new FormData(form).forEach((v, k) => {
      out[k] = typeof v === "string" ? v.trim() : v;
    });
    form.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
      out[cb.name] = cb.checked;
    });
    return out;
  }

  /** Paint validation errors returned by AC.validation onto a form. */
  function showErrors(form, errors) {
    form.querySelectorAll("[data-error-for]").forEach((el) => {
      el.textContent = "";
    });
    form.querySelectorAll(".input, .select, .textarea").forEach((el) =>
      el.removeAttribute("aria-invalid")
    );

    const keys = Object.keys(errors);
    keys.forEach((key) => {
      const slot = form.querySelector(`[data-error-for="${key}"]`);
      if (slot) slot.textContent = errors[key];
      const input = form.querySelector(`[name="${key}"]`);
      if (input) input.setAttribute("aria-invalid", "true");
    });

    if (keys.length) {
      const first = form.querySelector(`[name="${keys[0]}"]`);
      if (first) first.focus();
    }
  }

  /* ========================================================== utilities === */

  const toneForStatus = (status) =>
    ({ overdue: "critical", "due-soon": "warning", upcoming: "success", unknown: "muted" }[status] ||
    "muted");

  /** Escape-key handling for modal + palette lives in app.js; exposed here. */
  const isModalOpen = () => Boolean(activeModal);

  return {
    metricCard,
    statusPill,
    progressBar,
    emptyState,
    banner,
    alertRow,
    demoFlag,
    sectionHead,
    field,
    selectField,
    textareaField,
    switchField,
    activate,
    toast,
    openModal,
    closeModal,
    confirm,
    formValues,
    showErrors,
    toneForStatus,
    isModalOpen,
  };
})();

  </script>
  <script>
/* ===== js/charts.js ===== */
/* ==========================================================================
   AutoCare Pro — charts.js
   A thin, opinionated wrapper over Chart.js.

   Responsibilities:
     - apply the dark automotive theme once, globally
     - keep a registry of live charts so route changes can destroy them
       (Chart.js leaks canvases and resize listeners otherwise)
     - expose small factories so pages describe data, not chart plumbing
   ========================================================================== */

window.AC = window.AC || {};

AC.charts = (function () {
  "use strict";

  const U = AC.utils;
  const registry = new Map();

  const css = (name, fallback) => {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  };

  const PALETTE = () => [
    css("--viz-1", "#e10600"),
    css("--viz-2", "#4aa8ff"),
    css("--viz-3", "#39ff88"),
    css("--viz-4", "#ff9d2e"),
    css("--viz-5", "#a06bff"),
    css("--viz-6", "#22d3ee"),
    css("--viz-7", "#f5d90a"),
    css("--viz-8", "#7d8794"),
  ];

  let themed = false;

  function applyTheme() {
    if (themed || typeof window.Chart === "undefined") return;
    const Chart = window.Chart;
    const grid = "rgba(255,255,255,.06)";
    const text = css("--text-muted", "#626b76");

    Chart.defaults.color = text;
    Chart.defaults.font.family = css("--font-sans", "Inter, sans-serif").replace(/"/g, "");
    Chart.defaults.font.size = 11;
    Chart.defaults.borderColor = grid;
    Chart.defaults.animation.duration = U.prefersReducedMotion() ? 0 : 800;
    Chart.defaults.animation.easing = "easeOutQuart";
    Chart.defaults.plugins.legend.display = false;
    Chart.defaults.plugins.tooltip.backgroundColor = css("--surface-elevated", "#171a1f");
    Chart.defaults.plugins.tooltip.borderColor = css("--border", "#282d35");
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.titleColor = css("--text-primary", "#f4f6f8");
    Chart.defaults.plugins.tooltip.bodyColor = css("--text-secondary", "#a1a8b2");
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.plugins.tooltip.displayColors = true;
    Chart.defaults.plugins.tooltip.boxWidth = 8;
    Chart.defaults.plugins.tooltip.boxHeight = 8;
    Chart.defaults.maintainAspectRatio = false;
    themed = true;
  }

  const axis = (opts = {}) => ({
    grid: { color: "rgba(255,255,255,.05)", drawTicks: false, ...(opts.grid || {}) },
    border: { display: false },
    ticks: { padding: 8, maxRotation: 0, ...(opts.ticks || {}) },
    ...opts.rest,
  });

  /** Create (or replace) a chart bound to a canvas id. */
  function create(canvasId, config) {
    if (typeof window.Chart === "undefined") return null;
    applyTheme();
    destroy(canvasId);
    const canvas = document.getElementById(canvasId);
    if (!canvas) return null;
    const chart = new window.Chart(canvas.getContext("2d"), config);
    registry.set(canvasId, chart);
    return chart;
  }

  function destroy(canvasId) {
    const existing = registry.get(canvasId);
    if (existing) {
      existing.destroy();
      registry.delete(canvasId);
    }
  }

  /** Called by the router before every page swap — prevents canvas leaks. */
  function destroyAll() {
    registry.forEach((chart) => chart.destroy());
    registry.clear();
  }

  /* ------------------------------------------------------------ factories -- */

  function bar(canvasId, { labels, data, color, money = false, label = "Value", integer = false }) {
    const c = color || css("--accent-red", "#e10600");
    return create(canvasId, {
      type: "bar",
      data: {
        labels,
        datasets: [
          {
            label,
            data,
            backgroundColor: c,
            hoverBackgroundColor: css("--accent-red-bright", "#ff2b24"),
            borderRadius: 5,
            maxBarThickness: 42,
          },
        ],
      },
      options: {
        responsive: true,
        scales: {
          x: axis(),
          y: axis({
            ticks: {
              precision: 0,
              stepSize: integer ? 1 : undefined,
              callback: (v) =>
                integer && !Number.isInteger(v) ? "" : money ? U.compactCurrency(v) : U.formatNumber(v),
            },
            rest: { beginAtZero: true },
          }),
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: (ctx) =>
                `${ctx.dataset.label}: ${money ? U.formatCurrency(ctx.parsed.y) : U.formatNumber(ctx.parsed.y)}`,
            },
          },
        },
      },
    });
  }

  function stackedBar(canvasId, { labels, series, money = true }) {
    return create(canvasId, {
      type: "bar",
      data: {
        labels,
        datasets: series.map((s) => ({
          label: s.label,
          data: s.data,
          backgroundColor: s.hex,
          borderRadius: 4,
          maxBarThickness: 42,
        })),
      },
      options: {
        responsive: true,
        scales: {
          x: { ...axis(), stacked: true },
          y: {
            ...axis({ ticks: { callback: (v) => (money ? U.compactCurrency(v) : U.formatNumber(v)) } }),
            stacked: true,
            beginAtZero: true,
          },
        },
        plugins: {
          legend: {
            display: true,
            position: "bottom",
            labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: "rectRounded", padding: 14 },
          },
          tooltip: {
            callbacks: {
              label: (ctx) =>
                `${ctx.dataset.label}: ${money ? U.formatCurrency(ctx.parsed.y) : U.formatNumber(ctx.parsed.y)}`,
            },
          },
        },
      },
    });
  }

  function line(canvasId, { labels, data, color, fill = true, label = "Value", money = false, suffix = "" }) {
    const c = color || css("--accent-red-bright", "#ff2b24");
    return create(canvasId, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label,
            data,
            borderColor: c,
            backgroundColor: fill ? gradient(canvasId, c) : "transparent",
            borderWidth: 2.4,
            pointRadius: 3,
            pointHoverRadius: 6,
            pointBackgroundColor: c,
            pointBorderColor: css("--bg-primary", "#070809"),
            pointBorderWidth: 2,
            tension: 0.34,
            fill,
          },
        ],
      },
      options: {
        responsive: true,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: axis(),
          y: axis({
            ticks: {
              callback: (v) => (money ? U.compactCurrency(v) : `${U.formatNumber(v)}${suffix}`),
            },
          }),
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: (ctx) =>
                `${ctx.dataset.label}: ${
                  money ? U.formatCurrency(ctx.parsed.y) : `${U.formatNumber(ctx.parsed.y)}${suffix}`
                }`,
            },
          },
        },
      },
    });
  }

  function multiLine(canvasId, { labels, series, suffix = "" }) {
    return create(canvasId, {
      type: "line",
      data: {
        labels,
        datasets: series.map((s, i) => ({
          label: s.label,
          data: s.data,
          borderColor: s.color || PALETTE()[i % 8],
          backgroundColor: "transparent",
          borderWidth: 2.2,
          pointRadius: 3,
          pointHoverRadius: 6,
          tension: 0.34,
          yAxisID: s.axis || "y",
          spanGaps: true,
        })),
      },
      options: {
        responsive: true,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            display: true,
            position: "bottom",
            labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: "line", padding: 14 },
          },
        },
        scales: {
          x: axis(),
          y: axis({ ticks: { callback: (v) => `${U.formatNumber(v)}${suffix}` } }),
          y1: {
            ...axis({ grid: { drawOnChartArea: false } }),
            position: "right",
            display: series.some((s) => s.axis === "y1"),
          },
        },
      },
    });
  }

  function doughnut(canvasId, { labels, data, colors, money = true }) {
    return create(canvasId, {
      type: "doughnut",
      data: {
        labels,
        datasets: [
          {
            data,
            backgroundColor: colors || PALETTE(),
            borderColor: css("--surface", "#111419"),
            borderWidth: 3,
            hoverOffset: 8,
          },
        ],
      },
      options: {
        responsive: true,
        cutout: "62%",
        plugins: {
          legend: {
            display: true,
            position: "bottom",
            labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: "rectRounded", padding: 14 },
          },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const total = ctx.dataset.data.reduce((a, b) => a + b, 0) || 1;
                const pct = Math.round((ctx.parsed / total) * 100);
                return `${ctx.label}: ${money ? U.formatCurrency(ctx.parsed) : U.formatNumber(ctx.parsed)} (${pct}%)`;
              },
            },
          },
        },
      },
    });
  }

  /** Vertical fade under a line series. */
  function gradient(canvasId, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return "transparent";
    const ctx = canvas.getContext("2d");
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height || 240);
    g.addColorStop(0, hexToRgba(color, 0.34));
    g.addColorStop(1, hexToRgba(color, 0));
    return g;
  }

  function hexToRgba(hex, alpha) {
    const h = String(hex).replace("#", "").trim();
    if (h.length !== 6) return `rgba(225,6,0,${alpha})`;
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const available = () => typeof window.Chart !== "undefined";

  return {
    PALETTE,
    applyTheme,
    create,
    destroy,
    destroyAll,
    bar,
    stackedBar,
    line,
    multiLine,
    doughnut,
    available,
    css,
  };
})();

  </script>
  <script>
/* ===== js/forms.js ===== */
/* ==========================================================================
   AutoCare Pro — forms.js
   Every create/edit dialog in the application. Centralising them means the
   dashboard quick-actions, the command palette and the individual pages all
   open the *same* validated form instead of three near-copies.

   Flow for each dialog:
       build markup -> open modal -> on submit: validate -> persist ->
       toast -> refresh the current route
   ========================================================================== */

window.AC = window.AC || {};

AC.forms = (function () {
  "use strict";

  const U = AC.utils;
  const C = AC.constants;
  const UI = AC.ui;

  const vehicleOptions = () =>
    AC.vehicles.all().map((v) => ({ value: v.id, label: `${v.name} · ${v.registration || "No reg."}` }));

  const todayIso = () => U.isoDate(U.today());

  function guardNoVehicles() {
    if (AC.vehicles.count() === 0) {
      UI.toast("Add a vehicle first — records must belong to a vehicle.", {
        type: "warning",
        title: "No vehicles yet",
      });
      return true;
    }
    return false;
  }

  /* ============================================================ vehicle === */

  function vehicleModal(vehicleId = null) {
    const editing = vehicleId ? AC.vehicles.get(vehicleId) : null;
    const v = editing || {};

    const body = `
      <form id="vehicleForm" novalidate>
        <div class="form-grid">
          ${UI.field({ name: "name", label: "Vehicle name", value: v.name || "", required: true, attrs: 'maxlength="40" placeholder="Hyundai i20"' })}
          ${UI.field({ name: "registration", label: "Registration number", value: v.registration || "", attrs: 'maxlength="15" placeholder="PB11 CX 4821"' })}

  <script>
/* ===== js/router.js ===== */
/* ==========================================================================
   AutoCare Pro — router.js
   A tiny hash router that gives the app single-page navigation without a
   framework. Responsibilities:
     - map `#route?key=value` to a registered page module
     - render into #view and run the page's mount hook
     - keep sidebar / bottom-bar active states in sync
     - destroy live charts before swapping pages (no canvas leaks)
     - fall back to #dashboard for unknown routes
   Browser back/forward and a hard refresh all restore the same view.
   ========================================================================== */

window.AC = window.AC || {};

AC.router = (function () {
  "use strict";

  const U = AC.utils;
  const DEFAULT = "dashboard";

  const pages = {};
  let current = null;
  const listeners = new Set();

  /** Register a page module: { render(params) -> html, mount?(root, params) }. */
  function register(name, page) {
    pages[name] = page;
  }

  /** Parse `#vehicles?id=abc` into { name: "vehicles", params: { id: "abc" } }. */
  function parse(hash = window.location.hash) {
    const raw = String(hash || "").replace(/^#\/?/, "");
    if (!raw) return { name: DEFAULT, params: {} };
    const [name, query] = raw.split("?");
    const params = {};
    if (query) {
      query.split("&").forEach((pair) => {
        const [k, v] = pair.split("=");
        if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || "");
      });
    }
    return { name: pages[name] ? name : DEFAULT, params };
  }

  function navigate(name, params = {}) {
    const query = Object.keys(params)
      .map((k) => `${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`)
      .join("&");
    const next = `#${name}${query ? `?${query}` : ""}`;
    if (window.location.hash === next) render();
    else window.location.hash = next;
  }

  /** Re-render the current route in place (used after every data mutation). */
  const refresh = () => render();

  function render() {
    const route = parse();
    const page = pages[route.name];
    const view = U.$("#view");
    if (!page || !view) return;

    // Chart.js keeps references to canvases; clear them before the DOM swap.
    AC.charts.destroyAll();

    try {
      view.innerHTML = page.render(route.params) || "";
      if (typeof page.mount === "function") page.mount(view, route.params);
      AC.ui.activate(view);
    } catch (err) {
      console.error(`[AutoCare] Failed to render "${route.name}"`, err);
      view.innerHTML = renderCrash(route.name, err);
    }

    current = route;
    syncNav(route.name);
    document.title = `${titleFor(route.name)} · AutoCare Pro`;

    // Keep the reading position sensible on navigation.
    window.scrollTo({ top: 0, behavior: U.prefersReducedMotion() ? "auto" : "smooth" });

    listeners.forEach((fn) => fn(route));
  }

  function renderCrash(name, err) {
    return `
      <section class="page">
        <div class="empty">
          <span class="empty__icon">${AC.icons.get("alert", { size: 24 })}</span>
          <h3 class="empty__title">This screen could not be displayed</h3>
          <p class="empty__text">
            An error occurred while rendering the ${U.esc(name)} view. Your data is safe —
            try another page, or reload the application.
          </p>
          <code style="max-width:60ch">${U.esc(err && err.message ? err.message : String(err))}</code>
        </div>
      </section>`;
  }

  function titleFor(name) {
    const route = AC.constants.ROUTES.find((r) => r.hash === name);
    return route ? route.label : "Dashboard";
  }

  function syncNav(name) {
    U.$$("[data-route]").forEach((el) => {
      const active = el.dataset.route === name;
      el.classList.toggle("is-active", active);
      if (el.hasAttribute("aria-current") || active) {
        if (active) el.setAttribute("aria-current", "page");
        else el.removeAttribute("aria-current");
      }
    });
  }

  function onChange(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  function start() {
    window.addEventListener("hashchange", render);
    if (!window.location.hash) window.location.hash = `#${DEFAULT}`;
    render();
  }

  return {
    DEFAULT,
    register,
    parse,
    navigate,
    refresh,
    render,
    start,
    onChange,
    get current() {
      return current;
    },
  };
})();

  </script>

/* ===== js/pages/dashboard.js ===== */
/* ==========================================================================
   AutoCare Pro — pages/dashboard.js
   The overview screen. Every number on it is computed by AC.analytics,
   AC.health, AC.maintenance or AC.wash from stored records.
   ========================================================================== */

window.AC = window.AC || {};
AC.pages = AC.pages || {};

AC.pages.dashboard = (function () {
  "use strict";

  const U = AC.utils;
  const UI = AC.ui;
  const I = AC.icons;

  let alertsCache = [];

  function render() {
    const settings = AC.storage.getSettings();
    const env = AC.environment.current();
    const vehicles = AC.vehicles.all();
    const metrics = AC.analytics.dashboardMetrics(env);
    const primary = AC.vehicles.primary();
    alertsCache = AC.notifications.generate(env);

    return `
      <section class="page">
        ${head(settings, vehicles.length)}

        <div class="grid grid--metrics stagger">
          ${UI.metricCard({
            label: "Total vehicles",

            icon: "car",
          })}
          ${UI.metricCard({
            label: "Service due",
            value: metrics.serviceDue,
            format: "pad",
            foot: metrics.serviceDue ? "Maintenance required" : "Nothing due soon",
            icon: "wrench",
            tone: metrics.serviceDue ? "warning" : "",
          })}
          ${UI.metricCard({
            label: "Overdue",
            value: metrics.overdue,
            format: "pad",
            foot: metrics.overdue ? "Immediate attention" : "No overdue services",
            icon: "alert",
            tone: metrics.overdue ? "critical" : "success",
          })}
          ${UI.metricCard({
            label: "Maintenance cost",
            value: metrics.maintenanceCost,
            format: "money",
            foot: "Recorded service + repair spend",
            icon: "rupee",
          })}
        </div>

        ${
          vehicles.length
            ? `<div class="split-hero mt-4">
                 ${heroVehicle(primary, settings)}
                 ${healthCard(primary)}
               </div>`
            : `<div class="mt-6">${UI.emptyState({
                icon: "car",
                title: "No vehicles registered",
                text: "Add your first vehicle to start tracking maintenance, expenses, health and environmental exposure.",
                actionLabel: "Add vehicle",
                actionEvent: "vehicle:new",
              })}</div>`
        }

        <div class="grid grid--2 mt-4">
          ${alertsCard()}
          ${environmentCard(env, settings)}
        </div>

        <div class="grid grid--2 mt-4">
          ${timelineCard(primary, settings)}
          ${spendCard()}
        </div>
      </section>`;
  }

  /* --------------------------------------------------------------- parts -- */

  function head(settings, count) {
    return `
      <header class="page-head">
        <div>
          <div class="page-head__eyebrow">Vehicle Management System</div>
          <h1>Dashboard</h1>
          <div class="greeting mt-4">${U.esc(U.greeting())}, ${U.esc(
      settings.userName.toUpperCase()
    )}</div>
          <p class="page-head__sub">

              count

        <div class="page-head__actions">

  function heroVehicle(vehicle, settings) {
    if (!vehicle) return "";
    const next = AC.maintenance.nextService(vehicle);
    const washDays = U.daysBetween(vehicle.lastWashDate);

    return `
      <article class="hero-vehicle tech-grid corner-ticks">
        <div class="hero-vehicle__top">
          <div>
            <div class="micro-label">Primary vehicle</div>
            <h2 class="hero-vehicle__name">${U.esc(vehicle.name)}</h2>
            <div class="hero-vehicle__spec">
              ${U.esc(vehicle.fuelType)} · ${U.esc(vehicle.year)} · ${U.formatDistance(
      vehicle.odometer,
      settings.units
    )}
            </div>
          </div>
          ${vehicle.source === "demo" ? UI.demoFlag() : ""}
        </div>

        <div class="hero-vehicle__art">${I.carArt()}</div>

        <div class="hero-vehicle__foot">
          <div class="stat-row" style="flex:1">
            <div class="stat stat--accent">
              <span class="stat__label">Odometer</span>
              <span class="stat__value">${U.formatDistance(vehicle.odometer, settings.units)}</span>
            </div>
            <div class="stat">
              <span class="stat__label">Next service</span>
              <span class="stat__value">${
                next && next.remainingKm !== null
                  ? U.formatDistance(Math.abs(next.remainingKm), settings.units)
                  : "—"
              }</span>
              <span class="stat__label">${
                next
                  ? `${U.esc(next.label)}${next.remainingKm < 0 ? " · overdue" : ""}`
                  : "No history"
              }</span>
            </div>
            <div class="stat">
              <span class="stat__label">Last wash</span>
              <span class="stat__value">${washDays === null ? "—" : U.pad2(washDays)}</span>
              <span class="stat__label">${washDays === null ? "Not recorded" : "days ago"}</span>
            </div>
          </div>
          <button class="btn btn--primary" data-action="vehicle:view" data-id="${U.esc(vehicle.id)}">
            View vehicle ${I.get("arrowRight", { size: 16 })}
          </button>
        </div>
        <span class="telemetry-caption">SYS/PRIMARY · ${U.esc(vehicle.registration || "NO-REG")}</span>
      </article>`;
  }

  function healthCard(vehicle) {
    if (!vehicle) return "";
    const h = AC.health.calculateVehicleHealth(vehicle);
    const tone = h.band.tone;

    return `
      <article class="card health-card corner-ticks">
        <div class="card__head">
          <span class="card__title">Vehicle health</span>
          ${UI.statusPill(h.band.label, tone)}
        </div>

        <div class="health-hero">
          ${healthRing(h.overall, tone)}
          <div>
            <div class="health-hero__value text-${tone === "success" ? "success" : tone}">
              <span class="counter" data-count="${h.overall}"></span><sup>%</sup>
            </div>
            <div class="micro-label mt-4">Composite score · ${U.esc(vehicle.name)}</div>
          </div>
        </div>

        <div class="health-bars">
          ${UI.progressBar({ label: "Engine", value: h.engine, tone: barTone(h.engine) })}
          ${UI.progressBar({ label: "Tyres", value: h.tyres, tone: barTone(h.tyres) })}
          ${UI.progressBar({ label: "Battery", value: h.battery, tone: barTone(h.battery) })}
          ${UI.progressBar({ label: "Brakes", value: h.brakes, tone: barTone(h.brakes) })}
        </div>

        <p class="health-note">
          Weighted from service history (engine 35%, brakes 25%, tyres 20%, battery 20%),
          vehicle age (${h.ageYears} yr) and distance travelled.
          ${h.overdueCount ? `${h.overdueCount} overdue item${h.overdueCount === 1 ? "" : "s"} deducted.` : ""}
        </p>
      </article>`;
  }

  const barTone = (v) => (v >= 75 ? "success" : v >= 50 ? "warning" : "critical");

  /** Compact SVG ring used beside the health number. */
  function healthRing(value, tone) {
    const r = 42;
    const circumference = 2 * Math.PI * r;
    const offset = circumference * (1 - U.clamp(value, 0, 100) / 100);
    const color =
      tone === "success" ? "var(--success)" : tone === "warning" ? "var(--warning)" : "var(--critical)";
    return `
      <svg class="health-ring" width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
        <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--surface-sunken)" stroke-width="9"/>
        <circle cx="52" cy="52" r="${r}" fill="none" stroke="${color}" stroke-width="9"
                stroke-linecap="round" transform="rotate(-90 52 52)"
                stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"
                data-ring-offset="${offset}" style="transition:stroke-dashoffset 1100ms cubic-bezier(.16,1,.3,1)"/>
      </svg>`;
  }

  function alertsCard() {
    const rows = alertsCache.slice(0, 5).map(UI.alertRow).join("");
    return `
      <article class="card">
        <div class="card__head">
          <span class="card__title">Active alerts</span>
          <span class="count-note">${U.pad2(alertsCache.length)} generated</span>
        </div>
        <div class="alert-list">${rows}</div>
        <div class="divider"></div>
        <div class="quick-actions">
          <button class="quick-action" data-action="maintenance:new">${I.get("wrench", { size: 17 })}<span>Log service</span></button>
          <button class="quick-action" data-action="wash:new">${I.get("droplet", { size: 17 })}<span>Record wash</span></button>
          <button class="quick-action" data-action="expense:new">${I.get("rupee", { size: 17 })}<span>Add expense</span></button>
          <button class="quick-action" data-action="nav:wash">${I.get("activity", { size: 17 })}<span>Wash advisor</span></button>
        </div>
      </article>`;
  }

  function environmentCard(env, settings) {
    if (!env) {
      return `<article class="card"><div class="card__head"><span class="card__title">Environment</span></div>
        <p class="text-muted">Loading environmental data…</p></article>`;
    }
    const band = AC.constants.aqiBand(env.aqi);
    const dust = AC.environment.dustIndex(env);
    const dustBand = AC.constants.levelBand(dust);

    return `
      <article class="card">
        <div class="card__head">
          <span class="card__title">Environmental conditions</span>
          ${UI.statusPill(env.isDemo ? "Mock data" : "Live", env.isDemo ? "muted" : "success", { live: !env.isDemo })}
        </div>

        <div class="env-strip">
          <div class="env-cell">
            <div class="env-cell__label">Air quality</div>
            <div class="env-cell__value text-${band.tone === "success" ? "success" : band.tone}">${U.esc(env.aqi)}</div>
            <div class="env-cell__sub">${U.esc(band.label)}</div>
          </div>
          <div class="env-cell">
            <div class="env-cell__label">PM2.5</div>
            <div class="env-cell__value">${U.esc(env.pm25)}</div>
            <div class="env-cell__sub">µg/m³</div>
          </div>
          <div class="env-cell">
            <div class="env-cell__label">Road dust</div>
            <div class="env-cell__value text-${dustBand.tone === "success" ? "success" : dustBand.tone}">${Math.round(
      dust * 100
    )}</div>
            <div class="env-cell__sub">${U.esc(dustBand.label)}</div>
          </div>
          <div class="env-cell">
            <div class="env-cell__label">Weather</div>
            <div class="env-cell__value" style="font-size:var(--fs-lg)">${U.esc(env.weather)}</div>
            <div class="env-cell__sub">${U.esc(env.temperature)}°C · ${U.esc(env.humidity)}% RH</div>
          </div>
        </div>

        <div class="provider-line mt-4">
          ${I.get("pin", { size: 14 })}
          <span>${U.esc(env.location ? env.location.label : "Unknown")}</span>
          <span>·</span>
          <span>${U.esc(env.provider)}</span>
          <span>·</span>
          <span>Updated ${U.esc(new Date(env.fetchedAt).toLocaleTimeString())}</span>
          <button class="btn btn--ghost btn--sm" style="margin-left:auto" data-action="env:refresh">
            ${I.get("refresh", { size: 14 })}<span>Refresh</span>
          </button>
        </div>
        ${
          env.degraded
            ? `<div class="mt-4">${UI.banner(
                `Live provider unavailable (${U.esc(env.degraded)}) — showing offline data.`,
                "warning",
                "alert"
              )}</div>`
            : ""
        }

        <div class="divider"></div>
        <div class="card__head" style="margin-bottom:var(--sp-3)">
          <span class="card__title">Fleet exposure · last 6 months</span>
          <span class="count-note">${U.esc(U.unitLabel(settings.units))}</span>
        </div>
        <div class="chart-box" style="height:180px"><canvas id="dashExposureChart"></canvas></div>
      </article>`;
  }

  function timelineCard(vehicle, settings) {
    if (!vehicle) return "";
    const records = AC.maintenance.forVehicle(vehicle.id).slice(0, 4);
    const schedule = AC.maintenance.scheduleFor(vehicle);
    const byType = schedule.reduce((acc, r) => {
      acc[r.type] = r;
      return acc;
    }, {});

    const items = records
      .map((r) => {
        const st = byType[r.type];
        const tone = st ? UI.toneForStatus(st.status) : "success";
        return `
          <li class="timeline__item timeline__item--${tone}">
            <span class="timeline__dot"></span>
            <div class="timeline__title">${U.esc(AC.constants.maintenanceLabel(r.type))}</div>
            <div class="timeline__meta">
              <span>${U.formatDate(r.date)}</span>
              <span>${U.formatDistance(r.odometer, settings.units)}</span>
              <span>${U.formatCurrency(r.cost)}</span>
            </div>
            ${
              st && st.dueOdometer
                ? `<div class="timeline__next">Next service at ${U.formatDistance(
                    st.dueOdometer,
                    settings.units
                  )} · ${UI.statusPill(AC.maintenance.STATUS_META[st.status].label, tone)}</div>`
                : ""
            }
          </li>`;
      })
      .join("");

    return `
      <article class="card">
        <div class="card__head">
          <span class="card__title">Maintenance timeline · ${U.esc(vehicle.name)}</span>
          <button class="btn btn--ghost btn--sm" data-action="nav:maintenance">Open</button>
        </div>
        ${
          items
            ? `<ul class="timeline">${items}</ul>`
            : `<p class="text-muted">No maintenance recorded for this vehicle yet.</p>`
        }
      </article>`;
  }

  function spendCard() {
    return `
      <article class="card">
        <div class="card__head">
          <span class="card__title">Monthly spend · last 6 months</span>
          <button class="btn btn--ghost btn--sm" data-action="nav:expenses">Open</button>
        </div>
        <div class="chart-box"><canvas id="dashSpendChart"></canvas></div>
      </article>`;
  }

  /* --------------------------------------------------------------- mount -- */

  function mount(root) {
    // Health ring animation
    U.raf(() =>
      U.raf(() => {
        U.$$("[data-ring-offset]", root).forEach((c) => {
          c.style.strokeDashoffset = c.dataset.ringOffset;
        });
      })
    );

    if (AC.charts.available()) {
      // Monthly spend
      const series = AC.expenses.monthly({}, 6);
      AC.charts.bar("dashSpendChart", {
        labels: series.map((s) => s.label),
        data: series.map((s) => s.value),
        money: true,
        label: "Spend",
      });

      // Distance driven per month — the exposure the fleet actually accumulates
      const usage = AC.journeys.monthlyDistance(null, 6);
      AC.charts.line("dashExposureChart", {
        labels: usage.map((u) => u.label),
        data: usage.map((u) => u.value),
        label: "Distance",
        color: AC.charts.css("--viz-2", "#4aa8ff"),
        suffix: " km",
      });
    }

    // Alert action buttons
    U.$$("[data-alert-action]", root).forEach((btn) => {
      btn.addEventListener("click", () => {
        const alert = alertsCache.find((a) => a.id === btn.dataset.alertAction);
        if (!alert || !alert.action) return;
        if (alert.action.hash) AC.router.navigate(alert.action.hash);
        else if (alert.action.event) AC.app.dispatch(alert.action.event, alert.action.payload || {});
      });
    });
  }

  return { render, mount };
})();

  </script>

/* ===== js/pages/vehicles.js ===== */
/* ==========================================================================
   AutoCare Pro — pages/vehicles.js
   Full CRUD over the garage: add, view, edit, delete and set primary.
   ========================================================================== */

window.AC = window.AC || {};
AC.pages = AC.pages || {};

AC.pages.vehicles = (function () {
  "use strict";

  const U = AC.utils;
  const UI = AC.ui;
  const I = AC.icons;

  let filter = { q: "", fuel: "all", sort: "primary" };

  function render() {
    const settings = AC.storage.getSettings();
    const env = AC.environment.current();
    const vehicles = applyFilter(AC.vehicles.all());

    return `
      <section class="page">
        <header class="page-head">
          <div>
            <div class="page-head__eyebrow">Garage</div>
            <h1>Vehicles</h1>
            <p class="page-head__sub">
              Every vehicle you manage, with a live health score, the next service due and
              wash status computed from its own records.
            </p>
          </div>
          <div class="page-head__actions">
            <button class="btn" data-action="journey:new">${I.get("route", { size: 16 })}<span>Log journey</span></button>
            <button class="btn btn--primary" data-action="vehicle:new">${I.get("plus", { size: 16 })}<span>Add vehicle</span></button>
          </div>
        </header>

        ${toolbar(vehicles.length)}

        ${
          vehicles.length
            ? `<div class="grid grid--cards stagger">${vehicles
                .map((v) => card(v, settings, env))
                .join("")}</div>`
            : AC.vehicles.count() === 0
            ? UI.emptyState({
                icon: "car",
                title: "No vehicles registered",
                text: "Add your first vehicle to start tracking maintenance, expenses and health.",
                actionLabel: "Add vehicle",
                actionEvent: "vehicle:new",
              })
            : UI.emptyState({
                icon: "filter",
                title: "No vehicles match this filter",
                text: "Try a different search term or fuel type.",
              })
        }
      </section>`;
  }

  function toolbar(shown) {
    return `
      <div class="toolbar">
        <div class="field" style="min-width:220px">
          <input class="input" id="vehSearch" type="search" placeholder="Search name, make, model or registration"
                 value="${U.esc(filter.q)}" aria-label="Search vehicles" />
        </div>
        <select class="select" id="vehFuel" aria-label="Filter by fuel type">
          <option value="all">All fuel types</option>
          ${AC.constants.FUEL_TYPES.map(
            (f) => `<option value="${f}"${filter.fuel === f ? " selected" : ""}>${f}</option>`
          ).join("")}
        </select>
        <select class="select" id="vehSort" aria-label="Sort vehicles">
          <option value="primary"${filter.sort === "primary" ? " selected" : ""}>Primary first</option>
          <option value="health"${filter.sort === "health" ? " selected" : ""}>Lowest health first</option>
          <option value="odometer"${filter.sort === "odometer" ? " selected" : ""}>Highest odometer</option>
          <option value="name"${filter.sort === "name" ? " selected" : ""}>Name A–Z</option>
        </select>
        <div class="toolbar__spacer"></div>
        <span class="count-note">${U.pad2(shown)} shown</span>
      </div>`;
  }

  function applyFilter(list) {
    const q = filter.q.trim().toLowerCase();
    let out = list.filter((v) => {
      if (filter.fuel !== "all" && v.fuelType !== filter.fuel) return false;
      if (!q) return true;
      return [v.name, v.make, v.model, v.registration].join(" ").toLowerCase().includes(q);
    });

    if (filter.sort === "health") {
      out = U.sortBy(out, (v) => AC.health.calculateVehicleHealth(v).overall, "asc");
    } else if (filter.sort === "odometer") {
      out = U.sortBy(out, (v) => Number(v.odometer) || 0, "desc");
    } else if (filter.sort === "name") {
      out = U.sortBy(out, (v) => String(v.name).toLowerCase(), "asc");
    }
    return out;
  }

  function card(vehicle, settings, env) {
    const health = AC.health.calculateVehicleHealth(vehicle);
    const next = AC.maintenance.nextService(vehicle);
    const wash = AC.wash.calculateWashScore(vehicle, env);
    const washDays = U.daysBetween(vehicle.lastWashDate);

    return `
      <article class="vehicle-card${vehicle.isPrimary ? " is-primary" : ""}" data-vehicle="${U.esc(vehicle.id)}">
        ${vehicle.isPrimary ? '<span class="vehicle-card__ribbon">Primary</span>' : ""}

        <div class="vehicle-card__head">
          <span class="vehicle-card__badge">${I.get("car", { size: 22 })}</span>
          <div style="min-width:0">
            <h3 class="vehicle-card__name">${U.esc(vehicle.name)}</h3>
            <div class="vehicle-card__spec">
              ${U.esc(vehicle.fuelType)} · ${U.esc(vehicle.year)} · ${U.esc(vehicle.registration || "No reg.")}
            </div>
          </div>
        </div>

        <div class="flex-between">
          <div class="vehicle-card__odo">
            ${U.formatDistance(vehicle.odometer, settings.units, false)}<small>${U.unitLabel(settings.units)}</small>
          </div>
          ${UI.statusPill(health.band.label, health.band.tone)}
        </div>

        ${UI.progressBar({
          label: "Health",
          value: health.overall,
          tone: health.overall >= 75 ? "success" : health.overall >= 50 ? "warning" : "critical",
        })}

        <div class="vehicle-card__grid">
          <div class="vehicle-card__cell">
            <span class="k">Next service</span>
            <span class="v${next && next.remainingKm < 0 ? " text-critical" : ""}">${
              next && next.remainingKm !== null
                ? U.formatDistance(Math.abs(next.remainingKm), settings.units, false)
                : "—"
            }</span>
            <span class="k">${
              next
                ? `${U.esc(next.label)}${next.remainingKm < 0 ? " · overdue" : ""}`
                : "No history"
            }</span>
          </div>
          <div class="vehicle-card__cell">
            <span class="k">Wash score</span>
            <span class="v text-${wash.tone === "success" ? "success" : wash.tone}">${wash.score}</span>
            <span class="k">${U.esc(wash.status)}</span>
          </div>
          <div class="vehicle-card__cell">
            <span class="k">Last wash</span>
            <span class="v">${washDays === null ? "—" : U.pad2(washDays)}</span>
            <span class="k">${washDays === null ? "Not recorded" : "days ago"}</span>
          </div>
        </div>

        <div class="vehicle-card__actions">
          <button class="btn btn--sm" data-action="vehicle:view" data-id="${U.esc(vehicle.id)}">
            ${I.get("activity", { size: 14 })}<span>Details</span>
          </button>
          <button class="btn btn--sm" data-action="vehicle:edit" data-id="${U.esc(vehicle.id)}">
            ${I.get("edit", { size: 14 })}<span>Edit</span>
          </button>
          ${
            vehicle.isPrimary
              ? ""
              : `<button class="btn btn--sm" data-action="vehicle:primary" data-id="${U.esc(vehicle.id)}">
                   ${I.get("star", { size: 14 })}<span>Set primary</span>
                 </button>`
          }
          <button class="btn btn--sm btn--icon btn--danger" data-action="vehicle:delete"
                  data-id="${U.esc(vehicle.id)}" aria-label="Delete ${U.esc(vehicle.name)}">
            ${I.get("trash", { size: 14 })}
          </button>
        </div>
        ${vehicle.source === "demo" ? `<div>${UI.demoFlag()}</div>` : ""}
      </article>`;
  }

  /* --------------------------------------------------------------- mount -- */

  function mount(root) {
    const search = U.$("#vehSearch", root);
    if (search) {
      search.addEventListener(
        "input",
        U.debounce((e) => {
          filter.q = e.target.value;
          AC.router.refresh();
          const again = U.$("#vehSearch");
          if (again) {
            again.focus();
            again.setSelectionRange(again.value.length, again.value.length);
          }
        }, 260)
      );
    }

    const fuel = U.$("#vehFuel", root);
    if (fuel) {
      fuel.addEventListener("change", (e) => {
        filter.fuel = e.target.value;
        AC.router.refresh();
      });
    }

    const sort = U.$("#vehSort", root);
    if (sort) {
      sort.addEventListener("change", (e) => {
        filter.sort = e.target.value;
        AC.router.refresh();
      });
    }
  }

  return { render, mount };
})();

  </script>
  <script>
/* ===== js/pages/maintenance.js ===== */
/* ==========================================================================
   AutoCare Pro — pages/maintenance.js
   Service schedule (computed) + the record log (stored).
   ========================================================================== */

window.AC = window.AC || {};
AC.pages = AC.pages || {};

AC.pages.maintenance = (function () {
  "use strict";

  const U = AC.utils;
  const UI = AC.ui;
  const I = AC.icons;
  const M = AC.maintenance;
  const C = AC.constants;

  let state = { vehicleId: null, statusFilter: "all", typeFilter: "all" };

  function activeVehicle() {
    const vehicles = AC.vehicles.all();
    if (!vehicles.length) return null;
    const found = vehicles.find((v) => v.id === state.vehicleId);
    if (found) return found;
    const primary = AC.vehicles.primary();
    state.vehicleId = primary ? primary.id : vehicles[0].id;
    return AC.vehicles.get(state.vehicleId);
  }

  function render(params) {
    if (params && params.vehicleId) state.vehicleId = params.vehicleId;
    const settings = AC.storage.getSettings();
    const vehicle = activeVehicle();

    if (!vehicle) {
      return `
        <section class="page">
          ${header(null)}
          ${UI.emptyState({
            icon: "car",
            title: "No vehicles registered",
            text: "Maintenance records belong to a vehicle. Add one to begin logging services.",
            actionLabel: "Add vehicle",
            actionEvent: "vehicle:new",
          })}
        </section>`;
    }

    const schedule = M.scheduleFor(vehicle, { includeUnrecorded: true });
    const visible = schedule.filter(
      (row) => state.statusFilter === "all" || row.status === state.statusFilter
    );
    const records = M.forVehicle(vehicle.id).filter(
      (r) => state.typeFilter === "all" || r.type === state.typeFilter
    );

    const counts = {
      overdue: schedule.filter((r) => r.status === M.STATUS.OVERDUE).length,
      dueSoon: schedule.filter((r) => r.status === M.STATUS.DUE_SOON).length,
      upcoming: schedule.filter((r) => r.status === M.STATUS.UPCOMING).length,
      unknown: schedule.filter((r) => r.status === M.STATUS.UNKNOWN).length,
    };

    return `
      <section class="page">
        ${header(vehicle)}

        <div class="maintenance-summary stagger">
          ${UI.metricCard({ label: "Overdue", value: counts.overdue, format: "pad", icon: "alert", tone: counts.overdue ? "critical" : "success", foot: "Past interval" })}
          ${UI.metricCard({ label: "Due soon", value: counts.dueSoon, format: "pad", icon: "clock", tone: counts.dueSoon ? "warning" : "", foot: "Within 500 km / 15 days" })}
          ${UI.metricCard({ label: "Upcoming", value: counts.upcoming, format: "pad", icon: "check", foot: "Within interval" })}
          ${UI.metricCard({ label: "Total spend", value: M.totalCost(vehicle.id), format: "money", icon: "rupee", foot: `${records.length} records` })}
        </div>

        ${UI.sectionHead(
          "Service schedule",
          "Computed from the latest record of each type against the manufacturer interval.",
          `<select class="select" id="statusFilter" style="min-width:170px" aria-label="Filter schedule by status">
             <option value="all"${state.statusFilter === "all" ? " selected" : ""}>All statuses</option>
             <option value="overdue"${state.statusFilter === "overdue" ? " selected" : ""}>Overdue</option>
             <option value="due-soon"${state.statusFilter === "due-soon" ? " selected" : ""}>Due soon</option>
             <option value="upcoming"${state.statusFilter === "upcoming" ? " selected" : ""}>Upcoming</option>
             <option value="unknown"${state.statusFilter === "unknown" ? " selected" : ""}>Not recorded</option>
           </select>`
        )}

        ${
          visible.length
            ? `<div class="service-grid">${visible.map((r) => serviceCard(r, vehicle, settings)).join("")}</div>`
            : UI.emptyState({ icon: "filter", title: "Nothing here", text: "No services match this status filter." })
        }

        ${UI.sectionHead(
          "Service records",
          "Everything logged for this vehicle.",
          `<select class="select" id="typeFilter" style="min-width:170px" aria-label="Filter records by type">
             <option value="all">All types</option>
             ${C.MAINTENANCE_TYPES.map(
               (t) => `<option value="${t.key}"${state.typeFilter === t.key ? " selected" : ""}>${t.label}</option>`
             ).join("")}
           </select>`
        )}

        ${records.length ? recordsTable(records, settings) : UI.emptyState({
          icon: "wrench",
          title: "No service records",
          text: "Log your first service to start the due-date and health calculations.",
          actionLabel: "Log maintenance",
          actionEvent: "maintenance:new",
        })}
      </section>`;
  }

  function header(vehicle) {
    const vehicles = AC.vehicles.all();
    return `
      <header class="page-head">
        <div>
          <div class="page-head__eyebrow">Service intelligence</div>
          <h1>Maintenance</h1>
          <p class="page-head__sub">
            AutoCare Pro tracks both deadlines — distance and time — for every service type and
            flags whichever arrives first.
          </p>
        </div>
        <div class="page-head__actions">
          ${
            vehicles.length > 1
              ? `<select class="select" id="vehiclePicker" aria-label="Select vehicle" style="min-width:200px">
                   ${vehicles
                     .map(
                       (v) =>
                         `<option value="${U.esc(v.id)}"${vehicle && v.id === vehicle.id ? " selected" : ""}>${U.esc(
                           v.name
                         )}</option>`
                     )
                     .join("")}
                 </select>`
              : ""
          }
          <button class="btn btn--primary" data-action="maintenance:new"${
            vehicle ? ` data-vehicle-id="${U.esc(vehicle.id)}"` : ""
          }>${I.get("plus", { size: 16 })}<span>Log maintenance</span></button>
        </div>
      </header>`;
  }

  function serviceCard(row, vehicle, settings) {
    const tone = UI.toneForStatus(row.status);
    const unknown = row.status === M.STATUS.UNKNOWN;

    const primaryNumber = unknown
      ? "—"
      : row.remainingKm !== null
      ? U.formatDistance(Math.abs(row.remainingKm), settings.units, false)
      : Math.abs(row.remainingDays);

    const primaryUnit = unknown
      ? "no record"
      : row.remainingKm !== null
      ? `${U.unitLabel(settings.units)} ${row.remainingKm < 0 ? "past due" : "remaining"}`
      : `days ${row.remainingDays < 0 ? "past due" : "remaining"}`;

    return `
      <article class="service-card service-card--${U.esc(row.status)}">
        <div class="service-card__head">
          <div>
            <h3 class="service-card__type">${U.esc(row.label)}</h3>
            <div class="service-card__meta">
              <span>${row.interval.km ? `${U.formatNumber(row.interval.km)} km` : "—"}</span>
              <span>${row.interval.months ? `${row.interval.months} months` : "—"}</span>
            </div>
          </div>
          ${UI.statusPill(M.STATUS_META[row.status].label, tone)}
        </div>

        <div class="service-card__remaining">
          <span class="n">${U.esc(primaryNumber)}</span>
          <span class="u">${U.esc(primaryUnit)}</span>
        </div>

        ${
          unknown
            ? `<p class="field__hint">No history for this service. Log one to activate tracking.</p>`
            : UI.progressBar({
                label: "Interval used",
                value: Math.round(U.clamp(row.consumed, 0, 1.5) * 100),
                max: 150,
                tone,
                suffix: "%",
              })
        }

        <div class="service-card__meta">
          ${
            row.record
              ? `<span>Last: ${U.formatDate(row.record.date)}</span>
                 <span>${U.formatDistance(row.record.odometer, settings.units)}</span>`
              : ""
          }
          ${row.dueDate ? `<span>Due: ${U.formatDate(row.dueDate)}</span>` : ""}
        </div>

        <button class="btn btn--sm btn--block" data-action="maintenance:new"
                data-vehicle-id="${U.esc(vehicle.id)}" data-type="${U.esc(row.type)}">
          ${I.get("plus", { size: 14 })}<span>Log ${U.esc(row.label.toLowerCase())}</span>
        </button>
      </article>`;
  }

  function recordsTable(records, settings) {
    return `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Service</th><th>Date</th><th>Odometer</th><th>Cost</th><th>Next due</th><th>Notes</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${records
              .map(
                (r) => `
              <tr>
                <td>
                  <span class="record-type"><span class="record-type__dot"></span>${U.esc(
                    C.maintenanceLabel(r.type)
                  )}</span>
                  ${r.source === "demo" ? ` ${UI.demoFlag()}` : ""}
                </td>
                <td class="num">${U.formatDate(r.date)}</td>
                <td class="num">${U.formatDistance(r.odometer, settings.units)}</td>
                <td class="num">${U.formatCurrency(r.cost)}</td>
                <td class="num text-muted">${
                  r.nextServiceOdometer
                    ? U.formatDistance(r.nextServiceOdometer, settings.units)
                    : r.nextServiceDate
                    ? U.formatDate(r.nextServiceDate)
                    : "Standard interval"
                }</td>
                <td class="text-muted">${U.esc(r.notes || "—")}</td>
                <td>
                  <div class="actions">
                    <button class="btn btn--sm btn--icon" data-action="maintenance:edit" data-id="${U.esc(r.id)}"
                            aria-label="Edit record">${I.get("edit", { size: 14 })}</button>
                    <button class="btn btn--sm btn--icon btn--danger" data-action="maintenance:delete" data-id="${U.esc(
                      r.id
                    )}" aria-label="Delete record">${I.get("trash", { size: 14 })}</button>
                  </div>
                </td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>
      </div>`;
  }

  function mount(root) {
    const picker = U.$("#vehiclePicker", root);
    if (picker) {
      picker.addEventListener("change", (e) => {
        state.vehicleId = e.target.value;
        AC.router.refresh();
      });
    }
    const status = U.$("#statusFilter", root);
    if (status) {
      status.addEventListener("change", (e) => {
        state.statusFilter = e.target.value;
        AC.router.refresh();
      });
    }
    const type = U.$("#typeFilter", root);
    if (type) {
      type.addEventListener("change", (e) => {
        state.typeFilter = e.target.value;
        AC.router.refresh();
      });
    }
  }

  return { render, mount, state };
})();

  </script>
  <script>
/* ===== js/pages/wash.js ===== */
/* ==========================================================================
   AutoCare Pro — pages/wash.js
   The Smart Wash Advisor. The gauge, the live conditions and the
   "Why this score?" breakdown all come from AC.wash.calculateWashScore().
   ========================================================================== */

window.AC = window.AC || {};
AC.pages = AC.pages || {};

AC.pages.wash = (function () {
  "use strict";

  const U = AC.utils;
  const UI = AC.ui;
  const I = AC.icons;
  const C = AC.constants;

  const GAUGE_R = 128;
  const CIRC = 2 * Math.PI * GAUGE_R;

  let state = { vehicleId: null };
  let lastResult = null;

  function activeVehicle() {
    const vehicles = AC.vehicles.all();
    if (!vehicles.length) return null;
    const found = vehicles.find((v) => v.id === state.vehicleId);
    if (found) return found;
    const primary = AC.vehicles.primary();
    state.vehicleId = primary ? primary.id : vehicles[0].id;
    return AC.vehicles.get(state.vehicleId);
  }

  function render(params) {
    if (params && params.vehicleId) state.vehicleId = params.vehicleId;
    const settings = AC.storage.getSettings();
    const env = AC.environment.current();
    const vehicle = activeVehicle();

    if (!vehicle) {
      return `
        <section class="page">
          ${header(null)}
          ${UI.emptyState({
            icon: "droplet",
            title: "No vehicles registered",
            text: "The wash advisor needs a vehicle before it can compute exposure and recommendations.",
            actionLabel: "Add vehicle",
            actionEvent: "vehicle:new",
          })}
        </section>`;
    }

    const result = AC.wash.calculateWashScore(vehicle, env);
    lastResult = result;

    return `
      <section class="page">
        ${header(vehicle)}

        ${
          result.conditions.degraded
            ? `<div style="margin-bottom:var(--sp-4)">${UI.banner(
                `Live environmental data is unavailable (${U.esc(
                  result.conditions.degraded
                )}). The score below uses offline reference data.`,
                "warning",
                "alert"
              )}</div>`
            : ""
        }

        <div class="wash-layout">
          ${gaugeCard(result, vehicle)}
          <div class="flex" style="flex-direction:column;gap:var(--sp-4)">
            ${conditionsCard(result, settings)}
            ${factorsCard(result)}
          </div>
        </div>

        ${UI.sectionHead("Environmental exposure", "Derived from the journeys logged for this vehicle.")}
        ${journeysCard(vehicle, settings)}

        ${UI.sectionHead("Wash history", "Each wash resets the time and usage factors.")}
        ${historyCard(vehicle, settings)}
      </section>`;
  }

  function header(vehicle) {
    const vehicles = AC.vehicles.all();
    return `
      <header class="page-head">
        <div>
          <div class="page-head__eyebrow">Environmental intelligence</div>
          <h1>Wash Advisor</h1>
          <p class="page-head__sub">
            A 0–100 recommendation built from elapsed time, pollution exposure, road dust and
            how far the vehicle has actually been driven — not a fixed weekly reminder.
          </p>
        </div>
        <div class="page-head__actions">
          ${
            vehicles.length > 1
              ? `<select class="select" id="washVehiclePicker" aria-label="Select vehicle" style="min-width:200px">
                   ${vehicles
                     .map(
                       (v) =>
                         `<option value="${U.esc(v.id)}"${vehicle && v.id === vehicle.id ? " selected" : ""}>${U.esc(
                           v.name
                         )}</option>`
                     )
                     .join("")}
                 </select>`
              : ""
          }
          <button class="btn" data-action="env:refresh">${I.get("refresh", { size: 16 })}<span>Refresh data</span></button>
          <button class="btn btn--primary" data-action="wash:new"${
            vehicle ? ` data-vehicle-id="${U.esc(vehicle.id)}"` : ""
          }>${I.get("droplet", { size: 16 })}<span>Record wash</span></button>
        </div>
      </header>`;
  }

  /* ---------------------------------------------------------------- gauge -- */

  function gaugeCard(result, vehicle) {
    const statusClass = `wash-status--${result.key}`;
    const ticks = [];
    for (let i = 0; i < 60; i += 1) {
      const angle = (i / 60) * Math.PI * 2;
      const long = i % 5 === 0;
      const r1 = GAUGE_R + 16;
      const r2 = r1 + (long ? 9 : 5);
      ticks.push(
        `<line x1="${150 + Math.cos(angle) * r1}" y1="${150 + Math.sin(angle) * r1}" x2="${
          150 + Math.cos(angle) * r2
        }" y2="${150 + Math.sin(angle) * r2}" opacity="${long ? 0.8 : 0.35}"/>`
      );
    }

    return `
      <article class="gauge-card corner-ticks">
        <div class="micro-label">Wash score · ${U.esc(vehicle.name)}</div>

        <div class="gauge">
          <svg viewBox="0 0 300 300" role="img" aria-label="Wash score ${result.score} out of 100">
            <g class="gauge__ticks">${ticks.join("")}</g>
            <circle class="gauge__track" cx="150" cy="150" r="${GAUGE_R}"/>
            <circle class="gauge__value" id="gaugeArc" cx="150" cy="150" r="${GAUGE_R}"
                    stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"
                    data-offset="${CIRC * (1 - result.score / 100)}"
                    style="stroke:${strokeFor(result.key)}"/>
          </svg>
          <div class="gauge__readout">
            <span class="gauge__num counter ${statusClass}" data-count="${result.score}"></span>
            <span class="gauge__caption">Wash score · 0–100</span>
          </div>
        </div>

        <div class="gauge__status ${statusClass}">${U.esc(result.status)}</div>
        <p class="gauge__message">${U.esc(result.message)}</p>

        <div class="provider-line">
          ${I.get("pin", { size: 14 })}
          <span>${U.esc(
            result.conditions.location ? result.conditions.location.label : "Unknown location"
          )}</span>
          <span>·</span>
          <span>${U.esc(result.conditions.provider || "mock")}</span>
          ${result.conditions.isDemo ? `<span>·</span><span>reference data</span>` : ""}
        </div>
      </article>`;
  }

  const strokeFor = (key) =>
    ({
      clean: "var(--success)",
      monitor: "var(--info)",
      soon: "var(--warning)",
      now: "var(--critical)",
    }[key] || "var(--accent-red-bright)");

  /* ----------------------------------------------------------- conditions -- */

  function conditionsCard(result, settings) {
    const c = result.conditions;
    const aqiBand = c.aqiBand || C.aqiBand(0);
    const dustBand = c.dustBand || C.levelBand(0);

    return `
      <article class="card">
        <div class="card__head">
          <span class="card__title">Current conditions</span>
          ${UI.statusPill(c.isDemo ? "Offline data" : "Live data", c.isDemo ? "muted" : "success", {
            live: !c.isDemo,
          })}
        </div>

        <div class="condition-grid">
          <div class="condition">
            <div class="condition__label">Days since wash</div>
            <div class="condition__value">${U.pad2(result.daysSinceWash)}<small>days</small></div>
            <div class="condition__sub">${
              result.tripsSinceWash
                ? `${result.tripsSinceWash} trip${result.tripsSinceWash === 1 ? "" : "s"} logged since`
                : "No trips logged since"
            }</div>
          </div>
          <div class="condition">
            <div class="condition__label">Distance travelled</div>
            <div class="condition__value">${U.formatDistance(
              result.distanceSinceWash,
              settings.units,
              false
            )}<small>${U.unitLabel(settings.units)}</small></div>
            <div class="condition__sub">Source: ${U.esc(result.distanceSource)}</div>
          </div>
          <div class="condition">
            <div class="condition__label">Air quality</div>
            <div class="condition__value text-${aqiBand.tone === "success" ? "success" : aqiBand.tone}">${U.esc(
      c.aqi ?? "—"
    )}</div>
            <div class="condition__sub">${U.esc(aqiBand.label)}</div>
          </div>
          <div class="condition">
            <div class="condition__label">Road dust</div>
            <div class="condition__value text-${dustBand.tone === "success" ? "success" : dustBand.tone}">${Math.round(
      (c.dust || 0) * 100
    )}</div>
            <div class="condition__sub">${U.esc(dustBand.label)}</div>
          </div>
          <div class="condition">
            <div class="condition__label">Weather</div>
            <div class="condition__value" style="font-size:var(--fs-lg)">${U.esc(c.weather || "—")}</div>
            <div class="condition__sub">${U.esc(c.temperature ?? "—")}°C · ${U.esc(c.humidity ?? "—")}% RH</div>
          </div>
          <div class="condition">
            <div class="condition__label">Soiling multiplier</div>
            <div class="condition__value">×${(AC.wash.WEATHER_MULTIPLIER[c.weather] || 1).toFixed(2)}</div>
            <div class="condition__sub">Applied to elapsed time</div>
          </div>
        </div>
      </article>`;
  }

  /* -------------------------------------------------------------- factors -- */

  function factorsCard(result) {
    return `
      <article class="card">
        <div class="card__head">
          <span class="card__title">Why this score?</span>
          <span class="count-note">${result.score} / 100</span>
        </div>

        ${result.factors.map(factorRow).join("")}

        <div class="divider"></div>
        <p class="field__hint">
          Weights: time 60 · pollution 20 · road dust 10 · usage 10. Each factor is computed
          independently and summed, so the recommendation can always be explained.
        </p>
      </article>`;
  }

  function factorRow(f) {
    const segments = 10;
    const filled = (f.points / f.max) * segments;
    const cells = Array.from({ length: segments }, (_, i) => {
      if (i + 1 <= Math.floor(filled)) return '<span class="factor__seg is-on"></span>';
      if (i < filled) return '<span class="factor__seg is-partial"></span>';
      return '<span class="factor__seg"></span>';
    }).join("");

    return `
      <div class="factor">
        <div class="factor__head">
          <span class="factor__name">${U.esc(f.name)}</span>
          <span class="factor__points">${U.esc(f.points)}<span> / ${U.esc(f.max)}</span></span>
        </div>
        <div class="factor__meter">${cells}</div>
        <span class="factor__note">${U.esc(f.note)}</span>
      </div>`;
  }

  /* ------------------------------------------------------------- journeys -- */

  function journeysCard(vehicle, settings) {
    const trips = AC.journeys.forVehicle(vehicle.id).slice(0, 6);
    const summary = AC.journeys.exposureSummary(vehicle.id);

    if (!trips.length) {
      return UI.emptyState({
        icon: "route",
        title: "No journeys logged",
        text: "Log a journey to feed distance, pollution and dust exposure into the wash score.",
        actionLabel: "Log journey",
        actionEvent: "journey:new",
      });
    }

    return `
      <article class="card">
        <div class="card__head">
          <span class="card__title">Recent journeys</span>
          <div class="flex gap-3" style="align-items:center">
            ${UI.statusPill(`Exposure ${summary.label}`, summary.tone)}
            <button class="btn btn--ghost btn--sm" data-action="journey:new">
              ${I.get("plus", { size: 14 })}<span>Log journey</span>
            </button>
          </div>
        </div>

        <div class="flex" style="flex-direction:column;gap:var(--sp-2)">
          ${trips
            .map(
              (t) => `
            <div class="journey">
              <div class="journey__route">
                <span class="journey__place">${U.esc(t.from)}</span>
                <span class="journey__arrow"></span>
                <span class="journey__place">${U.esc(t.to)}</span>
              </div>
